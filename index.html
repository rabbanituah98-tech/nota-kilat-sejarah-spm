/* ---------- Token: kertas, dakwat, pen biru (T4), pen merah (T5), stabilo kuning ---------- */
:root{
  --fs:1;
  --paper:#F3F6FB; --surface:#FFFFFF; --soft:#E9EEF8; --line:#D5DDEB;
  --ink:#12203D; --ink2:#4D5C7C;
  --biru:#1B45C2; --merah:#C2152D;
  --stabilo:#FFE14A; --stabilo-solid:#FFD91A; --stabilo-ink:#12203D;
  --ok:#17794A; --okbg:#E2F5EA; --no:#B3261E; --nobg:#FCE8E6;
  --pen:var(--biru);
  --shadow:0 1px 0 rgba(18,32,61,.05),0 10px 26px -16px rgba(18,32,61,.35);
  --r:10px; --head-h:92px; --side-w:292px;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Bricolage Grotesque","Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0B1220; --surface:#131C30; --soft:#1B2740; --line:#2B3955;
  --ink:#E9EEF8; --ink2:#A0B0CE;
  --biru:#8BAAFF; --merah:#FF8795;
  --stabilo:rgba(255,225,74,.22); --stabilo-solid:#8C7A10; --stabilo-ink:#FFE98C;
  --ok:#66D6A0; --okbg:#11301F; --no:#FF8F85; --nobg:#3A1816;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(17px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.6;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-disp);line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0 0 .9em}
a{color:var(--pen)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:.5rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
[hidden]{display:none!important}
svg.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Kepala ---------- */
.hdr{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr__row{display:flex;align-items:center;gap:.5rem;padding:.5rem .75rem}
.ib{display:inline-flex;align-items:center;gap:.4rem;min-height:2.5rem;min-width:2.5rem;justify-content:center;padding:.3rem .6rem;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;font-size:.9rem}
.ib:hover{background:var(--soft)}
.ib__t{display:none}
.brand{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);line-height:1.05;margin-right:auto;min-width:0;flex:0 1 auto;overflow:hidden;padding:.15rem 0}
.brand b{font-family:var(--f-disp);font-weight:800;font-size:1.12rem;white-space:nowrap}
.brand b span{background:linear-gradient(transparent 55%,var(--stabilo) 55%);padding:0 .12em}
.brand small{font-size:.74rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cari{position:relative;display:none;flex:1;max-width:30rem}
.cari svg{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--ink2)}
.cari input{width:100%;min-height:2.5rem;padding:.35rem 2.4rem .35rem 2.3rem;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.cari input::placeholder{color:var(--ink2)}
.cari kbd{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);font:inherit;font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:0 .35rem;color:var(--ink2);background:var(--surface)}
.hdr--cari .cari{display:block;order:9;flex-basis:100%;max-width:none}
.hdr--cari .hdr__row{flex-wrap:wrap}
.strip{display:flex;flex-wrap:wrap;gap:.1rem 1rem;justify-content:space-between;padding:.25rem .85rem;font-size:.8rem;background:var(--soft);color:var(--ink2);font-variant-numeric:tabular-nums}
.strip b{color:var(--ink)}
.bar{height:3px;background:transparent}
.bar i{display:block;height:100%;width:0;background:var(--pen)}
.hasil{position:absolute;left:0;right:0;top:100%;max-height:min(70vh,34rem);overflow:auto;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hasil__in{max-width:52rem;margin:0 auto;padding:.5rem .75rem 1rem}
.hasil__n{font-size:.85rem;color:var(--ink2);margin:.25rem 0 .5rem}
.hit{display:block;padding:.55rem .6rem;border-radius:8px;text-decoration:none;color:var(--ink);border:1px solid transparent}
.hit:hover,.hit:focus-visible{background:var(--soft);border-color:var(--line)}
.hit__w{display:block;font-size:.78rem;font-weight:700;color:var(--pen)}
.hit[data-t="5"] .hit__w{color:var(--merah)}
.hit__x{display:block;font-size:.92rem}
.hit__x b{background:var(--stabilo);color:var(--stabilo-ink);padding:0 .1em;border-radius:2px}

/* ---------- Susun atur ---------- */
.shell{display:flex;align-items:flex-start}
.side{position:fixed;z-index:35;left:0;top:var(--head-h);bottom:0;width:min(var(--side-w),86vw);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:.75rem .6rem 2rem;transform:translateX(-102%);transition:transform .22s ease;visibility:hidden}
.side.is-open{transform:none;visibility:visible}
.tirai{position:fixed;inset:0;z-index:34;background:rgba(8,14,28,.5)}
main{flex:1;min-width:0;padding:1rem 1rem 4rem}
main:focus{outline:none}
.wrap{max-width:46rem;margin:0 auto}
.wrap--lebar{max-width:64rem}

/* ---------- Sidebar ---------- */
.sn{display:flex;align-items:center;gap:.55rem;padding:.5rem .6rem;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:700;font-size:.95rem}
.sn:hover{background:var(--soft)}
.sn.is-on{background:var(--soft)}
.sg{margin-top:1rem}
.sg__h{font-size:.82rem;font-weight:800;padding:.2rem .6rem;display:flex;align-items:center;gap:.5rem;color:var(--biru)}
.sg__h::before{content:"";width:1.4rem;height:.3rem;border-radius:2px;background:currentColor}
.sg[data-t="5"] .sg__h{color:var(--merah)}
.sg__l{list-style:none;margin:.25rem 0 0;padding:0}
.sl{display:grid;grid-template-columns:1.7rem 1fr auto;gap:.35rem;align-items:start;padding:.42rem .6rem;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem;line-height:1.3;border-left:3px solid transparent}
.sl:hover{background:var(--soft)}
.sl__n{font-family:var(--f-disp);font-weight:800;color:var(--biru);font-variant-numeric:tabular-nums}
.sg[data-t="5"] .sl__n{color:var(--merah)}
.sl__s{font-size:.72rem;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:.1rem}
.sl.is-done .sl__s{color:var(--ok);font-weight:700}
.sl.is-on{background:var(--soft);border-left-color:var(--biru);font-weight:700}
.sg[data-t="5"] .sl.is-on{border-left-color:var(--merah)}
.sf{margin-top:1.25rem;padding:.75rem .6rem 0;border-top:1px solid var(--line);font-size:.88rem;color:var(--ink2)}
.sf__r{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.6rem}
.sf .ib{min-height:2.2rem}
.meter{height:.5rem;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:.35rem}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;width:0;transition:width .3s}

/* ---------- Butang ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.75rem;padding:.5rem 1rem;border-radius:9px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{background:var(--soft)}
.btn--p{background:var(--pen);border-color:var(--pen);color:#fff}
:root[data-theme="dark"] .btn--p{color:#0B1220}
.btn--p:hover{background:var(--pen);filter:brightness(1.08)}
.btn--k{background:#FFD91A;border-color:#FFD91A;color:#12203D}
.btn--k:hover{background:#FFD91A;filter:brightness(1.06)}
.btn--k[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn--s{min-height:2.3rem;padding:.3rem .75rem;font-size:.9rem;border-width:1px;border-color:var(--line)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------- Stabilo: tanda kata kunci ---------- */
mark.k{background:linear-gradient(transparent 14%,var(--stabilo) 14%,var(--stabilo) 90%,transparent 90%);color:var(--stabilo-ink);font-weight:700;padding:0 .14em;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.uji .nota mark.k{background:var(--stabilo-solid);color:transparent;cursor:pointer;border-radius:3px;user-select:none}
.uji .nota mark.k *{visibility:hidden}
.uji .nota mark.k.is-buka{background:linear-gradient(transparent 14%,var(--stabilo) 14%,var(--stabilo) 90%,transparent 90%);color:var(--stabilo-ink);cursor:default;user-select:auto}
.uji .nota mark.k.is-buka *{visibility:visible}

/* ---------- Laman utama ---------- */
.hero{display:grid;gap:1.5rem;padding:1rem 0 1.5rem}
.hero__k{font-weight:700;color:var(--pen);margin:0 0 .5rem}
.hero h1{font-size:clamp(2rem,7.2vw,3.5rem);font-weight:800;letter-spacing:-.025em;max-width:16ch}
.lead{font-size:1.1rem;color:var(--ink2);max-width:36rem;margin:.9rem 0 1.2rem}
.cta{display:flex;flex-wrap:wrap;gap:.6rem}
.oleh{margin:1.3rem 0 0;font-size:.95rem;color:var(--ink2);border-left:3px solid var(--merah);padding-left:.75rem;line-height:1.4}
.oleh strong{color:var(--ink)}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.1rem 1rem;box-shadow:var(--shadow);align-self:start}
.demo__t{font-family:var(--f-disp);font-weight:800;margin:0 0 .5rem}
.demo__x{font-size:1.12rem;line-height:2.1rem;margin:0 0 1rem;background-image:linear-gradient(transparent calc(100% - 1px),var(--line) calc(100% - 1px));background-size:100% 2.1rem}
.demo__h{font-size:.88rem;color:var(--ink2);margin:.7rem 0 0}
.blk{margin-top:2.2rem}
.blk__h{font-size:1.45rem;font-weight:800;margin-bottom:.8rem}
.peta{display:grid;grid-template-columns:repeat(10,1fr);gap:.3rem;max-width:30rem}
.peta a{aspect-ratio:1;border-radius:6px;border:1.5px solid var(--biru);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:.85rem;text-decoration:none;color:var(--biru)}
.peta a[data-t="5"]{border-color:var(--merah);color:var(--merah)}
.peta a.is-done{background:var(--biru);color:var(--surface)}
.peta a[data-t="5"].is-done{background:var(--merah)}
.peta__c{display:flex;flex-wrap:wrap;gap:.2rem 1.2rem;font-size:.9rem;color:var(--ink2);margin-top:.6rem}
.peta__c b{color:var(--ink)}
.langkah{list-style:none;margin:0;padding:0;display:grid;gap:.7rem;counter-reset:l}
.langkah li{counter-increment:l;display:grid;grid-template-columns:2.4rem 1fr;gap:.2rem .8rem;align-items:start;align-content:start}
.langkah li::before{content:counter(l);font-family:var(--f-disp);font-weight:800;font-size:1.6rem;line-height:1;color:var(--pen);grid-row:span 2}
.langkah b{font-family:var(--f-disp);font-size:1.05rem}
.langkah span{color:var(--ink2);grid-column:2}
.dua{display:grid;gap:1.6rem}
.sen{list-style:none;margin:0;padding:0;border-top:2px solid var(--biru)}
.sen[data-t="5"]{border-top-color:var(--merah)}
.sen__h{font-size:1.2rem;font-weight:800;color:var(--biru);margin-bottom:.45rem}
.sen__h[data-t="5"]{color:var(--merah)}
.row{display:grid;grid-template-columns:2.2rem 1fr auto;gap:.5rem;align-items:center;padding:.7rem .3rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.row:hover{background:var(--surface)}
.row__n{font-family:var(--f-disp);font-weight:800;font-size:1.35rem;color:var(--biru);font-variant-numeric:tabular-nums}
.sen[data-t="5"] .row__n{color:var(--merah)}
.row__t{font-weight:700;line-height:1.3}
.row__m{display:block;font-weight:400;font-size:.8rem;color:var(--ink2)}
.row__s{font-size:.8rem;color:var(--ink2);text-align:right;white-space:nowrap}
.row.is-done .row__s{color:var(--ok);font-weight:700}
.kaki{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.86rem;color:var(--ink2)}
.kaki p{margin:0 0 .5em}

/* ---------- Halaman bab ---------- */
[data-t="5"]{--pen:var(--merah)}
.bh{padding:.6rem 0 1rem;border-bottom:2px solid var(--pen)}
.bh__t{font-weight:700;color:var(--pen);margin:0}
.bh__w{display:flex;align-items:flex-start;gap:.9rem;margin-top:.2rem}
.bh__n{font-family:var(--f-disp);font-weight:800;font-size:clamp(3.4rem,15vw,5.6rem);line-height:.82;color:var(--pen);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bh h1{font-size:clamp(1.55rem,5.6vw,2.5rem);font-weight:800;letter-spacing:-.02em;padding-top:.15rem}
.bh__m{font-size:.85rem;color:var(--ink2);margin:.5rem 0 0}
.alat{display:flex;flex-wrap:wrap;gap:.45rem;margin:.9rem 0 0}
.lompat{display:flex;gap:.4rem;overflow-x:auto;padding:.7rem 0 .2rem;scrollbar-width:none}
.lompat::-webkit-scrollbar{display:none}
.lompat a{flex:none;font-size:.86rem;font-weight:700;padding:.3rem .7rem;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface)}
.lompat a:hover{border-color:var(--pen);color:var(--pen)}
.inti{margin:1.2rem 0 0;padding:1rem 1.1rem;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--stabilo-solid);border-radius:var(--r)}
.inti h2{font-size:1rem;font-weight:800;margin-bottom:.35rem}
.inti p{margin:0;font-size:1.08rem}
.sek{margin-top:2rem;scroll-margin-top:calc(var(--head-h) + 14px)}
.sek>h2{font-size:1.32rem;font-weight:800;margin-bottom:.6rem;display:flex;gap:.55rem;align-items:baseline}
.sek>h2 .no{color:var(--pen);font-variant-numeric:tabular-nums;flex:none}
.sek.is-kilat{animation:kilat 1.6s ease-out}
@keyframes kilat{0%{background:var(--stabilo)}100%{background:transparent}}
.nota ul{margin:0 0 .9rem;padding-left:1.15rem}
.nota li{margin:.38rem 0}
.nota li::marker{color:var(--pen)}
.nota ul ul{margin:.25rem 0 .35rem;list-style:"– ";padding-left:1.1rem}
.nota ul ul li{margin:.2rem 0}
.ingat{margin:.2rem 0 1rem;padding:.7rem .9rem;border-radius:8px;background:var(--nobg);border:1px solid color-mix(in srgb,var(--merah) 35%,transparent);display:grid;grid-template-columns:auto 1fr;gap:.6rem;align-items:start}
.ingat b.t{font-family:var(--f-disp);color:var(--merah);white-space:nowrap}
.tw{overflow-x:auto;margin:.2rem 0 1rem;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
.tw table.lebar{min-width:34rem}
th,td{padding:.5rem .65rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-family:var(--f-disp);font-weight:800;background:var(--soft);font-size:.9rem}
tr:last-child td{border-bottom:0}
td+td,th+th{border-left:1px solid var(--line)}
.garis{list-style:none;margin:0;padding:0 0 0 1.1rem;border-left:3px solid var(--pen)}
.garis li{position:relative;padding:.1rem 0 .85rem .3rem}
.garis li::before{content:"";position:absolute;left:-1.56rem;top:.45rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--surface);border:3px solid var(--pen)}
.garis b{font-family:var(--f-disp);font-weight:800;display:block;color:var(--pen);font-variant-numeric:tabular-nums}
.petua{display:grid;gap:.6rem}
.petua p{margin:0;padding:.8rem .95rem;background:var(--surface);border:1px dashed var(--ink2);border-radius:8px;position:relative}
.petua p::before{content:"";position:absolute;top:-.4rem;left:1rem;width:3.2rem;height:.8rem;background:var(--stabilo-solid);opacity:.85;transform:rotate(-2deg)}
.nilai{margin:0;padding-left:1.15rem}
.nilai li{margin:.3rem 0}
.kecil{font-size:.86rem;color:var(--ink2)}

/* Kad imbas */
.kad{perspective:1200px;margin-top:.4rem}
.kad__btn{display:block;width:100%;padding:0;border:0;background:none;text-align:left;border-radius:14px}
.kad__in{display:grid;transition:transform .45s;transform-style:preserve-3d}
.kad.is-flip .kad__in{transform:rotateY(180deg)}
.kad__f,.kad__b{grid-area:1/1;min-height:11rem;padding:1.2rem 1.2rem 2.4rem;border-radius:14px;border:2px solid var(--pen);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:var(--shadow)}
.kad__f{background:var(--surface);font-family:var(--f-disp);font-weight:700;font-size:1.25rem;line-height:1.25}
.kad__b{background:var(--pen);color:#fff;transform:rotateY(180deg);font-size:1.1rem;font-weight:700}
:root[data-theme="dark"] .kad__b{color:#0B1220}
.kad__l{position:absolute;left:1.2rem;bottom:.7rem;font-family:var(--f-body);font-size:.78rem;font-weight:400;opacity:.8}
.kad__nav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.7rem}
.kad__c{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink2)}

/* Kuiz */
.kq{margin:0 0 1rem;padding:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kq__q{font-weight:700;margin:0 0 .7rem;display:grid;grid-template-columns:auto 1fr;gap:.5rem}
.kq__q span{font-family:var(--f-disp);color:var(--pen)}
.ops{display:grid;gap:.45rem}
.op{display:grid;grid-template-columns:1.9rem 1fr;gap:.6rem;align-items:start;text-align:left;width:100%;padding:.6rem .7rem;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);line-height:1.35}
.op:hover:not(:disabled){border-color:var(--pen)}
.op b{display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--soft);font-family:var(--f-disp)}
.op:disabled{cursor:default;opacity:1}
.op.is-ok{border-color:var(--ok);background:var(--okbg)}
.op.is-ok b{background:var(--ok);color:var(--surface)}
.op.is-no{border-color:var(--no);background:var(--nobg)}
.op.is-no b{background:var(--no);color:var(--surface)}
.kq__e{margin:.7rem 0 0;padding:.6rem .75rem;border-radius:8px;background:var(--soft);font-size:.93rem}
.kq__e b{font-family:var(--f-disp)}
.kq__e.ok b{color:var(--ok)}
.kq__e.no b{color:var(--no)}
.skor{padding:1rem;border-radius:var(--r);border:2px solid var(--pen);background:var(--surface);display:grid;gap:.6rem;justify-items:start}
.skor__n{font-family:var(--f-disp);font-weight:800;font-size:2.4rem;line-height:1;color:var(--pen)}
.skor p{margin:0}
.maju{height:.45rem;background:var(--soft);border-radius:99px;overflow:hidden;margin:.3rem 0 1rem}
.maju i{display:block;height:100%;background:var(--pen);transition:width .25s}
.pilih{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 1rem}
.ulang{margin:.3rem 0 0;padding-left:1.15rem}

.hujung{margin-top:2.4rem;padding-top:1.2rem;border-top:1px solid var(--line);display:grid;gap:.8rem}
.hujung__n{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:space-between}
.hujung__n .btn{flex:1 1 12rem}

/* Teknik */
.tek h2{font-size:1.32rem;font-weight:800;margin:2rem 0 .6rem}
.tek dl{margin:0;display:grid;gap:.5rem}
.tek dt{font-family:var(--f-disp);font-weight:800;color:var(--pen)}
.tek dd{margin:0 0 .3rem}

/* Dialog & toast */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:1.2rem;width:min(26rem,calc(100vw - 2rem));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,14,28,.55)}
dialog h2{font-size:1.25rem;font-weight:800;margin-bottom:.7rem}
.rad{display:grid;gap:.35rem;margin:0 0 .9rem;padding:0;border:0}
.rad label,.cek{display:flex;gap:.6rem;align-items:center;padding:.5rem .6rem;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.rad input,.cek input{width:1.1rem;height:1.1rem;accent-color:var(--biru);flex:none}
.dlg__b{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,calc(100% + 2.5rem));visibility:hidden;background:var(--ink);color:var(--surface);padding:.65rem 1rem;border-radius:99px;font-weight:700;font-size:.92rem;z-index:60;transition:transform .25s,visibility .25s;max-width:calc(100vw - 2rem);text-align:center}
#toast.is-on{transform:translate(-50%,0);visibility:visible}
#cetak{display:none}

/* Telefon: jadual lebar disusun menegak supaya tidak perlu tatal ke tepi */
@media (max-width:43.99rem){
  .tw table.lebar{min-width:0;display:block}
  .tw table.lebar thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tw table.lebar tbody{display:block}
  .tw table.lebar tr{display:block;padding:.6rem .7rem;border-bottom:1px solid var(--line)}
  .tw table.lebar tr:nth-child(even){background:color-mix(in srgb,var(--soft) 55%,transparent)}
  .tw table.lebar tr:last-child{border-bottom:0}
  .tw table.lebar td{display:block;border:0;padding:.15rem 0}
  .tw table.lebar td::before{content:attr(data-l);display:block;font-size:.76rem;font-weight:700;color:var(--pen)}
  .tw table.lebar td.tajuk{font-family:var(--f-disp);font-weight:800;font-size:1.02rem}
  .tw table.lebar td.tajuk::before,.tw table.lebar td.kosong{display:none}
}

/* ---------- Skrin lebar ---------- */
@media (min-width:44rem){
  .ib__t{display:inline}
  .hero{grid-template-columns:1.25fr 1fr;align-items:center;gap:2.5rem;padding:2rem 0 2rem}
  .dua{grid-template-columns:1fr 1fr;gap:2.2rem}
  .langkah{grid-template-columns:repeat(3,1fr);gap:1.4rem}
  main{padding:1.4rem 2rem 5rem}
}
@media (min-width:62rem){
  #btnCari{display:none}
  .cari{display:block}
  .brand{margin-right:1rem}
  .hdr__tools{margin-left:auto}
  .side{position:sticky;transform:none;visibility:visible;flex:none;height:calc(100vh - var(--head-h));z-index:1;transition:none}
  .side-off .side{display:none}
  .tirai{display:none!important}
}
.hdr__tools{display:flex;gap:.4rem;flex:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* ---------- Cetak ---------- */
@media print{
  @page{margin:13mm 12mm}
  html{font-size:10.5pt}
  body{background:#fff;color:#000}
  .hdr,.shell,dialog,#toast,.skip{display:none!important}
  #cetak{display:block}
  #cetak .c-bab{break-before:page;page-break-before:always}
  #cetak .c-bab:first-of-type{break-before:auto;page-break-before:auto}
  #cetak .c-muka{border-bottom:2pt solid #000;padding-bottom:6pt;margin-bottom:10pt}
  #cetak .c-muka h1{font-size:19pt}
  #cetak .c-muka p{margin:2pt 0 0;font-size:9.5pt}
  #cetak h2{font-size:15pt;margin:0 0 2pt;border-bottom:1.5pt solid #000;padding-bottom:3pt}
  #cetak h2 small{font-family:var(--f-body);font-size:9pt;font-weight:400;display:block}
  #cetak h3{font-size:11.5pt;margin:9pt 0 3pt;break-after:avoid}
  #cetak p,#cetak li{orphans:2;widows:2}
  #cetak ul{margin:0 0 5pt;padding-left:14pt}
