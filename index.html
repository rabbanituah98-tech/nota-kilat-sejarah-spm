an terhadap Masjid al-Aqsa","Perang Iran-Iraq","Dasar Aparteid di Afrika Selatan","Konflik di Bosnia dan Herzegovina"],"a":0,"e":"OIC ditubuhkan di Rabat, Maghribi pada 25 September 1969."},{"q":"Apakah sumbangan Malaysia dalam PBB?","o":["Menjadi anggota tetap Majlis Keselamatan","Menghantar pasukan pengaman ke negara berkonflik","Menubuhkan Bank Pembangunan Islam","Mengumumkan ZOPFAN"],"a":1,"e":"Contohnya ke Congo, Somalia, Bosnia dan Herzegovina, Kemboja dan Lubnan."}],"mnem":["**5 pertubuhan: \"P-K-A-N-O\"** → **P**BB (dunia), **K**omanwel (bekas jajahan British), **A**SEAN (serantau), **N**AM (berkecuali), **O**IC (Islam).","**Tunku = Barat. Razak = Berkecuali.**","**ASEAN lahir 8-8-67; pengasas \"M-I-S-F-T\"** → Malaysia, Indonesia, Singapura, Filipina, Thailand.","**Faktor dasar luar: \"S-N-K-P\"** → **S**ejarah, **N**asional, **K**epimpinan, **P**ersekitaran luar."],"nilai":["**Bekerjasama dengan negara lain** demi keamanan dan kemakmuran bersama.","**Berbangga** dengan peranan Malaysia di persada dunia."],"t":5,"n":9,"title":"Dasar Luar Malaysia","id":"t5b9","inti":"Dasar luar Malaysia berubah daripada **probarat dan antikomunis (zaman Tunku)** kepada **berkecuali dan berbaik dengan semua negara (sejak Tun Abdul Razak)**. Malaysia aktif dalam **5 pertubuhan: PBB, Komanwel, ASEAN, NAM dan OIC**."},{"secs":[{"h":"10.1 Malaysia dalam Isu Global Kontemporari","blocks":[{"k":"tbl","head":["Isu","Tindakan Malaysia"],"rows":[["**Penyalahgunaan dadah**","Hukuman berat; kerjasama **INTERPOL**; **IDEC**; **Tun Dr. Mahathir** – Ketua Jawatankuasa Antidadah Antarabangsa (1988)"],["**Pertindihan sempadan**","Diselesaikan melalui **Mahkamah Antarabangsa**: **Pulau Sipadan dan Ligitan → Malaysia (2002)**; **Pulau Batu Putih → Singapura (2008)**. **Kepulauan Spratly** – belum selesai (China, Vietnam, Brunei, Filipina); dibincang dalam Forum ASEAN-China"],["**Kempen antiminyak sawit**","Dilancarkan pengeluar **minyak kacang soya (ASA)** dan **NGO alam sekitar** Eropah. Malaysia: **RSPO**, pensijilan **MSPO**, Amalan Pertanian Baik"],["**Pemerdagangan orang**","Malaysia menjadi **lokasi transit**; **Akta ATIPSOM 2007**; **MAPO (2008)**"],["**Penyakit berjangkit (AIDS)**","Pemeriksaan dan rawatan oleh Kementerian Kesihatan; pelan **NSPEA**; diperakui **WHO**"]]},{"k":"call","x":"Kata kunci jawapan: Malaysia menyelesaikan masalah **secara berhemah dan diplomasi**, tanpa konflik."}]},{"h":"10.2 Peranan Malaysia dalam Hubungan Ekonomi Antarabangsa","blocks":[{"k":"ul","items":[{"x":"**Meluaskan pasaran** – **AFTA (1992)** – Kawasan Perdagangan Bebas ASEAN; **mengurangkan tarif dan cukai**."},{"x":"**Menentang dominasi ekonomi negara maju** – negara maju mengenakan sekatan dan tarif; Malaysia menuntut **layanan saksama** di **PBB** dan **APEC**."},{"x":"**Kerjasama Pembangunan Segi Tiga** – **IMT-GT** (Indonesia–Malaysia–Thailand), **SIJORI** (Singapura–Johor–Riau), **BIMP-EAGA** (Brunei–Indonesia–Malaysia–Filipina)."},{"x":"**Menangani kemelesetan ekonomi 1997–1998:**","sub":["Punca: **kejatuhan nilai ringgit** akibat **spekulasi mata wang**.","Malaysia **menolak pelan IMF**.","Menggunakan **pendekatan sendiri**: **menambat ringgit pada RM3.80 = USD1**.","Ekonomi **berjaya dipulihkan**."]},{"x":"**Mengantarabangsakan sistem kewangan Islam** – sejak 2001; **pasaran sukuk terbesar di dunia**; menubuhkan **INCEIF**. (Sukuk = sijil kewangan Islam.)"}]}]},{"h":"10.3 Pelibatan Rakyat dalam Isu Kemanusiaan dan Keamanan","blocks":[{"k":"tbl","head":["Isu","Pelibatan Malaysia dan NGO"],"rows":[["**Palestin**","Disuarakan semua Perdana Menteri. NGO: **Aman Palestin**, **MAPIM**, **Cinta Gaza Malaysia**, **Muslim Care**. **Tabung Palestin**. Misi **Freedom Flotilla** – 12 sukarelawan di kapal **Mavi Marmara** ditawan Israel (2010)"],["**Syria**","Krisis sejak 2011. Malaysia sedia menerima **3000 pelarian Syria** (2015). NGO: **MyCare** (kempen i4Syria), **Cinta Syria Malaysia** (\"Sekolah KITA\"), **Global Peace Mission**"],["**Tsunami Aceh dan Sri ."},{"x":"**Kerelevanan organisasi antarabangsa** – Malaysia mengkritik penyalahgunaan **kuasa veto** kuasa besar (AS, Rusia, UK, Perancis, China); **Sidang Kemuncak Kuala Lumpur 2019**."},{"x":"**Hak asasi manusia, pelarian dan PATI** – kerjasama dengan **UNHCR**; **SUHAKAM (1999)**."},{"x":"Dasar luar Malaysia: **pragmatik, berprinsip dan berkecuali**."}]}]}],"dates":[["1983","Malaysia bangkitkan isu Antartika dalam NAM"],["Okt 1989","Deklarasi Langkawi"],["1992","AFTA; Sidang Kemuncak Bumi di Rio de Janeiro"],["1995","SEANWFZ"],["1997–1998","Kemelesetan ekonomi Asia; ringgit ditambat RM3.80"],["2002","Sipadan dan Ligitan menjadi milik Malaysia"],["2004","Tsunami Aceh dan Sri Lanka"],["2008","Pulau Batu Putih menjadi milik Singapura"],["2015","Komuniti ASEAN"]],"kad":[["Bagaimanakah isu Sipadan dan Ligitan diselesaikan?","Melalui Mahkamah Antarabangsa – menjadi milik Malaysia (2002)."],["Siapakah yang melancarkan kempen antiminyak sawit?","Pengeluar minyak kacang soya (ASA) dan NGO alam sekitar di Eropah."],["Bagaimanakah Malaysia menangani krisis ekonomi 1997?","Menolak pelan IMF dan menambat ringgit pada RM3.80 = USD1."],["Apakah AFTA?","Kawasan Perdagangan Bebas ASEAN (1992) – mengurangkan tarif dan cukai."],["Apakah Deklarasi Langkawi?","Komitmen Komanwel memelihara alam sekitar (Oktober 1989)."],["Apakah hasil Sidang Kemuncak Bumi 1992?","Agenda 21."],["Mengapakah Malaysia membangkitkan isu Antartika?","Penerokaannya didominasi segelintir negara; Malaysia mahu Antartika menjadi warisan manusia sejagat di bawah PBB."],["NGO yang diasaskan Dr. Jemilah Mahmood?","MERCY Malaysia (1999)."],["Apakah SEANWFZ?","Perjanjian Zon Bebas Senjata Nuklear Asia Tenggara (1995)."],["Bilakah Komuniti ASEAN ditubuhkan?","2015, melalui Deklarasi Kuala Lumpur."]],"kuiz":[{"q":"Bagaimanakah tuntutan bertindih Pulau Sipadan dan Ligitan diselesaikan?","o":["Melalui rundingan ASEAN","Melalui tindakan ketenteraan","Melalui keputusan Mahkamah Antarabangsa","Melalui referendum penduduk"],"a":2,"e":"Pada 2002 mahkamah memutuskan kedua-dua pulau milik Malaysia."},{"q":"Apakah langkah Malaysia menangani kemelesetan ekonomi 1997–1998?","o":["Menerima pinjaman IMF","Menambat kadar pertukaran ringgit","Menutup semua bank asing","Menghentikan eksport komoditi"],"a":1,"e":"Ringgit ditambat pada RM3.80 bagi USD1 dan pelan IMF ditolak."},{"q":"Mengapakah pengeluar minyak kacang soya melancarkan kempen antiminyak sawit?","o":["Minyak sawit menjejaskan jualan minyak kacang soya","Minyak sawit lebih mahal","Malaysia enggan mengeksport minyak sawit","Minyak sawit tidak halal"],"a":0,"e":"Minyak sawit ialah pesaing utama minyak kacang soya."},{"q":"Deklarasi Langkawi 1989 berkaitan dengan","o":["pembasmian dadah","perdagangan bebas","pemeliharaan alam sekitar","pelarian perang"],"a":2,"e":"Diisytiharkan semasa Mesyuarat Ketua-Ketua Negara Komanwel."},{"q":"Apakah cadangan Malaysia tentang Antartika?","o":["Dibahagikan antara negara ASEAN","Ditadbir oleh PBB sebagai warisan manusia sejagat","Dijadikan pangkalan tentera Komanwel","Diserahkan kepada 12 negara peneroka"],"a":1,"e":"Supaya hasilnya dapat dikongsi oleh semua negara."}],"mnem":["**5 isu global: \"D-S-M-O-P\"** → **D**adah, **S**empadan, **M**inyak sawit, **O**rang (pemerdagangan), **P**enyakit.","**Pulau: \"Sipadan-Ligitan kita (2002), Batu Putih Singapura (2008)\".**","**Krisis 1997: \"Tolak IMF, tambat 3.80\".**","**Alam sekitar ikut urutan: Langkawi 1989 → Rio 1992 → Kyoto 1997.**"],"nilai":["**Semangat kesukarelawanan** dan perikemanusiaan menaikkan nama negara.","**Pelihara alam sekitar** untuk generasi akan datang.","**Selesaikan konflik secara diplomasi.**"],"t":5,"n":10,"title":"Kecemerlangan Malaysia di Persada Dunia","id":"t5b10","inti":"Malaysia menangani **isu global secara diplomasi, bukan kekerasan**: dadah, sempadan, minyak sawit, krisis ekonomi 1997, Palestin, alam sekitar. Malaysia juga **lantang membela negara kecil** dan merancang masa depan melalui **Komuniti ASEAN**."}];

const HARI = ["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];
const BULAN = ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
function bakiHari(){
  if (!CONFIG.tarikhSejarah) return null;
  const p = CONFIG.tarikhSejarah.split("-").map(Number);
  const sasar = new Date(p[0], p[1] - 1, p[2]);
  const kini = new Date(); const hariIni = new Date(kini.getFullYear(), kini.getMonth(), kini.getDate());
  return Math.round((sasar - hariIni) / 86400000);
}
function detik(){
  const d = new Date();
  let j = d.getHours(); const m = d.getMinutes(), s = d.getSeconds();
  const waktu = j < 12 ? "pagi" : j < 14 ? "tengah hari" : j < 19 ? "petang" : "malam";
  const j12 = j % 12 === 0 ? 12 : j % 12;
  const dua = n => String(n).padStart(2, "0");
  $("#jam").innerHTML = "<b>" + HARI[d.getDay()] + ", " + d.getDate() + " " + BULAN[d.getMonth()] + " " + d.getFullYear() + "</b> &nbsp;" + j12 + ":" + dua(m) + ":" + dua(s) + " " + waktu;
  const b = bakiHari(); const el = $("#kira");
  if (b === null || b < 0) el.textContent = "";
  else if (b === 0) el.innerHTML = "<b>Hari ini kertas Sejarah SPM.</b> Semoga berjaya!";
  else el.innerHTML = "<b>" + b + " hari</b> lagi ke kertas Sejarah SPM " + CONFIG.tahunSPM;
}

let INDEKS = null;
function binaIndeks(){
  INDEKS = [];
  BAB.forEach((b, ci) => {
    const tambah = (s, label, teks) => { const p = polos(teks); INDEKS.push({ ci, s, label, p, low: p.toLowerCase() }); };
    tambah("inti", "Inti bab", b.title + ". " + b.inti);
    b.secs.forEach((sec, si) => {
      tambah("s" + si, sec.h, sec.h);
      sec.blocks.forEach(bl => {
        if (bl.k === "ul") bl.items.forEach(it => { tambah("s" + si, sec.h, it.x); (it.sub || []).forEach(x => tambah("s" + si, sec.h, x)); });
        else if (bl.k === "call") tambah("s" + si, sec.h, bl.x);
        else bl.rows.forEach(r => tambah("s" + si, sec.h, r.join(" – ")));
      });
    });
    b.dates.forEach(d => tambah("tarikh", "Tarikh wajib ingat", d[0] + ": " + d[1]));
    b.mnem.forEach(m => tambah("petua", "Petua ingat", m));
    b.kad.forEach(k => tambah("kad", "Kad imbas", k[0] + " " + k[1]));
  });
}
const q = $("#q"), hasil = $("#hasil");
function cari(){
  const teks = q.value.trim().toLowerCase();
  if (teks.length < 2) { hasil.hidden = true; hasil.innerHTML = ""; return; }
  if (!INDEKS) binaIndeks();
  const kata = teks.split(/\s+/).filter(Boolean);
  const jumpa = INDEKS.filter(e => kata.every(w => e.low.includes(w)));
  const tunjuk = jumpa.slice(0, 40);
  const petikan = e => {
    let i = e.low.indexOf(kata[0]); const mula = Math.max(0, i - 45), akhir = Math.min(e.p.length, i + 95);
    let t = (mula > 0 ? "…" : "") + e.p.slice(mula, akhir) + (akhir < e.p.length ? "…" : "");
    t = esc(t);
    kata.forEach(w => { t = t.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<b>$1</b>"); });
    return t;
  };
  hasil.innerHTML = '<div class="hasil__in"><p class="hasil__n">' +
    (jumpa.length ? jumpa.length + " hasil untuk “" + esc(q.value.trim()) + "”" + (jumpa.length > 40 ? " (40 teratas ditunjukkan)" : "")
                  : "Tiada hasil untuk “" + esc(q.value.trim()) + "”. Cuba ejaan lain atau perkataan yang lebih pendek, contohnya “Briggs” atau “1957”.") + "</p>" +
    tunjuk.map(e => { const b = BAB[e.ci]; return '<a class="hit" data-t="' + b.t + '" href="' + url(b) + "/" + e.s + '"><span class="hit__w">T' + b.t + " Bab " + b.n + ": " + esc(b.title) + " – " + esc(e.label) + '</span><span class="hit__x">' + petikan(e) + "</span></a>"; }).join("") + "</div>";
  hasil.hidden = false;
}

    '<section class="sek" id="kuiz"><h2><span>Kuiz pantas</span></h2><p class="kecil" id="kuizNota"></p><div id="kuizBox"></div></section>' +
    '<section class="sek" id="nilai"><h2><span>Nilai dan iktibar</span></h2><p class="kecil">Boleh digunakan untuk soalan “pada pendapat anda” dan soalan iktibar.</p><ul class="nilai">' + b.nilai.map(x => "<li>" + md(x) + "</li>").join("") + "</ul></section>" +
    '<div class="hujung"><button class="btn ' + (S.done[b.id] ? "" : "btn--p") + '" type="button" id="btnSelesai" aria-pressed="' + !!S.done[b.id] + '"></button>' +
      '<div class="hujung__n">' + (sblm ? '<a class="btn" href="' + url(sblm) + '">' + IC.kiri + "<span>" + nama(sblm) + "</span></a>" : "") +
      (slps ? '<a class="btn" href="' + url(slps) + '"><span>' + nama(slps) + "</span>" + IC.kanan + "</a>" : '<a class="btn" href="#/kuiz"><span>Cuba kuiz rawak</span>' + IC.kanan + "</a>") + "</div></div>" +
    "</article>";

  const art = $("#art");
  /* Mod uji ingatan */
  function setUji(on){
    modUji = on; art.classList.toggle("uji", on);
    const bt = $("#btnUji"); bt.setAttribute("aria-pressed", String(on)); $("span", bt).textContent = on ? "Tunjuk kata kunci" : "Sembunyi kata kunci";
    $$(".nota mark.k", art).forEach(m => { m.classList.remove("is-buka"); if (on) { m.tabIndex = 0; m.setAttribute("role", "button"); m.setAttribute("aria-label", "Kata kunci tersembunyi. Tekan untuk lihat."); } else { m.removeAttribute("tabindex"); m.removeAttribute("role"); m.removeAttribute("aria-label"); } });
    if (on) toast("Kata kunci disembunyikan. Tekan petak kuning untuk semak.");
  }
  $("#btnUji").addEventListener("click", () => setUji(!modUji));
  if (modUji) setUji(true);
  const buka = m => { if (modUji && m && !m.classList.contains("is-buka")) { m.classList.add("is-buka"); m.removeAttribute("aria-label"); } };
  art.addEventListener("click", e => buka(e.target.closest(".nota mark.k")));
  art.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".nota mark.k")) { e.preventDefault(); buka(e.target); } });

  $("#btnCetakBab").addEventListener("click", () => bukaCetak());
  $(".lompat", art).addEventListener("click", e => { const a = e.target.closest("a"); if (!a) return; e.preventDefault(); keSasaran(a.dataset.ke, false); });

  /* Selesai */
  const bS = $("#btnSelesai");
  const lukisS = () => { const d = !!S.done[b.id]; bS.innerHTML = d ? IC.semak + "<span>Bab ini sudah selesai (tekan untuk batal)</span>" : "<span>Tanda bab ini selesai</span>"; bS.classList.toggle("btn--p", !d); bS.setAttribute("aria-pressed", String(d)); };
  lukisS();
  bS.addEventListener("click", () => {
    if (S.done[b.id]) delete S.done[b.id]; else S.done[b.id] = true;
    simpan(); lukisS(); kemasSide(b.id);
    if (S.done[b.id]) { const n = bilSelesai(); toast(n === BAB.length ? "Syabas! Semua 20 bab selesai." : "Syabas! " + n + " daripada " + BAB.length + " bab selesai."); }
  });

  pasangKad(b); pasangKuizBab(b);
  document.title = "T" + b.t + " Bab " + b.n + ": " + b.title + " | Nota Last Minit Sejarah SPM";
  if (sasaran) setTimeout(() => keSasaran(sasaran, true), 60);
}
function keSasaran(id, kilat){
  const el = document.getElementById(id); if (!el) return;
  el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  if (kilat) { el.classList.remove("is-kilat"); void el.offsetWidth; el.classList.add("is-kilat"); }
}

/* Kad imbas */
function pasangKad(b){
  const box = $("#kadBox"); let senarai = b.kad.slice(), i = 0, flip = false;
  function lukis(){
    const k = senarai[i];
    box.innerHTML = '<div class="kad' + (flip ? " is-flip" : "") + '"><button class="kad__btn" type="button" aria-label="' + (flip ? "Jawapan: " + esc(k[1]) + ". Tekan untuk lihat soalan." : "Soalan: " + esc(k[0]) + ". Tekan untuk lihat jawapan.") + '"><div class="kad__in">' +
      '<div class="kad__f">' + esc(k[0]) + '<span class="kad__l">Tekan untuk lihat jawapan</span></div>' +
      '<div class="kad__b">' + esc(k[1]) + '<span class="kad__l">Jawapan</span></div></div></button></div>' +
      '<div class="kad__nav"><button class="btn btn--s" type="button" data-a="-1" aria-label="Kad sebelumnya">' + IC.kiri + '</button><span class="kad__c">Kad ' + (i + 1) + " / " + senarai.length + '</span><span><button class="btn btn--s" type="button" data-a="r" aria-label="Rombak susunan kad">' + IC.rombak + '</button> <button class="btn btn--s" type="button" data-a="1" aria-label="Kad seterusnya">' + IC.kanan + "</button></span></div>";
  }
  box.addEventListener("click", e => {
    if (e.target.closest(".kad__btn")) { flip = !flip; $(".kad", box).classList.toggle("is-flip", flip); const k = senarai[i]; $(".kad__btn", box).setAttribute("aria-label", flip ? "Jawapan: " + k[1] + ". Tekan untuk lihat soalan." : "Soalan: " + k[0] + ". Tekan untuk lihat jawapan."); return; }
    const t = e.target.closest("[data-a]"); if (!t) return;
    if (t.dataset.a === "r") { senarai = rombak(senarai); i = 0; toast("Kad dirombak."); }
    else i = (i + Number(t.dataset.a) + senarai.length) % senarai.length;
    flip = false; lukis();
    const f = box.querySelector('[data-a="' + t.dataset.a + '"]'); if (f) f.focus();
  });
  box.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { i = (i + 1) % senarai.length; flip = false; lukis(); $(".kad__btn", box).focus(); }
    if (e.key === "ArrowLeft") { i = (i - 1 + senarai.length) % senarai.length; flip = false; lukis(); $(".kad__btn", box).focus(); }
  });
  lukis();
}

/* Soalan kuiz (dikongsi oleh kuiz bab dan kuiz rawak) */
function soalanHTML(k, no){
  return '<div class="kq" data-no="' + no + '"><p class="kq__q"><span>' + (no + 1) + ".</span><span>" + esc(k.q) + '</span></p><div class="ops">' +
    k.o.map((o, j) => '<button class="op" type="button" data-j="' + j + '"><b>' + "ABCD"[j] + "</b><span>" + esc(o) + "</span></button>").join("") + "</div></div>";
}
function tandaJawapan(kq, k, j){
  const betul = j === k.a;
  $$(".op", kq).forEach((o, n) => { o.disabled = true; if (n === k.a) o.classList.add("is-ok"); else if (n === j) o.classList.add("is-no"); });
  kq.insertAdjacentHTML("beforeend", '<p class="kq__e ' + (betul ? "ok" : "no") + '"><b>' + (betul ? "Betul. " : "Belum tepat. Jawapannya " + "ABCD"[k.a] + ". ") + "</b>" + esc(k.e) + "</p>");
  return betul;
}
function pasangKuizBab(b){
  const box = $("#kuizBox"), nota = $("#kuizNota");
  let jawab = 0, markah = 0;
  const lukisNota = () => { nota.textContent = S.quiz[b.id] != null ? "Markah terbaik anda setakat ini: " + S.quiz[b.id] + "/5." : "Lima soalan. Jawapan dan penjelasan keluar serta-merta."; };
  function mula(){ jawab = 0; markah = 0; box.innerHTML = b.kuiz.map(soalanHTML).join("") + '<div id="kuizSkor"></div>'; lukisNota(); }
  box.addEventListener("click", e => {
    const u = e.target.closest("#btnUlang"); if (u) { mula(); keSasaran("kuiz", false); return; }
    const o = e.target.closest(".op"); if (!o || o.disabled) return;
    const kq = o.closest(".kq"), k = b.kuiz[Number(kq.dataset.no)];
    if (tandaJawapan(kq, k, Number(o.dataset.j))) markah++;
    jawab++;
    if (jawab === b.kuiz.length) {
      S.quiz[b.id] = Math.max(S.quiz[b.id] == null ? 0 : S.quiz[b.id], markah); simpan(); kemasSide(b.id); lukisNota();
      const pesan = markah === 5 ? "Cemerlang! Semua betul." : markah >= 4 ? "Bagus! Bab ini sudah kukuh." : markah >= 2 ? "Boleh diperbaiki. Baca semula bahagian yang salah, kemudian cuba lagi." : "Jangan putus asa. Baca nota sekali lagi dengan mod sembunyi kata kunci, kemudian cuba lagi.";
      $("#kuizSkor").innerHTML = '<div class="skor"><span class="skor__n">' + markah + "/5</span><p>" + pesan + '</p><button class="btn btn--s" type="button" id="btnUlang">Cuba lagi</button></div>';
    }
  });
  mula();
}

/* ---------- Paparan: Kuiz rawak ---------- */
function vKuiz(){
  const utama = $("#utama"); utama.removeAttribute("data-t");
  utama.innerHTML = '<div class="wrap"><header class="bh"><p class="bh__t">Uji diri</p><h1>Kuiz rawak</h1><p class="bh__m">Sepuluh soalan dipilih secara rawak. Di hujung kuiz, anda akan nampak bab mana yang perlu diulang kaji.</p></header><div id="kr"></div></div>';
  const kr = $("#kr");
  function pilihan(){
    kr.innerHTML = '<p style="margin-top:1.2rem;font-weight:700">Pilih skop soalan:</p><div class="pilih"><button class="btn" type="button" data-s="4">Tingkatan 4 sahaja</button><button class="btn" type="button" data-s="5">Tingkatan 5 sahaja</button><button class="btn btn--p" type="button" data-s="0">Campur T4 dan T5</button></div>';
  }
  function main(skop){
    let kolam = [];
    BAB.forEach(b => { if (!skop || b.t === skop) b.kuiz.forEach(k => kolam.push({ k, b })); });
    const set = rombak(kolam).slice(0, 10); let i = 0, markah = 0; const salah = [];
    function soal(){
      const { k, b } = set[i];
      kr.innerHTML = '<p class="kecil" style="margin:1rem 0 0">Soalan ' + (i + 1) + " daripada " + set.length + '</p><div class="maju"><i style="width:' + (i / set.length * 100) + '%"></i></div>' + soalanHTML(k, i) + '<div id="krN"></div>';
      const kq = $(".kq", kr);
      kq.addEventListener("click", e => {
        const o = e.target.closest(".op"); if (!o || o.disabled) return;
        if (tandaJawapan(kq, k, Number(o.dataset.j))) markah++; else salah.push(b);
        $("#krN").innerHTML = '<p class="kecil">Soalan ini daripada <a href="' + url(b) + '">' + nama(b) + ": " + esc(b.title) + '</a>.</p><button class="btn btn--p" type="button" id="krSeterus">' + (i + 1 < set.length ? "Soalan seterusnya" : "Lihat keputusan") + "</button>";
        $("#krSeterus").focus();
        $("#krSeterus").addEventListener("click", () => { i++; if (i < set.length) soal(); else tamat(); window.scrollTo({ top: 0 }); });
      });
    }
    function tamat(){
      const unik = []; salah.forEach(b => { if (!unik.includes(b)) unik.push(b); });
      const pesan = markah >= 9 ? "Cemerlang! Kekalkan momentum ini." : markah >= 7 ? "Bagus. Tinggal sedikit lagi untuk mantap." : markah >= 5 ? "Lulus, tetapi masih ada lompang. Ulang kaji bab di bawah." : "Belum cukup kuat. Mulakan dengan bab di bawah, satu demi satu.";
      kr.innerHTML = '<div class="skor" style="margin-top:1.2rem"><span class="skor__n">' + markah + "/" + set.length + "</span><p>" + pesan + "</p>" +
        (unik.length ? "<div><b>Bab yang perlu diulang kaji:</b><ul class=\"ulang\">" + unik.map(b => '<li><a href="' + url(b) + '">' + nama(b) + ": " + esc(b.title) + "</a></li>").join("") + "</ul></div>" : "") +
        '<button class="btn btn--p" type="button" id="krLagi">Kuiz baharu</button></div>';
      $("#krLagi").addEventListener("click", pilihan);
    }
    soal();
  }
  kr.addEventListener("click", e => { const s = e.target.closest("[data-s]"); if (s) main(Number(s.dataset.s)); });
  pilihan();
  document.title = "Kuiz rawak | Nota Last Minit Sejarah SPM";
}

/* ---------- Penghala ---------- */
function hala(){
  const h = location.hash || "#/";
  const m = h.match(/^#\/t([45])\/(\d+)(?:\/([\w-]+))?/);
  const utama = $("#utama");
  $("#barFill").style.width = "0";
  if (m) {
    const b = BAB.find(x => x.t === Number(m[1]) && x.n === Number(m[2]));
    if (b) { vBab(b, m[3]); kemasSide(b.id); if (!m[3]) window.scrollTo(0, 0); return; }
  }
  if (h.indexOf("#/kuiz") === 0) { vKuiz(); kemasSide("kuiz"); }
  else if (h.indexOf("#/teknik") === 0) { vTeknik(); kemasSide("teknik"); }

  window.scrollTo(0, 0);
}

/* ---------- Cetak ---------- */
const dlg = $("#dlgCetak");
function babSemasa(){ const m = (location.hash || "").match(/^#\/t([45])\/(\d+)/); return m ? BAB.find(x => x.t === Number(m[1]) && x.n === Number(m[2])) : null; }
function bukaCetak(){
  const b = babSemasa();
  const pil = [];
  if (b) pil.push(["bab", "Bab ini sahaja (" + nama(b) + ")"]);
  pil.push(["t4", "Semua Tingkatan 4 (10 bab)"], ["t5", "Semua Tingkatan 5 (10 bab)"], ["semua", "Semua 20 bab"]);
  $("#radCetak").innerHTML = "<legend class=\"kecil\" style=\"padding:0;margin-bottom:.4rem\">Apa yang hendak dicetak?</legend>" + pil.map((p, i) => '<label><input type="radio" name="skop" value="' + p[0] + '"' + (i === 0 ? " checked" : "") + "> " + esc(p[1]) + "</label>").join("");
  if (dlg.showModal) dlg.showModal(); else { isiCetak(b ? [b] : BAB, true); window.print(); }
}
$("#btnCetak").addEventListener("click", bukaCetak);
$("#btnBatal").addEventListener("click", () => dlg.close());
$("#frmCetak").addEventListener("submit", e => {
  e.preventDefault();
  const skop = (new FormData(e.target)).get("skop"), b = babSemasa();
  const senarai = skop === "bab" && b ? [b] : skop === "t4" ? BAB.filter(x => x.t === 4) : skop === "t5" ? BAB.filter(x => x.t === 5) : BAB;
  isiCetak(senarai, $("#cekLatih").checked);
  dlg.close();
  setTimeout(() => window.print(), 80);
});
function isiCetak(senarai, latih){
  const blok = bl => {
    if (bl.k === "ul") return "<ul>" + bl.items.map(it => "<li>" + md(it.x) + (it.sub ? "<ul>" + it.sub.map(x => "<li>" + md(x) + "</li>").join("") + "</ul>" : "") + "</li>").join("") + "</ul>";
    if (bl.k === "call") return '<p class="c-ingat">Ingat! ' + md(bl.x) + "</p>";
    return "<table><thead><tr>" + bl.head.map(h => "<th>" + md(h, false) + "</th>").join("") + "</tr></thead><tbody>" + bl.rows.map(r => "<tr>" + r.map(c => "<td>" + md(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
  };
  $("#cetak").innerHTML = '<div class="c-muka"><h1>Nota Last Minit Sejarah SPM</h1><p>Disediakan oleh ' + esc(CONFIG.guru) + ", " + esc(CONFIG.sekolah) + ". Berdasarkan Buku Teks Sejarah Tingkatan 4 dan 5 KSSM.</p></div>" +
    senarai.map(b => '<section class="c-bab"><h2><small>Tingkatan ' + b.t + ", Bab " + b.n + "</small>" + esc(b.title) + '</h2><p class="c-inti"><strong>Inti bab:</strong> ' + md(b.inti) + "</p>" +
      b.secs.map(s => "<h3>" + esc(s.h) + "</h3>" + s.blocks.map(blok).join("")).join("") +
      "<h3>Tarikh wajib ingat</h3><table><tbody>" + b.dates.map(d => "<tr><td style=\"width:26%\"><strong>" + esc(d[0]) + "</strong></td><td>" + esc(d[1]) + "</td></tr>").join("") + "</tbody></table>" +
      "<h3>Petua ingat</h3><ul>" + b.mnem.map(m => "<li>" + md(m, false) + "</li>").join("") + "</ul>" +
      "<h3>Nilai dan iktibar</h3><ul>" + b.nilai.map(m => "<li>" + md(m, false) + "</li>").join("") + "</ul>" +
      (latih ? "<h3>Kad imbas</h3><table><thead><tr><th>Soalan</th><th>Jawapan</th></tr></thead><tbody>" + b.kad.map(k => "<tr><td>" + esc(k[0]) + "</td><td>" + esc(k[1]) + "</td></tr>").join("") + "</tbody></table>" +
        "<h3>Kuiz pantas</h3><ol>" + b.kuiz.map(k => "<li>" + esc(k.q) + '<ul class="c-op">' + k.o.map((o, j) => "<li>" + "ABCD"[j] + ". " + esc(o) + "</li>").join("") + "</ul></li>").join("") + "</ol>" +
        "<p><strong>Jawapan:</strong> " + b.kuiz.map((k, n) => (n + 1) + ". " + "ABCD"[k.a]).join(" &nbsp; ") + "</p>" : "") +
      '<p class="c-kaki">' + esc(CONFIG.guru) + ", " + esc(CONFIG.sekolah) + "</p></section>").join("");
}
window.addEventListener("beforeprint", () => { if (!$("#cetak").innerHTML) { const b = babSemasa(); isiCetak(b ? [b] : BAB, true); } });
