patan."]},{"x":"**Politik (antarabangsa):**","sub":["Menjadi ahli **PBB** pada **17 September 1957** (anggota **ke-82**).","Menyertai **Komanwel** (pertubuhan negara merdeka bekas jajahan British).","Perjanjian pertahanan **AMDA 1957** dengan Britain.","Menyertai **Blok Sterling**; misi pengaman PBB di **Congo**."]},{"x":"**Ekonomi:**","sub":["**Rancangan Malaya Pertama (1956–1960)** – tumpuan **luar bandar**.","**FELDA (1956)** – memajukan tanah baharu dan penempatan semula.","**Bank Negara** beroperasi **26 Januari 1959**.","**Kementerian Pembangunan Luar Bandar** (1959); **Rancangan Buku Merah** (1961) – projek kemudahan asas."]},{"x":"**Sosial:**","sub":["**Penyata Rahman Talib** – bahasa Melayu sebagai bahasa pengantar.","**Dewan Bahasa dan Pustaka** ditubuhkan **22 Jun 1956** di **Johor Bahru**.","Jabatan Penerangan; hospital dan pusat kesihatan; bekalan elektrik dan air."]}]}]},{"h":"10.5 Prinsip Kedaulatan Persekutuan Tanah Melayu","blocks":[{"k":"ul","items":[{"x":"**Kedaulatan** = **kuasa tertinggi** yang menjadikan negara bebas daripada kongkongan kuasa luar."},{"x":"**5 aspek kedaulatan:**","sub":["**Wilayah pengaruh** – 11 negeri: Perlis, Kedah, Perak, Pulau Pinang, Selangor, Negeri Sembilan, Melaka, Pahang, Johor, Kelantan, Terengganu.","**Kerajaan** – dipilih rakyat melalui pilihan raya.","**Keunggulan undang-undang** – kerajaan dan rakyat tertakluk kepada undang-undang; **Perlembagaan** sebagai asas.","**Lambang** – bendera, Jata Negara, lagu kebangsaan.","**Rakyat** – memberi taat setia kepada negara."]}]}]}],"dates":[["22 Jun 1956","Dewan Bahasa dan Pustaka ditubuhkan"],["21 Ogos 1957","Stadium Merdeka siap"],["30 Ogos 1957 (malam)","Union Jack diturunkan di Padang Kelab Selangor"],["31 Ogos 1957 (pagi)","Pemasyhuran Kemerdekaan di Stadium Merdeka"],["17 Sept 1957","Menjadi ahli PBB ke-82"],["1957","Perjanjian AMDA"],["26 Jan 1959","Bank Negara mula beroperasi"],["1961","Rancangan Buku Merah"]],"kad":[["Apakah erti merdeka?","Bebas daripada cengkaman kuasa asing dan bebas menentukan pemerintahan serta hala tuju negara."],["Di manakah Union Jack diturunkan?","Padang Kelab Selangor, tengah malam 30 Ogos 1957."],["Di manakah Pemasyhuran Kemerdekaan dibaca?","Stadium Merdeka, pagi 31 Ogos 1957."],["Berapa kali \"Merdeka\" dilaungkan Tunku?","Tujuh kali."],["Siapakah wakil Queen Elizabeth II pada hari merdeka?","Duke of Gloucester."],["Lagu Negaraku berasal daripada lagu apa?","Terang Bulan, lagu negeri Perak."],["Siapakah pencipta bendera Persekutuan?","Mohamed Hamzah."],["Bilakah Tanah Melayu menyertai PBB?","17 September 1957, sebagai anggota ke-82."],["Apakah AMDA?","Perjanjian pertahanan Tanah Melayu dengan Britain (1957)."],["Gelaran Tunku Abdul Rahman?","Bapa Kemerdekaan Tanah Air."]],"kuiz":[{"q":"Peristiwa manakah yang berlaku di Padang Kelab Selangor pada tengah malam 30 Ogos 1957?","o":["Pembacaan Pemasyhuran Kemerdekaan","Penyerahan Surat Perlembagaan Serahan Kuasa","Penurunan bendera Union Jack","Istiadat mengangkat sumpah Yang di-Pertuan Agong"],"a":2,"e":"Penurunan Union Jack menandakan berakhirnya pentadbiran British."},{"q":"Apakah tujuan FELDA ditubuhkan?","o":["Memajukan tanah baharu untuk pertanian dan penempatan","Menguruskan kewangan negara","Membina sekolah di luar bandar","Mengawal harga getah"],"a":0,"e":"Keluarga luar bandar dipindahkan ke tanah rancangan untuk menanam getah atau kelapa sawit."},{"q":"Mengapakah Tanah Melayu menandatangani AMDA pada tahun 1957?","o":["Untuk menyertai PBB","Negara belum mempunyai kekuatan pertahanan sendiri","Untuk menamatkan darurat serta-merta","Syarat menyertai Blok Sterling"],"a":1,"e":"Negara memerlukan bantuan pertahanan Britain pada awal kemerdekaan."},{"q":"Menurut Tunku Abdul Rahman, kemerdekaan ibarat","o":["bebas selama-lamanya","pertempuran melawan sistem yang menindas","tempat perhentian dalam perjalanan yang jauh","menghidupkan sistem khalifah"],"a":2,"e":"Maksudnya kemerdekaan bukan penamat; negara masih perlu dibina."},{"q":"Institusi manakah yang ditubuhkan untuk memperkukuh bahasa Melayu sebagai bahasa kebangsaan?","o":["Jabatan Penerangan","Bank Negara","Kementerian Pembangunan Luar Bandar","Dewan Bahasa dan Pustaka"],"a":3,"e":"Ditubuhkan pada 22 Jun 1956 di Johor Bahru."}],"mnem":["**\"Padang malam, Stadium pagi\"** → Union Jack turun di **Padang** Kelab Selangor waktu **malam**; Pemasyhuran di **Stadium** Merdeka waktu **pagi**.","**Angka merdeka: 7 – 101 – 82** → 7 laungan \"Merdeka\", 101 das tembakan, ahli PBB ke-82.","**5 aspek kedaulatan: \"W-K-U-L-R\"** → **W**ilayah, **K**erajaan, **U**ndang-undang, **L**ambang, **R**akyat."],"nilai":["**Bersyukur dan hargai kemerdekaan** yang dicapai melalui muafakat tanpa pertumpahan darah.","**Pertahankan kedaulatan negara** dan hormati simbol rasmi negara."],"t":4,"n":10,"title":"Pemasyhuran Kemerdekaan","id":"t4b10","inti":"**31 Ogos 1957** – Tanah Melayu **merdeka** dan **berdaulat**. Malamnya **Union Jack diturunkan di Padang Kelab Selangor**; paginya **Tunku melaungkan \"Merdeka\" 7 kali di Stadium Merdeka**. Selepas itu negara mengamalkan **Raja Berperlembagaan dan Demokrasi Berparlimen**."},{"secs":[{"h":"1.1 Konsep Kedaulatan","blocks":[{"k":"ul","items":[{"x":"**Kedaulatan** = **kekuasaan tertinggi dan kewibawaan** sesebuah negara yang bebas serta berhak melaksanakan pemerintahan dan pentadbiran."}]},{"k":"tbl","head":["Bahasa","Perkataan","Maksud"],"rows":[["**Yunani**","*supernuus / superanus*","Agung atau tertinggi"],["**Inggeris**","*sovereignty*","Kuasa penuh terhadap pemerintahan"],["**Arab**","*daulah*","Kuasa pemerintahan sesebuah kerajaan"],["**Melayu**","daulat","Kekuasaan tertinggi terhadap pemerintahan negara"]]},{"k":"tbl","head":["Tokoh","Pandangan"],"rows":[["**Aristotle** (Yunani)","Kuasa tertinggi; kerajaan **terikat oleh undang-undang**"],["**Ibnu Khaldun** (ilmuwan Islam)","Kekuatan negara berasaskan **semangat kekitaan** bangsa dan agama"],["**Jean Bodin** (Perancis)","Kuasa tertinggi yang **kekal dan tidak terbatas** untuk membuat undang-undang"],["**Tunku Abdul Rahman**","Berdasarkan **kebebasan dan keadilan**; memperjuangkan kebajikan rakyat"],["**Tun Mohd Salleh Abas**","Asas negara merdeka; mengatur urusan dalam negeri **tanpa telunjuk asing**"]]},{"k":"ul","items":[{"x":"**4 jenis kedaulatan:**","sub":["**Tradisional** – pemerintahan **berkuasa mutlak**; kedaulatan pada **raja**, diperkukuh taat setia rakyat.","**Moden** – muncul selepas **Revolusi Keagungan dan Revolusi Perancis**; berkait **hak rakyat** dan **kerajaan berperlembagaan**.","**Undang-undang** – kerajaan dan rakyat **terikat oleh undang-undang**; **prinsip keempat Rukun Negara**.","**Antarabangsa** – **pengiktirafan PBB**; negara tidak boleh dicabuli negara lain. Malaysia ahli PBB ke-82 (17 September 1957)."]}]}]},{"h":"1.2 Ciri Negara yang Berdaulat","blocks":[{"k":"call","x":"**4 ciri: Pemerintahan, Sempadan, Perundangan, Rakyat.**"},{"k":"ul","items":[{"x":"**Mempunyai pemerintahan** – Malaysia mengamalkan **Raja Berperlembagaan dan Demokrasi Berparlimen**. **Ketua Utama Negara: Yang di-Pertuan Agong**. **Ketua Kerajaan: Perdana Menteri**, dibantu Jemaah Menteri.","sub":["**Raja Berperlembagaan** = pemerintahan beraja mengikut peruntukan Perlembagaan Persekutuan.","**Demokrasi Berparlimen** = demokrasi secara **perwakilan** melalui **pilihan raya**."]},{"x":"**Mempunyai sempadan** – garis pemisah negara. Malaysia bersempadan dengan **Singapura, Thailand, Indonesia, Brunei, Filipina**. Sempadan diakui **PBB**."},{"x":"**Mempunyai perundangan** – berpandukan **Perlembagaan Persekutuan**; **Parlimen** menggubal undang-undang."},{"x":"**Mempunyai rakyat** – pelbagai kaum, disatukan oleh **bahasa, kebudayaan, Rukun Negara** dan identiti nasional."}]}]},{"h":"1.3 Kepentingan Mewujudkan Negara Berdaulat","blocks":[{"k":"ul","items":[{"x":"**Keberkesanan pentadbiran** – bebas mentadbir **tanpa campur tangan luar**; melalui Jemaah Menteri, kementerian dan kerjasama Persekutuan–Negeri."},{"x":"**Kemakmuran ekonomi** – bebas melaksanakan dasar pembangunan (pertanian, perindustrian, perdagangan)."},{"x":"**Kesejahteraan sosial** – pendidikan, bahasa kebangsaan, kebudayaan, sukan dan Rukun Negara memupuk **perpaduan**."},{"x":"**Kecemerlangan hubungan luar** – berhak menjalin **hubungan diplomatik**, menggubal dasar luar dan menyertai pertubuhan antarabangsa; diiktiraf **setaraf dengan negara lain**."}]}]},{"h":"1.4 Langkah Mempertahankan Kedaulatan","blocks":[{"k":"tbl","head":["Langkah","Peranan pemerintah","Peranan rakyat"],"rows":[["**Kestabilan politik dan kemakmuran ekonomi**","Pentadbiran cekap; **elak rasuah**; agihan kekayaan adil","**Setia kepada raja dan negara**; menyokong dasar kerajaan; **mematuhi undang-undang**"],["**Mengekalkan perpaduan kaum**","Menggubal dasar perpaduan; program dan kempen","**Menghormati agama dan budaya** kaum lain; bertoleransi; menggunakan bahasa kebangsaan"],["**Memupuk patriotisme**","Sambutan **Hari Kebangsaan** dan Hari Pahlawan; **Sejarah mata pelajaran teras**; kempen dan filem","**Menghormati lambang negara** (Jalur Gemilang, Jata Negara, Negaraku); menaikkan imej negara"],["**Mengukuhkan pertahanan**","Dasar keselamatan; perjanjian pertahanan; **memodenkan aset tentera**","Peka isu keselamatan; **menyertai pasukan keselamatan/sukarelawan**; sanggup berkorban"]]},{"k":"ul","items":[{"x":"**Patriotisme** = perasaan **cinta yang mendalam terhadap negara** dan sanggup mempertahankannya."}]}]}],"dates":[["31 Ogos 1957","Kemerdekaan Tanah Melayu"],["17 Sept 1957","Diterima sebagai ahli PBB ke-82"],["16 Sept 1963","Pembentukan Malaysia"],["1970","Deklarasi Hubungan Persahabatan PBB"]],"kad":[["Apakah maksud kedaulatan?","Kekuasaan tertinggi dan kewibawaan negara yang bebas untuk memerintah dan mentadbir."],["Kedaulatan dalam bahasa Arab?","Daulah – kuasa pemerintahan sesebuah kerajaan."],["Empat ciri negara berdaulat?","Pemerintahan, sempadan, perundangan, rakyat."],["Empat jenis kedaulatan?","Tradisional, moden, undang-undang, antarabangsa."],["Siapakah Ketua Utama Negara dan Ketua Kerajaan?","Yang di-Pertuan Agong; Perdana Menteri."],["Kedaulatan undang-undang ialah prinsip Rukun Negara yang ke berapa?","Keempat."],["Apakah patriotisme?","Cinta yang mendalam terhadap negara dan sanggup mempertahankannya."],["Negara jiran yang bersempadan dengan Malaysia?","Singapura, Thailand, Indonesia, Brunei, Filipina."]],"kuiz":[{"q":"Apakah maksud kedaulatan dalam bahasa Yunani?","o":["Kuasa pemerintahan sesebuah kerajaan","Agung atau tertinggi","Kuasa penuh terhadap pemerintahan","Negara yang terikat dengan undang-undang"],"a":1,"e":"Perkataan Yunaninya supernuus atau superanus."},{"q":"Pengiktirafan PBB terhadap sesebuah negara merujuk kedaulatan","o":["tradisional","moden","undang-undang","antarabangsa"],"a":3,"e":"Kedaulatan antarabangsa bermaksud negara itu tidak boleh dicabuli negara lain."},{"q":"Antara yang berikut, yang manakah ciri negara berdaulat?","o":["Mempunyai tentera yang besar","Mempunyai sempadan","Mempunyai tanah jajahan","Mempunyai ekonomi maju"],"a":1,"e":"Empat ciri: pemerintahan, sempadan, perundangan dan rakyat."},{"q":"Bagaimanakah rakyat dapat memupuk patriotisme?","o":["Menggubal dasar perpaduan","Memodenkan aset ketenteraan","Menghormati lambang negara","Mengadakan perjanjian pertahanan"],"a":2,"e":"A, B dan D ialah peranan pemerintah."},{"q":"Menurut Ibnu Khaldun, kedaulatan sesebuah negara berasaskan","o":["semangat kekitaan bangsanya","kuasa mutlak raja","pengiktirafan negara luar","kekuatan ekonomi"],"a":0,"e":"Semangat kekitaan yang diiringi semangat beragama."}],"mnem":["**4 ciri negara berdaulat: \"P-S-P-R\"** → **P**emerintahan, **S**empadan, **P**erundangan, **R**akyat.","**4 jenis kedaulatan: \"T-M-U-A\"** → **T**radisional, **M**oden, **U**ndang-undang, **A**ntarabangsa.","**4 langkah pertahan kedaulatan: \"S-P-P-P\"** → **S**tabil politik/ekonomi, **P**erpaduan, **P**atriotisme, **P**ertahanan. Setiap satu ada peranan **pemerintah** dan **rakyat**."],"nilai":["**Kedaulatan negara bergantung pada rakyat yang bersatu padu.**","Hormati **kepelbagaian budaya dan agama** untuk mengukuhkan perpaduan."],"t":5,"n":1,"title":"Kedaulatan Negara","id":"t5b1","inti":"**Kedaulatan = kuasa tertinggi sesebuah negara yang bebas dan merdeka.** Negara berdaulat ada **4 ciri** (pemerintahan, sempadan, perundangan, rakyat) dan mesti dipertahankan oleh **pemerintah dan rakyat bersama-sama**."},{"secs":[{"h":"2.1 Latar Belakang Sejarah Perlembagaan","blocks":[{"k":"ul","items":[{"x":"**Perlembagaan** = **undang-undang tertinggi** yang menjadi teras pemerintahan negara."},{"x":"Asasnya: **nilai tradisi Kesultanan Melayu** + **prinsip undang-undang Inggeris** yang disesuaikan."},{"x":"**Undang-undang negeri Melayu** (sebelum British): **Hukum Kanun Melaka, Undang-Undang Laut Melaka**, Hukum Kanun Pahang, Undang-Undang Kedah, Undang-Undang Johor, **Undang-Undang 99 Perak**."},{"x":"**Undang-undang Inggeris** di Negeri-negeri Selat: ***Charter of Justice*** – tujuannya **melindungi penduduk daripada penindasan dan ketidakadilan**."}]},{"k":"tbl","head":["Charter of Justice","Tahun","Isi"],"rows":[["I","**1807**","Mewujudkan mahkamah di **Pulau Pinang**"],["II","**1826**","Menyatukan mahkamah Singapura, Melaka, Pulau Pinang"],["III","**1855**","Mahkamah berasingan: Singapura–Melaka dan Pulau Pinang"]]},{"k":"ul","items":[{"x":"**Sarawak** – Council Negri (Majlis Negeri); Perlembagaan Sarawak 1956 dan 1959."},{"x":"**Sabah** – Majlis Undangan dan Majlis Kerja (1950)."}]}]},{"h":"2.2 Sejarah Penggubalan Perlembagaan","blocks":[{"k":"tbl","head":["Tahun","Peristiwa"],"rows":[["**1877**","**Mesyuarat pertama Majlis Negeri Perak** (pengerusi **Raja Muda Yusuf**) – **titik tolak** pembentukan undang-undang negara"],["**1946**","Undang-undang digubal oleh Majlis Undangan Negeri (NNS), Majlis Persekutuan (NNMB) dan Majlis Negeri (NNMTB)"],["**1948**","**Perjanjian Persekutuan Tanah Melayu 1948** – pentadbiran, kuasa raja, perundangan, kewarganegaraan"],["**1957**","**Suruhanjaya Reid** – Perlembagaan 1957 bermodelkan **Westminster**; berkuat kuasa **31 Ogos 1957**"]]},{"k":"ul","items":[{"x":"**5 terma rujukan** Perlembagaan 1957:","sub":["**Kerajaan Persekutuan yang kukuh**.","Menjamin **kedudukan Raja-raja Melayu**.","Menjamin **kedudukan istimewa orang Melayu** dan kepentingan sah kaum lain.","Parlimen **dua dewan**: Dewan Rakyat dan Dewan Negara.","**Kewarganegaraan yang sama**."]}]}]},{"h":"2.3 Ciri Utama Perlembagaan Persekutuan","blocks":[{"k":"tbl","head":["Ciri tradisional (4)","Ciri moden (3)"],"rows":[["**Kesultanan / pemerintahan beraja** – YDPA pemerintah tertinggi; kuasa **mengampun**, melantik jawatan utama","**Kerajaan Persekutuan** – kuasa dibahagi antara Persekutuan dengan Negeri; Sarawak dan Sabah diberi **autonomi**"],["**Agama Islam** – di bawah kuasa raja negeri masing-masing; YDPA bagi Wilayah Persekutuan dan negeri tidak beraja","**Sistem Demokrasi Berparlimen** – pilihan raya; dikendalikan **Suruhanjaya Pilihan Raya (SPR)**"],["**Bahasa Melayu** – bahasa kebangsaan dan bahasa rasmi","**Kewarganegaraan** – diperkenalkan sejak 1948; taraf yang sama untuk semua"],["**Kedudukan istimewa orang Melayu dan bumiputera** Sarawak dan Sabah – dipelihara **YDPA**, bersama kepentingan sah kaum lain",""]]},{"k":"call","x":"Soalan kegemaran: bezakan ciri **tradisional** dengan ciri **moden**."}]},{"h":"2.4 Pindaan Perlembagaan 1963 dan 1965","blocks":[{"k":"ul","items":[{"x":"**Pindaan 1963** – kerana **pembentukan Malaysia** (Tanah Melayu + Sarawak + Sabah + Singapura). Tujuan: **menyesuaikan negeri baharu** tanpa mengubah kedudukan negeri sedia ada."},{"x":"**3 perkara utama pindaan 1963:**","sub":["**Struktur Mahkamah Atasan** – wujud **Mahkamah Persekutuan**; tiga Mahkamah Tinggi (Tanah Melayu; Sarawak dan Sabah; Singapura).","**Mahkamah Tinggi Borneo** – menguruskan kehakiman Sarawak dan Sabah; **Ketua Hakim Borneo** berpusat di **Kuching** (kini Ketua Hakim Sarawak dan Sabah, sejak 1994).","**Jawatan Yang di-Pertua Negeri** – ketua negeri Sarawak dan Sabah, dilantik **Yang di-Pertuan Agong**."]},{"x":"**Pindaan 1965** – **pindaan Singapura**. Dibawa **Tunku Abdul Rahman** ke Parlimen pada **7 Ogos 1965**; membolehkan **Singapura keluar daripada Malaysia** (9 Ogos 1965). Semua perkara berkaitan Singapura dimansuhkan."}]}]}],"dates":[["1807","Charter of Justice I – mahkamah di Pulau Pinang"],["1877","Mesyuarat pertama Majlis Negeri Perak"],["1948","Perjanjian Persekutuan Tanah Melayu"],["31 Ogos 1957","Perlembagaan Persekutuan Tanah Melayu berkuat kuasa"],["1963","Pindaan perlembagaan – pembentukan Malaysia"],["7 Ogos 1965","Pindaan Singapura diluluskan Parlimen"]],"kad":[["Apakah perlembagaan?","Undang-undang tertinggi yang menjadi teras pemerintahan negara."],["Apakah titik tolak pembentukan undang-undang negara?","Mesyuarat pertama Majlis Negeri Perak, 1877."],["Apakah tujuan Charter of Justice?","Melindungi penduduk daripada penindasan dan ketidakadilan."],["Empat ciri tradisional perlembagaan?","Pemerintahan beraja, agama Islam, bahasa Melayu, kedudukan istimewa orang Melayu dan bumiputera."],["Tiga ciri moden perlembagaan?","Kerajaan Persekutuan, Demokrasi Berparlimen, kewarganegaraan."],["Mengapakah perlembagaan dipinda pada 1963?","Menyesuaikan kemasukan Sarawak, Sabah dan Singapura dalam Malaysia."],["Apakah pindaan 1965?","Pindaan Singapura – membolehkan Singapura keluar daripada Malaysia."],["Model perlembagaan 1957?","Model Westminster dari Britain."]],"kuiz":[{"q":"Peristiwa manakah menjadi titik tolak pembentukan undang-undang negara?","o":["Pengenalan Charter of Justice 1807","Mesyuarat pertama Majlis Negeri Perak 1877","Perjanjian Persekutuan Tanah Melayu 1948","Penubuhan Suruhanjaya Reid"],"a":1,"e":"Majlis Negeri Perak menggubal undang-undang bagi negeri Perak, kemudian diikuti negeri lain."},{"q":"Antara yang berikut, yang manakah ciri moden Perlembagaan Persekutuan?","o":["Agama Islam","Pemerintahan beraja","Bahasa Melayu","Kewarganegaraan"],"a":3,"e":"Ciri moden: Kerajaan Persekutuan, Demokrasi Berparlimen dan kewarganegaraan."},{"q":"Badan manakah yang bertanggungjawab menjalankan pilihan raya?","o":["Suruhanjaya Pilihan Raya","Majlis Raja-Raja","Mahkamah Persekutuan","Dewan Negara"],"a":0,"e":"SPR ditubuhkan supaya pilihan raya dijalankan dengan adil."},{"q":"Apakah perkara utama dalam pindaan Perlembagaan 1963?","o":["Pemisahan Singapura","Penubuhan Suruhanjaya Reid","Pembentukan Mahkamah Tinggi Borneo","Pengenalan Charter of Justice"],"a":2,"e":"Juga struktur Mahkamah Atasan dan jawatan Yang di-Pertua Negeri."},{"q":"Siapakah yang memelihara kedudukan istimewa orang Melayu dan bumiputera Sarawak dan Sabah?","o":["Perdana Menteri","Yang di-Pertuan Agong","Ketua Hakim Negara","Yang di-Pertua Dewan Rakyat"],"a":1,"e":"Baginda juga memelihara kepentingan sah kaum lain."}],"mnem":["**Ciri tradisional: \"R-I-B-K\"** → **R**aja, **I**slam, **B**ahasa Melayu, **K**edudukan istimewa.","**Ciri moden: \"P-D-K\"** → **P**ersekutuan, **D**emokrasi, **K**ewarganegaraan.","**Pindaan: \"63 masuk, 65 keluar\"** → 1963 Sarawak, Sabah, Singapura masuk; 1965 Singapura keluar."],"nilai":["**Junjung keluhuran perlembagaan** dan patuhi undang-undang demi keamanan negara."],"t":5,"n":2,"title":"Perlembagaan Persekutuan","id":"t5b2","inti":"**Perlembagaan = undang-undang tertinggi negara.** Perlembagaan Malaysia unik kerana menggabungkan **ciri tradisional** (raja, Islam, bahasa Melayu, kedudukan istimewa) dengan **ciri moden** (persekutuan, demokrasi, kewarganegaraan). Ia dipinda pada **1963** (Malaysia) dan **1965** (Singapura keluar)."},{"secs":[{"h":"3.1 Latar Belakang Pemerintahan Beraja","blocks":[{"k":"tbl","head":["Zaman","Kedudukan raja"],"rows":[["**Kesultanan Melayu Melaka**","Raja **berkuasa mutlak** (pentadbiran, perundangan, kehakiman); ketua agama Islam; berpandukan Hukum Kanun Melaka"],["**Sebelum Perang Dunia Kedua**","British hanya dapat memperkenalkan **Sistem Residen (NNMB)** dan **Sistem Penasihat (NNMTB)**. Raja kekal **berdaulat**; negeri Melayu hanya **negeri naungan**"],["**Pendudukan Jepun**","Raja diiktiraf sebagai **ketua hal ehwal agama Islam**"],["**Malayan Union 1946**","Raja **kehilangan kuasa**"],["**Persekutuan Tanah Melayu 1948**","Kedaulatan raja **dikembalikan**"],["**Selepas merdeka 1957**","**Raja Berperlembagaan**; jawatan **Yang di-Pertuan Agong** diwujudkan"]]},{"k":"ul","items":[{"x":"**Undang-Undang Tubuh Kerajaan Johor 1895** dan **Undang-Undang Bagi Diri Kerajaan Terengganu 1911** – bukti awal ciri **Raja Berperlembagaan**; digubal untuk **menghalang peluasan pengaruh British**."},{"x":"Kesultanan **Kedah** – kerajaan **terawal** di negara kita."}]}]},{"h":"3.2 Majlis Raja-Raja","blocks":[{"k":"tbl","head":["Tahun","Perkembangan"],"rows":[["**1897**","**Durbar** dibentuk seiring penubuhan NNMB (Perak, Selangor, Pahang, Negeri Sembilan). Persidangan pertama di **Kuala Kangsar**. Pengerusi: **Pesuruhjaya Tinggi British**"],["**1946**","**Majlis Sultan-Sultan** (Malayan Union) – pengerusi Gabenor; **tidak pernah diwujudkan** kerana raja menentang Malayan Union"],["**1948**","**Majlis Raja-Raja ditubuhkan secara rasmi**; diurus sepenuhnya oleh Raja-raja Melayu"],["**Selepas 1957 / 1963**","Yang di-Pertua Negeri Melaka, Pulau Pinang, kemudian Sarawak dan Sabah menjadi ahli"]]},{"k":"ul","items":[{"x":"**Durbar** = perjumpaan/persidangan Raja Melayu dengan British."},{"x":"**Mohor Besar Raja-Raja** – lambang **kekuasaan dan kedaulatan** Raja-raja Melayu; disimpan oleh **Penyimpan Mohor Besar Raja-Raja**."},{"x":"Yang di-Pertua Negeri **tidak** menyertai mesyuarat pemilihan Yang di-Pertuan Agong."},{"x":"**Fungsi Majlis Raja-Raja:**","sub":["**Memilih Yang di-Pertuan Agong** dan Timbalannya.","**Memperkenankan pindaan perlembagaan** bagi perkara tertentu.","Memperkenankan perubahan **sempadan negeri**.","Memberi nasihat tentang **pelantikan jawatan** (Ketua Hakim Negara, Ketua Audit Negara, ahli SPR).","Dirujuk dalam perubahan dasar berkaitan **kedudukan istimewa orang Melayu dan bumiputera**.","Menjadi **Lembaga Pengampunan** bagi kes tertentu."]}]}]},{"h":"3.3 Yang di-Pertuan Agong (YDPA)","blocks":[{"k":"ul","items":[{"x":"**Ketua Utama Negara** – **Perkara 32** Perlembagaan Persekutuan."},{"x":"**Dipilih oleh Majlis Raja-Raja** daripada **9 Raja Melayu**; tempoh **5 tahun**."},{"x":"YDPA pertama: **Tuanku Abdul Rahman** (Negeri Sembilan), 31 Ogos 1957."},{"x":"**Sultan Abdul Halim** (Kedah) – dua kali menjadi YDPA (ke-5 dan ke-14)."}]},{"k":"tbl","head":["Kuasa","Butiran"],"rows":[["**Eksekutif**","Bertindak atas **nasihat Jemaah Menteri**; **melantik Perdana Menteri** dan menteri; melantik Peguam Negara, Panglima Angkatan Tentera, Ketua Audit Negara; **pemerintah tertinggi Angkatan Tentera**; melantik diplomat"],["**Perundangan**","**Memanggil, memberhentikan dan membubarkan Parlimen**; **memperkenankan rang undang-undang**; **mengisytiharkan darurat**"],["**Kehakiman**","**Melantik hakim** Mahkamah Atasan; **kuasa pengampunan**"],["**Agama**","Ketua agama Islam di negeri baginda, **Wilayah Persekutuan, Melaka, Pulau Pinang, Sarawak, Sabah**"],["**Hak istimewa**","Melindungi **kedudukan istimewa orang Melayu dan bumiputera** serta kepentingan sah kaum lain"]]}]},{"h":"3.4 Amalan Demokrasi dan Pengasingan Kuasa","blocks":[{"k":"ul","items":[{"x":"**Pilihan raya** – tanda amalan demokrasi; diadakan dalam tempoh **5 tahun**; undi adalah **rahsia**."},{"x":"**Kebebasan asasi** (hak asasi) dalam Perlembagaan:","sub":["**Kebebasan diri**.","**Kebebasan beragama** – Islam agama Persekutuan; agama lain bebas diamalkan.","**Hak pendidikan** – tiada diskriminasi.","**Kebebasan bersuara, berhimpun dan berpersatuan**."]},{"x":"Kebebasan asasi **tidak mutlak** – tertakluk kepada undang-undang (contoh: **Akta Hasutan 1948**). **SUHAKAM** melindungi hak asasi."}]},{"k":"call","x":"**Pengasingan kuasa = 3 badan.** YDPA ialah punca kuasa ketiga-tiganya."},{"k":"tbl","head":["Badan","Fungsi","Peringkat Persekutuan","Peringkat Negeri"],"rows":[["**Perundangan** (legislatif)","**Menggubal** undang-undang","**Parlimen** = YDPA + **Dewan Negara** + **Dewan Rakyat**","**Dewan Undangan Negeri (DUN)**"],["**Eksekutif** (pelaksana)","**Melaksanakan** dasar dan undang-undang","**Jemaah Menteri (Kabinet)** diketuai **Perdana Menteri**","**Majlis Mesyuarat Kerajaan Negeri (EXCO)**; Kabinet Negeri di Sarawak dan Sabah; diketuai Menteri Besar/Ketua Menteri"],["**Kehakiman** (judisiari)","**Mentafsir** undang-undang dan mempertahankan Perlembagaan","**Mahkamah** – diketuai **Ketua Hakim Negara**","Mahkamah Syariah; Mahkamah Anak Negeri (Sarawak dan Sabah)"]]},{"k":"ul","items":[{"x":"**Dewan Rakyat** – ahli **dipilih rakyat** melalui pilihan raya. **Dewan Negara (Senat)** – dewan tertinggi; membahaskan rang undang-undang dengan lebih teliti."},{"x":"Jemaah Menteri berpegang pada prinsip **tanggungjawab bersama (kolektif)**."},{"x":"**Hakim mesti bebas** daripada pengaruh politik."},{"x":"Tujuan pengasingan kuasa: **semak dan imbang** – kuasa tidak dibolot oleh satu pihak."}]}]},{"h":"3.5 Keunikan Demokrasi Berparlimen di Malaysia","blocks":[{"k":"ul","items":[{"x":"**Gabungan unsur tradisional dan moden** – raja (tradisional) + demokrasi model **Westminster** (moden)."},{"x":"**Mekanisme semak dan imbang** – raja **berkecuali** dalam politik; tiga badan saling mengimbangi."},{"x":"**Kuasa budi bicara raja** – YDPA boleh **melantik Perdana Menteri** dan **tidak memperkenankan pembubaran Parlimen** tanpa nasihat."},{"x":"**Kerjasama politik** – **perkongsian kuasa antara kaum**: Parti Perikatan (1954) → **Barisan Nasional**; Pakatan Harapan (2018); Perikatan Nasional (2020)."}]}]}],"dates":[["1895","Undang-Undang Tubuh Kerajaan Johor"],["1897","Durbar pertama di Kuala Kangsar"],["1911","Undang-Undang Bagi Diri Kerajaan Terengganu"],["1948","Majlis Raja-Raja ditubuhkan secara rasmi"],["1954","Parti Perikatan dibentuk"],["31 Ogos 1957","Yang di-Pertuan Agong pertama"]],"kad":[["Siapakah Ketua Utama Negara?","Yang di-Pertuan Agong (Perkara 32)."],["Siapakah yang memilih Yang di-Pertuan Agong?","Majlis Raja-Raja, untuk tempoh lima tahun."],["Apakah Durbar?","Persidangan Raja-raja Melayu NNMB dengan British, bermula 1897 di Kuala Kangsar."],["Tiga badan pemerintahan?","Perundangan, eksekutif, kehakiman."],["Tiga komponen Parlimen?","Yang di-Pertuan Agong, Dewan Negara, Dewan Rakyat."],["Fungsi badan kehakiman?","Mentafsir dan melaksanakan undang-undang serta mempertahankan Perlembagaan."],["Apakah kuasa budi bicara raja?","Kuasa yang dilaksanakan tanpa perlu mengikut nasihat ketua kerajaan, contohnya melantik Perdana Menteri."],["Mengapakah kuasa diasingkan?","Untuk mewujudkan semak dan imbang supaya kuasa tidak dibolot satu pihak."],["Apakah lambang kedaulatan Raja-raja Melayu?","Mohor Besar Raja-Raja."],["Badan eksekutif peringkat negeri di Semenanjung?","Majlis Mesyuarat Kerajaan Negeri (EXCO)."]],"kuiz":[{"q":"Badan manakah yang berfungsi menggubal undang-undang?","o":["Badan eksekutif","Badan kehakiman","Badan perundangan","Majlis Raja-Raja"],"a":2,"e":"Parlimen pada peringkat Persekutuan, DUN pada peringkat negeri."},{"q":"Antara yang berikut, yang manakah kuasa Yang di-Pertuan Agong dalam bidang perundangan?","o":["Melantik diplomat ke luar negara","Membubarkan Parlimen","Melantik hakim Mahkamah Atasan","Memerintah Angkatan Tentera"],"a":1,"e":"Baginda memanggil, memberhentikan dan membubarkan Parlimen serta memperkenankan rang undang-undang."},{"q":"Mengapakah Majlis Sultan-Sultan tidak pernah diwujudkan?","o":["Raja-raja Melayu menentang Malayan Union","British membatalkan cadangan itu","Tiada peruntukan dalam perlembagaan","Jepun menyerang Tanah Melayu"],"a":0,"e":"Raja-raja Melayu memulaukan Malayan Union."},{"q":"Apakah fungsi Majlis Raja-Raja?","o":["Menggubal undang-undang Persekutuan","Melantik Jemaah Menteri","Mengendalikan pilihan raya","Memilih Yang di-Pertuan Agong"],"a":3,"e":"Juga memperkenankan pindaan perlembagaan tertentu."},{"q":"Prinsip tanggungjawab bersama dalam Jemaah Menteri bermaksud","o":["menteri bebas mengkritik dasar kerajaan","setiap menteri mempertahankan keputusan Jemaah Menteri","menteri dilantik oleh Dewan Negara","menteri bertanggungjawab kepada mahkamah"],"a":1,"e":"Menteri yang tidak bersetuju hendaklah meletakkan jawatan."}],"mnem":["**3 badan: \"P-E-K = Gubal – Laksana – Tafsir\"** → **P**erundangan menggubal, **E**ksekutif melaksana, **K**ehakiman mentafsir.","**Parlimen = \"YDPA + 2 Dewan\"** (Dewan Negara, Dewan Rakyat).","**Keunikan demokrasi Malaysia: \"G-S-B-K\"** → **G**abungan tradisional-moden, **S**emak dan imbang, **B**udi bicara raja, **K**erjasama politik."],"nilai":["**Kesetiaan kepada raja dan negara** – prinsip kedua Rukun Negara.","**Tunaikan tanggungjawab mengundi** untuk memilih pemimpin berwibawa."],"t":5,"n":3,"title":"Raja Berperlembagaan dan Demokrasi Berparlimen","id":"t5b3","inti":"Malaysia menggabungkan **raja (tradisional)** dengan **demokrasi (moden)**. **Yang di-Pertuan Agong** ialah Ketua Utama Negara dan punca kuasa bagi **tiga badan**: **perundangan, eksekutif, kehakiman**. Kuasa diasingkan supaya ada **semak dan imbang**."},{"secs":[{"h":"4.1 Latar Belakang Sistem Persekutuan","blocks":[{"k":"ul","items":[{"x":"**Persekutuan** = penyatuan beberapa buah negeri membentuk sebuah **negara bersekutu**; ada **Kerajaan Pusat** dan **Kerajaan Negeri** serta **pembahagian kuasa**."},{"x":"**Konfederasi** = gabungan negeri berdaulat dalam ikatan yang **longgar**."}]},{"k":"tbl","head":["Tahun","Perkembangan"],"rows":[["**1895**","**Konfederasi Negeri Sembilan** – gabungan luak; Yang di-Pertuan Besar pertama: **Tuanku Muhammad** (1898)"],["**1896**","**Negeri-negeri Melayu Bersekutu (NNMB)** – Perak, Selangor, Pahang, Negeri Sembilan. Kuasa di tangan **Residen Jeneral** di Kuala Lumpur; **tiada agihan kuasa** yang jelas"],["**1927**","**Majlis Mesyuarat Persekutuan** distruktur semula"],["**1946**","**Malayan Union** – berbentuk **kesatuan** di bawah Gabenor; gagal"],["**1948**","**Persekutuan Tanah Melayu** – 9 negeri Melayu + 2 NNS; **kuasa Persekutuan dan Negeri ditetapkan** → **bermulanya era moden** amalan Persekutuan"],["**1957**","Persekutuan Tanah Melayu merdeka – **Kerajaan Persekutuan yang kuat**; YDPA sebagai ketua"],["**1963**","**Persekutuan Malaysia** – 11 negeri Tanah Melayu + Singapura + Sarawak + Sabah"]]}]},{"h":"4.2 Kuasa Kerajaan Persekutuan dan Kerajaan Negeri","blocks":[{"k":"ul","items":[{"x":"**3 peringkat kerajaan:** Persekutuan, Negeri, **Tempatan**."},{"x":"Kuasa **lebih besar** diberikan kepada Persekutuan supaya **kerajaan pusat kuat** → kestabilan dan kemajuan."}]},{"k":"tbl","head":["Senarai","Siapa menggubal","Contoh perkara"],"rows":[["**Senarai Persekutuan**","**Parlimen**","**Hal ehwal luar, pertahanan, keselamatan dalam negeri**, kewarganegaraan, **kewangan**, **pelajaran**, kesihatan, pengangkutan"],["**Senarai Negeri**","**DUN**","**Undang-undang Islam, tanah, pertanian dan perhutanan, kerajaan tempatan**, hari kelepasan negeri"],["**Senarai Bersama**","Parlimen **dan** DUN","**Kebajikan awam, biasiswa**, perlindungan haiwan liar dan taman negara, perancangan bandar, kesihatan awam, **kebudayaan dan sukan, perumahan**"]]},{"k":"call","x":"Jika bercanggah dalam Senarai Bersama, **undang-undang Parlimen mengatasi** (Perkara 75)."},{"k":"ul","items":[{"x":"**Peruntukan tambahan Sarawak dan Sabah:** undang-undang dan **adat anak negeri**, **Mahkamah Anak Negeri**, kereta api Sabah; kuasa **imigresen** (Akta Imigresen 1963)."},{"x":"**Kerajaan Tempatan / Pihak Berkuasa Tempatan (PBT)** – peringkat **ketiga**, di bawah **Kerajaan Negeri**; **Akta Kerajaan Tempatan 1976**. Jenis: Majlis Bandaraya, Majlis Perbandaran, Majlis Daerah.","sub":["Fungsi: **pembersihan**, lesen penjaja, kesihatan awam, kemudahan awam, saliran, jalan, perumahan awam."]},{"x":"**Putrajaya** – pusat pentadbiran Persekutuan sejak **1999**."}]}]},{"h":"4.3 Kerjasama Kerajaan Persekutuan dan Kerajaan Negeri","blocks":[{"k":"ul","items":[{"x":"Prinsip: **Persekutuan memberi wang dan kepakaran; Negeri menyediakan tanah**."}]},{"k":"tbl","head":["Bidang","Contoh"],"rows":[["**Pembangunan tanah**","**FELDA (1956)** – buka tanah baharu; **FELCRA (1966)** – pulih tanah terbiar; **Segitiga Jengka**, Pahang (ilham **Tun Abdul Razak**)"],["**Pembangunan wilayah** (selepas 1970)","**KEDA** (Kedah), **KESEDAR** (Kelantan), **KETENGAH** (Terengganu), **KEJORA** (Johor), **DARA** (Pahang), PERDA (Pulau Pinang)"],["**Koridor wilayah** (selepas 2005)","**Iskandar** (Johor, 2006), **NCER** (utara, 2007), **ECER** (pantai timur, 2007), **SCORE** (Sarawak, 2008), **SDC** (Sabah, 2008)"],["**Pemuliharaan khazanah negara**","**Taman negara** – PERHILITAN; Akta Perlindungan Hidupan Liar 1972. **Taman laut** – 42 pulau diwartakan sejak 1994. **Taman Negara Kinabalu** dan **Mulu** – Tapak Warisan Dunia **UNESCO (2000)**"],["**Perumahan rakyat**","Rumah kos rendah; **PPR (1997)**; **PR1MA**; Rumah Selangorku; PKNS"],["**Keselamatan**","**RASCOM** (Sarawak, 1972) dan **ESSCOM** (Sabah, 2013)"]]},{"k":"ul","items":[{"x":"**RASCOM** – Pemerintahan Keselamatan Kawasan Rajang; diisytiharkan **Tun Abdul Razak** pada **26 Mac 1972** kerana **ancaman komunis**; dibubarkan 1995."},{"x":"**ESSCOM** – Kawasan Keselamatan Khas Pantai Timur Sabah; ditubuhkan **1 April 2013** selepas **pencerobohan pengganas Sulu di Kampung Tanduo, Lahad Datu** (12 Februari 2013; **Ops Daulat**). Mengawal **10 daerah** (ESSZONE)."}]}]},{"h":"4.4 Faktor yang Mengukuhkan Sistem Persekutuan","blocks":[{"k":"ul","items":[{"x":"**Keluhuran Perlembagaan** – Perlembagaan ialah **undang-undang tertinggi**; undang-undang Parlimen dan DUN **tidak boleh bercanggah** dengannya."},{"x":"**Penyelarasan Persekutuan–Negeri:**","sub":["**Mesyuarat Menteri Besar dan Ketua Menteri** – dipengerusikan **Perdana Menteri**.","Majlis dalam Perlembagaan: **Majlis Kewangan Negara**, **Majlis Tanah Negara**, **Majlis Negara bagi Kerajaan Tempatan**.","Majlis lain: Majlis Keselamatan Negara, Majlis Air Negara, Majlis Perumahan Negara.","**Setiausaha Persekutuan** bagi Sarawak dan Sabah (sejak 1963)."]}]}]}],"dates":[["1895","Konfederasi Negeri Sembilan; Perjanjian Persekutuan"],["1896","NNMB berkuat kuasa"],["1948","Persekutuan Tanah Melayu – kuasa Persekutuan/Negeri ditetapkan"],["1956","FELDA ditubuhkan"],["16 Sept 1963","Persekutuan Malaysia"],["1966","FELCRA ditubuhkan"],["26 Mac 1972","RASCOM diisytiharkan"],["1 Apr 2013","ESSCOM ditubuhkan"]],"kad":[["Apakah maksud persekutuan?","Penyatuan beberapa negeri membentuk sebuah negara bersekutu dengan pembahagian kuasa pusat dan negeri."],["Tiga senarai pembahagian kuasa?","Senarai Persekutuan, Senarai Negeri, Senarai Bersama."],["Tanah terletak dalam senarai apa?","Senarai Negeri."],["Pertahanan dan pelajaran terletak dalam senarai apa?","Senarai Persekutuan."],["Apakah PBT?","Pihak Berkuasa Tempatan – kerajaan peringkat ketiga di bawah Kerajaan Negeri."],["Mengapakah ESSCOM ditubuhkan?","Pencerobohan pengganas Sulu di Lahad Datu, Sabah (2013)."],["Mengapakah RASCOM ditubuhkan?","Ancaman komunis di Sarawak (1972)."],["Fungsi FELCRA?","Menyatukan, memulihkan dan membangunkan tanah terbiar."],["Faktor yang mengukuhkan sistem Persekutuan?","Keluhuran Perlembagaan dan penyelarasan Persekutuan dengan Negeri."]],"kuiz":[{"q":"Antara yang berikut, yang manakah terletak dalam Senarai Negeri?","o":["Pertahanan","Kewarganegaraan","Tanah","Hal ehwal luar"],"a":2,"e":"Senarai Negeri: undang-undang Islam, tanah, pertanian, perhutanan, kerajaan tempatan."},{"q":"Mengapakah Kerajaan Persekutuan diberi kuasa yang lebih besar?","o":["Untuk mewujudkan kerajaan pusat yang kuat","Untuk melemahkan Raja-raja Melayu","Kerana negeri tidak mempunyai DUN","Untuk menghapuskan kerajaan tempatan"],"a":0,"e":"Kerajaan pusat yang kuat menjamin kestabilan dan kemajuan negara."},{"q":"Sekiranya undang-undang negeri bercanggah dengan undang-undang Persekutuan,","o":["undang-undang negeri diutamakan","kedua-duanya terbatal","perkara itu diputuskan Majlis Raja-Raja","undang-undang Persekutuan mengatasi undang-undang negeri"],"a":3,"e":"Perkara 75 Perlembagaan Persekutuan."},{"q":"Agensi manakah yang ditubuhkan untuk membuka tanah baharu?","o":["FELCRA","FELDA","PERHILITAN","PR1MA"],"a":1,"e":"FELDA (1956) membuka tanah baharu; FELCRA (1966) memulihkan tanah terbiar."},{"q":"Apakah peruntukan tambahan bagi Sarawak dan Sabah?","o":["Kuasa pertahanan sendiri","Mata wang sendiri","Mahkamah Anak Negeri","Hubungan luar sendiri"],"a":2,"e":"Juga undang-undang dan adat anak negeri serta kuasa imigresen."}],"mnem":["**Senarai Persekutuan = perkara \"besar\" seluruh negara** (luar, tentera, duit, sekolah). **Senarai Negeri = \"T-I-P-K\"** → **T**anah, **I**slam, **P**ertanian/perhutanan, **K**erajaan tempatan.","**Persekutuan bagi duit, Negeri bagi tanah.**","**RASCOM = Rajang, Sarawak, komunis (1972). ESSCOM = East Sabah, Sulu (2013).**"],"nilai":["**Bermusyawarah dan bekerjasama** antara semua peringkat kerajaan membawa kemajuan.","**Junjung keluhuran Perlembagaan.**"],"t":5,"n":4,"title":"Sistem Persekutuan","id":"t5b4","inti":"**Persekutuan = penyatuan beberapa negeri menjadi satu negara**, dengan kuasa dibahagi antara **Kerajaan Persekutuan** dan **Kerajaan Negeri** melalui **3 senarai** (Persekutuan, Negeri, Bersama). Kedua-duanya **bekerjasama** demi rakyat."},{"secs":[{"h":"5.1 Konsep Gagasan Malaysia","blocks":[{"k":"ul","items":[{"x":"**Gagasan Malaysia** = menggabungkan bekas tanah jajahan British di Asia Tenggara."},{"x":"Cadangan **Tunku Abdul Rahman**: gabungan **Persekutuan Tanah Melayu + Sarawak + Sabah + Singapura + Brunei** dalam satu Kerajaan Persekutuan."},{"x":"Idea lain sebelum itu: **Melayu Raya** (nasionalis; Tanah Melayu + Indonesia) – tidak berjaya."}]}]},{"h":"5.2 Perkembangan Idea dan Rasional Pembentukan","blocks":[{"k":"tbl","head":["Tahun","Idea"],"rows":[["**1887**","**Lord Brassey** – cadangan **terawal**; gabung Sarawak, Sabah, negeri Melayu dan NNS (potensi ekonomi)"],["**1906**","Majalah ***Al-Imam*** menggesa penyatuan"],["**1938**","Konsep **Melayu Raya** – Ibrahim Haji Yaakob, Dr. Burhanuddin al-Helmi"],["**1951**","**Sir Malcolm MacDonald** berbincang dengan Dato' Onn Jaafar"],["**1955**","**Tunku Abdul Rahman** mencadangkan di Persidangan Agung UMNO"],["**1958**","**Datu Mustapha Datu Harun** (Sabah) menyatakan minat bergabung"],["**27 Mei 1961**","Tunku **mengumumkan** cadangan Malaysia di **Hotel Adelphi, Singapura**"]]},{"k":"call","x":"**4 rasional (faktor) pembentukan Malaysia** – soalan paling popular."},{"k":"ul","items":[{"x":"**Keselamatan** – membendung **ancaman komunis di Singapura** dan **CCO** (*Clandestine Communist Organization*) di **Sarawak**."},{"x":"**Keseimbangan komposisi penduduk** – kemasukan Sarawak, Sabah dan Brunei **mengimbangi** jumlah penduduk Cina Singapura."},{"x":"**Mempercepat kemerdekaan** Sarawak dan Sabah – selari dengan **dekolonisasi** British."},{"x":"**Pembangunan wilayah** – meningkatkan taraf hidup peribumi; pembangunan lebih seimbang."}]}]},{"h":"5.3 Reaksi terhadap Pembentukan Malaysia","blocks":[{"k":"tbl","head":["Wilayah","Menyokong","Menentang"],"rows":[["**Tanah Melayu**","Umumnya menyokong; UMNO","–"],["**Sarawak**","**BARJASA** (Abdul Rahman Ya'kub), **PANAS** (Datu Bandar Abang Haji Mustapha), **PESAKA** (Temenggung Jugah), SCA","**SUPP** (Ong Kee Hui); **SNAP** (Stephen Kalong Ningkan) – mula-mula menentang, kemudian menyokong"],["**Sabah**","**USNO** (**Datu Mustapha**) – sejak awal; kemudian UNKO","Awalnya curiga; **UNKO** (**Donald Stephens**) – kemudian menyokong"],["**Singapura**","**PAP** (**Lee Kuan Yew**); pedagang (pasaran lebih besar)","**Barisan Sosialis**, Parti Rakyat Singapura (\"penjajahan baharu\")"],["**Brunei**","**Sultan Omar Ali Saifuddin** mengalu-alukan","**Parti Rakyat Brunei** (**A.M. Azahari**) – mahu gabungan Borneo"]]},{"k":"ul","items":[{"x":"**Barisan Bersatu (9 Ogos 1961)** – Ong Kee Hui, A.M. Azahari, Donald Stephens – mencabar rancangan Malaysia."},{"x":"**Sarawak Alliance** dan **Sabah Alliance** – gabungan parti menyokong Malaysia."}]},{"k":"tbl","head":["Negara jiran","Reaksi"],"rows":[["**Indonesia**","Awalnya **tidak menentang**; kemudian melancarkan **konfrontasi**"],["**Filipina**","**Menentang** – Presiden **Macapagal** **menuntut Sabah**"],["**Thailand**","**Menyokong**"]]}]},{"h":"5.4 Langkah Pembentukan Malaysia","blocks":[{"k":"ul","items":[{"x":"**1. Siri lawatan** – Tunku ke Sarawak dan Brunei (Julai 1961); pemimpin Sarawak dan Sabah melawat Tanah Melayu untuk melihat kemajuan."},{"x":"**2. Jawatankuasa Setia Kawan Malaysia (JSKM)** – ditubuhkan **23 Julai 1961**; pengerusi **Donald Stephens**. Tujuan: **meyakinkan penduduk Sarawak dan Sabah**, mengumpul pandangan, menyebarkan maklumat."},{"x":"**3. Rundingan London (November 1961)** – setuju menubuhkan suruhanjaya."},{"x":"**4. Suruhanjaya Cobbold (1962)** – pengerusi **Lord Cobbold**; ahli: Sir Anthony Abell, Sir David Watherston, **Muhammad Ghazali Shafie**, **Wong Pow Nee**. Tugas: **meninjau pandangan penduduk Sarawak dan Sabah**.","sub":["Dapatan: **dua pertiga penduduk menyokong**.","Syor: **Perlembagaan 1957 dijadikan asas**; **autonomi dan jaminan khas** untuk Sarawak dan Sabah."]},{"x":"**5. Referendum Singapura (September 1962)** – rakyat Singapura **bersetuju** menyertai Malaysia. (Referendum = pungutan suara rakyat.)"},{"x":"**6. Jawatankuasa Antara Kerajaan (JAK)** – Ogos 1962; pengerusi **Lord Lansdowne**, timbalan **Tun Abdul Razak**. Tujuan: **merangka perlembagaan** dan **melindungi kepentingan Sarawak dan Sabah**.","sub":["Mengusulkan **18 perkara (Sarawak)** dan **20 perkara (Sabah)**.","Islam agama Persekutuan – **dikecualikan** bagi Sarawak dan Sabah.","Bahasa Melayu bahasa rasmi; **bahasa Inggeris** masih digunakan di Sarawak dan Sabah.","**Pendidikan** dan **imigresen** – kuasa khas Sarawak dan Sabah.","Kerusi Parlimen: **Sarawak 24, Sabah 16, Singapura 15**."]}]}]},{"h":"5.5 Perjanjian Malaysia dan Pengisytiharan Malaysia","blocks":[{"k":"ul","items":[{"x":"**Perjanjian Malaysia (MA63)** ditandatangani **9 Julai 1963** di **London** oleh British, Tanah Melayu, Sarawak, Sabah dan Singapura."},{"x":"**Inti pati:** Sarawak, Sabah, Singapura menyertai Malaysia; kabinet negeri bagi Sarawak dan Sabah; **bumiputera Sarawak dan Sabah diiktiraf sama seperti orang Melayu**; tarikh asal **31 Ogos 1963**."},{"x":"**Indonesia membantah di PBB** → Setiausaha Agung **U Thant** menghantar misi **UNMM** (ketua: **Laurence Michelmore**) → laporan 14 September 1963: penduduk Sarawak dan Sabah **menerima Malaysia**."},{"x":"Sebab itulah pengisytiharan **ditangguhkan** daripada 31 Ogos kepada **16 September 1963**."},{"x":"Pengisytiharan serentak: **Stadium Merdeka** (dibaca **Yang di-Pertuan Agong**); **Kuching** (Khir Johari; **Datu Abang Haji Openg** – Yang di-Pertua Negeri); **Kota Kinabalu** (**Datu Mustapha** – Yang di-Pertua Negeri pertama)."},{"x":"**Stephen Kalong Ningkan** – Ketua Menteri Sarawak pertama (22 Julai 1963 – Hari Sarawak)."},{"x":"**Brunei tidak menyertai** Malaysia."}]}]},{"h":"5.6 Konfrontasi dan Usaha Menangani","blocks":[{"k":"ul","items":[{"x":"Punca: selepas **Pemberontakan Brunei (7 Disember 1962)**; PKI menganggap Malaysia **neokolonialisme** British."},{"x":"**20 Januari 1963** – **Dr. Subandrio** mengumumkan konfrontasi: **\"Ganyang Malaysia\"**."},{"x":"Serangan: **Tebedu**, Sarawak (12 April 1963); **Kalabakan**, Sabah (29 Disember 1963); **Labis**, Johor (2 September 1964)."}]},{"k":"call","x":"Malaysia memilih **cara diplomatik**, bukan perang."},{"k":"ul","items":[{"x":"**Langkah menamatkan konfrontasi:**","sub":["**Kementerian Luar** (Muhammad Ghazali Shafie) mematahkan propaganda dan mendapatkan sokongan luar.","Rundingan di **Manila** (1963), **Tokyo** dan **Bangkok** (1964) – peranan **Thanat Khoman** (Thailand).","**Dr. Ismail Abdul Rahman** membawa isu ke **Majlis Keselamatan PBB**.","**Peralihan kepimpinan Indonesia** (30 September 1965) – **Jeneral Suharto**; perunding **Adam Malik** dan Ali Moertopo."]},{"x":"Konfrontasi tamat **4 Ogos 1966**; **Tun Abdul Razak** menandatangani perjanjian damai di **Jakarta, 11 Ogos 1966**."}]}]}],"dates":[["27 Mei 1961","Tunku umum cadangan Malaysia"],["23 Jul 1961","JSKM ditubuhkan"],["Jan–Jun 1962","Suruhanjaya Cobbold"],["Ogos 1962","JAK ditubuhkan"],["7 Dis 1962","Pemberontakan Brunei"],["20 Jan 1963","Indonesia umum konfrontasi"],["9 Jul 1963","Perjanjian Malaysia (MA63) di London"],["16 Sept 1963","Pengisytiharan Malaysia"],["11 Ogos 1966","Perjanjian damai Malaysia–Indonesia"]],"kad":[["Bilakah Malaysia diisytiharkan?","16 September 1963."],["Empat rasional pembentukan Malaysia?","Keselamatan, keseimbangan komposisi penduduk, mempercepat kemerdekaan, pembangunan wilayah."],["Apakah tugas Suruhanjaya Cobbold?","Meninjau pandangan penduduk Sarawak dan Sabah tentang Malaysia."],["Apakah dapatan Suruhanjaya Cobbold?","Dua pertiga penduduk menyokong pembentukan Malaysia."],["Siapakah pengerusi JSKM?","Donald Stephens."],["Apakah tujuan JAK?","Merangka perlembagaan dan melindungi kepentingan Sarawak dan Sabah."],["Mengapakah tarikh Malaysia ditangguhkan ke 16 September?","Menunggu laporan misi PBB (UNMM) selepas bantahan Indonesia."],["Mengapakah Filipina menentang Malaysia?","Menuntut wilayah Sabah."],["Slogan konfrontasi Indonesia?","\"Ganyang Malaysia\"."],["Negeri yang tidak jadi menyertai Malaysia?","Brunei."]],"kuiz":[{"q":"Mengapakah Tunku Abdul Rahman mahu Sarawak, Sabah dan Brunei turut serta dalam Malaysia?","o":["Untuk menambah hasil minyak negara","Untuk mengimbangi komposisi penduduk","Untuk menggantikan Singapura","Untuk menamatkan darurat"],"a":1,"e":"Kemasukan Singapura sahaja akan menjejaskan keseimbangan penduduk Melayu–Cina."},{"q":"Suruhanjaya manakah yang meninjau pandangan penduduk Sarawak dan Sabah?","o":["Suruhanjaya Reid","Jawatankuasa Antara Kerajaan","Jawatankuasa Setia Kawan Malaysia","Suruhanjaya Cobbold"],"a":3,"e":"Laporannya menyatakan dua pertiga penduduk menyokong."},{"q":"Apakah peranan Jawatankuasa Antara Kerajaan (JAK)?","o":["Merangka perlembagaan dan melindungi kepentingan Sarawak dan Sabah","Mengadakan referendum di Singapura","Menamatkan konfrontasi Indonesia","Menyelia pilihan raya di Borneo"],"a":0,"e":"JAK mengusulkan 18 perkara bagi Sarawak dan 20 perkara bagi Sabah."},{"q":"Parti manakah di Sarawak yang menentang pembentukan Malaysia pada peringkat awal?","o":["BARJASA","PANAS","SUPP","PESAKA"],"a":2,"e":"SUPP dipimpin Ong Kee Hui. SNAP juga menentang pada awalnya tetapi kemudian menyokong."},{"q":"Bagaimanakah Malaysia menangani konfrontasi Indonesia?","o":["Melancarkan serangan balas ke atas Jakarta","Memutuskan hubungan dengan PBB","Menggunakan pendekatan diplomatik","Menyerahkan Sabah kepada Filipina"],"a":2,"e":"Melalui rundingan di Manila, Tokyo, Bangkok dan aduan kepada PBB."}],"mnem":["**Rasional Malaysia: \"K-K-K-P\"** → **K**eselamatan, **K**omposisi penduduk, **K**emerdekaan dipercepat, **P**embangunan wilayah.","**Langkah ikut urutan: \"L-J-C-R-J-P\"** → **L**awatan → **J**SKM → **C**obbold → **R**eferendum Singapura → **J**AK → **P**erjanjian MA63.","**Cobbold = tanya rakyat. JAK = tulis syarat.**","**Kerusi Parlimen: \"24-16-15\"** → Sarawak, Sabah, Singapura."],"nilai":["**Kesepakatan dan rundingan** ialah cara terbaik menyelesaikan masalah.","**Bersatu padu** untuk menghadapi ancaman luar."],"t":5,"n":5,"title":"Pembentukan Malaysia","id":"t5b5","inti":"**Malaysia diisytiharkan pada 16 September 1963** – gabungan **Tanah Melayu, Sarawak, Sabah dan Singapura**. Ia dicapai melalui **rundingan dan tinjauan pendapat rakyat** (JSKM, Suruhanjaya Cobbold, JAK, MA63, misi PBB), walaupun **Indonesia dan Filipina menentang**."},{"secs":[{"h":"6.1 Cabaran Dalaman Malaysia","blocks":[{"k":"ul","items":[{"x":"**Cabaran pembangunan dan sosioekonomi di Sarawak dan Sabah:**","sub":["**Mempelbagaikan kegiatan ekonomi** – rakyat masih bertani **sara diri** → galakkan pertanian komersial (kelapa sawit, getah, koko) dan petroleum.","**Memajukan perhubungan dan pengangkutan** – negeri besar, bergantung pada **pengangkutan air**.","**Memajukan pendidikan** – sekolah tertumpu di bandar; bina sekolah dan latih guru untuk pedalaman.","Sarawak dan Sabah dimasukkan dalam **Rancangan Malaysia Pertama (1966)**."]},{"x":"**Cabaran politik di Sarawak** – **krisis perlembagaan Jun 1966**: Ketua Menteri **Stephen Kalong Ningkan** dipecat; **darurat diisytiharkan di Sarawak** (September 1966); diganti **Tawi Sli**."},{"x":"**Cabaran perpaduan kaum** – penduduk pelbagai kaum; **jarak jauh** Semenanjung dengan Sarawak dan Sabah menyukarkan **integrasi nasional**."}]}]},{"h":"6.2 Pemisahan Singapura","blocks":[{"k":"call","x":"**3 faktor pemisahan: politik, ekonomi, perkauman.**"},{"k":"tbl","head":["Faktor","Butiran"],"rows":[["**Politik**","**Lee Kuan Yew** tidak puas hati peranan Singapura terhad; konflik **PAP dengan Perikatan**; kempen ***Malaysian Malaysia*** (hak sama rata semua kaum)"],["**Ekonomi**","Singapura mahu **pasaran bersama** disegerakan; tidak puas hati **tambahan cukai** kepada Persekutuan; mahu kenakan faedah atas pinjaman pembangunan Sarawak dan Sabah"],["**Perkauman**","**Rusuhan kaum di Singapura, 21 Julai 1964**"]]},{"k":"ul","items":[{"x":"**Kronologi:** rundingan Tun Abdul Razak – Lee Kuan Yew gagal (29 Jun 1965) → Kabinet bersetuju → **7 Ogos 1965** usul dibawa ke Parlimen → **9 Ogos 1965** Singapura **keluar daripada Malaysia**."},{"x":"Diselesaikan melalui **rundingan**, tanpa kekerasan."}]}]},{"h":"6.3 Menangani Ancaman Komunis","blocks":[{"k":"tbl","head":["","Sarawak","Semenanjung"],"rows":[["**Kumpulan**","**CCO**; kemudian **PKKU**, **PARAKU**, **PGRS**","**PKM**"],["**Ancaman**","Gerakan politik menentang Malaysia; serangan bersenjata (Batu Kitang, 1952)","Bunuh **Ketua Polis Negara Tan Sri Abdul Rahman Hashim** (7 Jun 1974); bunuh Ketua Polis Perak **Tan Sri Khoo Chong Kong** (1975); **bom Tugu Negara (26 Ogos 1975)**; serang hendap di Kroh (1968)"],["**Usaha mengatasi**","**Perang saraf** + **operasi ketenteraan**","**Strategi COIN** + **kerjasama sempadan dengan Thailand**"],["**Penamat**","**Operasi Sri Aman** (1973–1974); perjanjian damai 17 Oktober 1990","**Perjanjian Hat Yai, 2 Disember 1989**"]]},{"k":"ul","items":[{"x":"**Sarawak – perang saraf:** perhimpunan awam, risalah, **kawasan putih**, tawaran pengampunan, pembangunan infrastruktur."},{"x":"**Sarawak – operasi ketenteraan:**","sub":["**Operasi Hammer (1965)** – Bahagian Pertama; penduduk dipindahkan ke petempatan baharu (**Siburan, Beratok, Tapah**) – seperti Rancangan Briggs.","**RASCOM (26 Mac 1972)** – Bahagian Ketiga.","**Operasi Sri Aman (21 Oktober 1973)** – Bahagian Kedua; **Bong Kee Chok** berunding dengan Ketua Menteri **Abdul Rahman Ya'kub**; kira-kira 500 komunis menyerah diri."]},{"x":"**Semenanjung:**","sub":["**COIN** (*Counterinsurgency*) – keselamatan + pembangunan untuk **memenangi hati dan fikiran rakyat**.","**Perjanjian Kerjasama Sempadan 1976** dengan **Thailand** – pagar sempadan, operasi bersama.","**Perjanjian Hat Yai** – PKM bersetuju **membubarkan unit bersenjata** dan memusnahkan senjata."]}]}]},{"h":"6.4 Isu Pembangunan dan Ekonomi","blocks":[{"k":"ul","items":[{"x":"Ditangani melalui **Rancangan Malaysia Pertama (1966–1970)**."}]},{"k":"tbl","head":["Isu","Usaha mengatasi"],"rows":[["**Terlalu bergantung pada getah dan bijih timah**; harga jatuh","**Mempelbagaikan** pertanian (kelapa sawit, koko) dan komoditi; cari pasaran baharu"],["Petani **berpendapatan rendah**, kurang teknologi","Pelbagaikan pertanian dan industri pemprosesan"],["**Taraf hidup berbeza** antara penduduk dan negeri","Program pembangunan bersepadu; buka kawasan perkilangan; bantuan **Bank Dunia**"],["**Pengangguran**","Pusat latihan **vokasional dan teknikal**"],["Masalah **kesihatan** ibu dan anak","**Perancang Keluarga**; perkhidmatan kesihatan luar bandar"]]}]},{"h":"6.5 Tragedi Hubungan antara Kaum – 13 Mei 1969","blocks":[{"k":"ul","items":[{"x":"Berlaku selepas **Pilihan Raya Umum Ketiga 1969**; tertumpu di **Kuala Lumpur dan Selangor**."},{"x":"**Faktor:**","sub":["**Ketidakseimbangan ekonomi dan sosial** antara kaum.","**Kempen pilihan raya** yang menyentuh **isu sensitif** perkauman dan agama.","**PKM** mengambil kesempatan menghasut.","**Perarakan kemenangan** yang tidak terkawal dan provokatif."]},{"x":"**Langkah mengatasi:**","sub":["**Darurat** diisytiharkan **Yang di-Pertuan Agong (16 Mei 1969)** – **Parlimen digantung**, perintah berkurung, berita ditapis, pusat perlindungan (Stadium Merdeka).","**MAGERAN** (Majlis Gerakan Negara) – pengerusi **Tun Abdul Razak**; memerintah **16 Mei 1969 – 23 Februari 1971**. Fokus: **perpaduan kaum** dan **ketidakseimbangan ekonomi**. Menguatkuasakan **Akta Hasutan 1948**.","**Peranan raja** – Sultan Perak menasihati rakyat; **Jawatankuasa Muhibah** ditubuhkan."]}]}]}],"dates":[["21 Jul 1964","Rusuhan kaum di Singapura"],["1965","Operasi Hammer di Sarawak"],["9 Ogos 1965","Singapura keluar daripada Malaysia"],["1966","Krisis perlembagaan Sarawak; Rancangan Malaysia Pertama"],["13 Mei 1969","Rusuhan kaum"],["16 Mei 1969","Darurat; MAGERAN ditubuhkan"],["21 Okt 1973","Operasi Sri Aman"],["26 Ogos 1975","Tugu Negara dibom PKM"],["2 Dis 1989","Perjanjian Hat Yai"]],"kad":[["Bilakah Singapura keluar daripada Malaysia?","9 Ogos 1965."],["Tiga faktor pemisahan Singapura?","Politik, ekonomi dan masalah perkauman."],["Apakah Malaysian Malaysia?","Kempen Lee Kuan Yew menuntut hak sama rata untuk semua kaum."],["Apakah MAGERAN?","Majlis Gerakan Negara yang memerintah semasa darurat 1969–1971, dipengerusikan Tun Abdul Razak."],["Dua fokus MAGERAN?","Perpaduan kaum dan ketidakseimbangan ekonomi antara kaum."],["Perjanjian yang menamatkan perjuangan bersenjata PKM?","Perjanjian Hat Yai, 2 Disember 1989."],["Operasi yang menamatkan ancaman komunis di Sarawak?","Operasi Sri Aman (1973–1974)."],["Apakah COIN?","Strategi keselamatan dan pembangunan untuk memenangi hati dan fikiran rakyat."],["Peristiwa 26 Ogos 1975?","PKM mengebom Tugu Negara."]],"kuiz":[{"q":"Apakah faktor politik pemisahan Singapura?","o":["Rusuhan kaum 21 Julai 1964","Tuntutan pasaran bersama","Kempen Malaysian Malaysia","Tambahan cukai kepada Persekutuan"],"a":2,"e":"A ialah faktor perkauman; B dan D faktor ekonomi."},{"q":"Siapakah pengerusi MAGERAN?","o":["Tunku Abdul Rahman","Tun Abdul Razak Hussein","Dr. Ismail Abdul Rahman","Muhammad Ghazali Shafie"],"a":1,"e":"MAGERAN memerintah dari 16 Mei 1969 hingga 23 Februari 1971."},{"q":"Apakah punca utama tercetusnya peristiwa 13 Mei 1969?","o":["Pemisahan Singapura","Konfrontasi Indonesia","Krisis perlembagaan Sarawak","Keadaan dan keputusan Pilihan Raya Umum 1969"],"a":3,"e":"Kempen menyentuh isu sensitif dan perarakan kemenangan mencetuskan ketegangan."},{"q":"Bagaimanakah kerajaan menangani komunis di sempadan utara Semenanjung?","o":["Perjanjian kerjasama sempadan dengan Thailand","Melancarkan Operasi Hammer","Menubuhkan RASCOM","Mengisytiharkan Malaysian Malaysia"],"a":0,"e":"Perjanjian 1976 membolehkan pagar sempadan dan operasi bersama."},{"q":"Mengapakah kerajaan mempelbagaikan pertanian dalam Rancangan Malaysia Pertama?","o":["Untuk menghapuskan pertanian sara diri sahaja","Kerana terlalu bergantung pada getah dan bijih timah","Untuk menyekat kemasukan pelabur asing","Kerana tanah pertanian tidak mencukupi"],"a":1,"e":"Kejatuhan harga bahan mentah menjejaskan ekonomi negara."}],"mnem":["**5 cabaran: \"D-S-K-E-K\"** → **D**alaman (Sarawak/Sabah), **S**ingapura, **K**omunis, **E**konomi, **K**aum (13 Mei).","**Singapura keluar sebab \"P-E-P\"** → **P**olitik, **E**konomi, **P**erkauman. Tarikh: **9-8-65**.","**13 Mei → 16 Mei: Darurat + MAGERAN (Razak).**","**Komunis tamat: Sarawak = Sri Aman 1973; Semenanjung = Hat Yai 1989.**"],"nilai":["**Elakkan isu sensitif perkauman**; persefahaman antara kaum menjamin keamanan.","**Selesaikan konflik melalui rundingan**, bukan kekerasan."],"t":5,"n":6,"title":"Cabaran Selepas Pembentukan Malaysia","id":"t5b6","inti":"Selepas 1963 Malaysia diuji oleh **5 cabaran**: jurang pembangunan Sarawak dan Sabah, **pemisahan Singapura (1965)**, **ancaman komunis**, masalah ekonomi dan **rusuhan kaum 13 Mei 1969**. Semuanya ditangani dengan **rundingan, pembangunan dan perpaduan**."},{"secs":[{"h":"7.1 Perpaduan dan Integrasi Nasional","blocks":[{"k":"tbl","head":["Konsep","Maksud"],"rows":[["**Perpaduan kaum**","Rakyat pelbagai **etnik dan agama** hidup **aman dalam masyarakat yang bersatu**"],["**Integrasi nasional**","Proses merapatkan hubungan masyarakat **antara negeri dan wilayah** (Semenanjung – Sarawak – Sabah) untuk membentuk **satu bangsa**"]]},{"k":"ul","items":[{"x":"Kedua-duanya berteraskan **Perlembagaan Persekutuan dan Rukun Negara**."},{"x":"**Punca masalah perpaduan (kesan dasar British):**","sub":["**Pentadbiran** – membawa masuk pekerja luar untuk lombong, ladang dan perniagaan.","**Kegiatan ekonomi dan petempatan** berbeza ikut kaum (bandar, lombong, estet, kampung) → kurang interaksi; jurang ekonomi.","**Sistem pendidikan vernakular** – berasingan ikut kaum.","**Fahaman politik** berasaskan kaum."]},{"x":"**Usaha memperkasakan perpaduan:**"}]},{"k":"tbl","head":["Politik","Ekonomi","Sosial"],"rows":[["**Jabatan Perpaduan Negara**","Rancangan Pembangunan Lima Tahun","**Dasar Pendidikan Kebangsaan**"],["**Majlis Muhibah Negara** (18 Julai 1969)","**DEB** dan **DPN**","**Bahasa Melayu** – Akta Bahasa Kebangsaan, UKM, DBP"],["**Majlis Perundingan Negara** (29 Januari 1970)","Pembangunan luar bandar dan wilayah","**Kebudayaan kebangsaan**"],["**Barisan Nasional** (1 Januari 1973) – gabungan parti pelbagai kaum","**Zon Perindustrian Bebas** (Bayan Lepas, Pasir Gudang, Pelabuhan Klang)","**Sukan** dan **Rukun Negara**"]]},{"k":"ul","items":[{"x":"**Feri Malaysia / Cruise Muhibah (1986)** – mengintegrasikan Semenanjung dengan Sarawak dan Sabah."}]}]},{"h":"7.2 Dasar Pendidikan Kebangsaan","blocks":[{"k":"ul","items":[{"x":"Matlamat: **menyatupadukan rakyat** dan menyediakan **tenaga kerja mahir**."}]},{"k":"tbl","head":["Dokumen","Tahun","Isi utama"],"rows":[["**Penyata Razak**","1956","Asas sistem pendidikan kebangsaan"],["**Laporan Rahman Talib**","**1960**","**Bahasa Melayu bahasa pengantar** semua peringkat; **kurikulum sama**; asas **Akta Pelajaran 1961**"],["**Kajian Aminuddin Baki**","–","Sekolah **aneka jurusan**; kursus kemahiran; **sekolah kebangsaan** untuk semua kaum; penekanan **Sejarah** dan **Tatarakyat**"],["**Laporan Jawatankuasa Kabinet**","**1979**","Bahasa Melayu **wajib dalam peperiksaan awam**; **Pendidikan Islam dan Moral**; **kokurikulum**; lahir **KBSR (1982)** dan **KBSM (1989)**"],["**Falsafah Pendidikan Negara/Kebangsaan**","**1988** / 1996","Insan seimbang **J-E-R-I**: jasmani, emosi, rohani, intelek"],["**Akta Pendidikan 1996**","1996","Bahasa kebangsaan **bahasa pengantar utama**; wajib di semua sekolah termasuk swasta"]]},{"k":"ul","items":[{"x":"KSSR (2011) dan KSSM (2017) menggantikan KBSR dan KBSM."}]}]},{"h":"7.3 Bahasa Melayu sebagai Bahasa Ilmu dan Bahasa Perpaduan","blocks":[{"k":"ul","items":[{"x":"**Akta Bahasa Kebangsaan 1967** (Akta 32) – digubal di bawah **Perkara 152**; semua **urusan rasmi kerajaan** menggunakan bahasa Melayu."},{"x":"Bahasa Melayu digunakan **sepenuhnya di mahkamah** sejak **1990**."},{"x":"**Bahasa ilmu** = mampu menyampaikan ilmu hingga peringkat tinggi. **Bahasa rasmi** = digunakan dalam pentadbiran, pendidikan, perdagangan, kehakiman."},{"x":"**Sistem pendidikan** – sekolah menengah kebangsaan berbahasa pengantar Melayu (Sekolah Alam Shah, Sekolah Seri Puteri)."},{"x":"**UKM** – ditubuhkan **18 Mei 1970**; universiti awam **pertama** menawarkan pelbagai jurusan dalam **bahasa Melayu**; ada **ATMA**."},{"x":"**DBP** – ditubuhkan **22 Jun 1956** di **Johor Bahru**; pengarah pertama **Ungku Abdul Aziz**; menerbit buku, **Bulan Bahasa Kebangsaan**; slogan **\"Bahasa Jiwa Bangsa\"** (1960)."}]}]},{"h":"7.4 Dasar Kebudayaan Kebangsaan","blocks":[{"k":"ul","items":[{"x":"Digubal melalui **Kongres Kebudayaan Kebangsaan 1971** (dirasmikan **Tun Abdul Razak** di Universiti Malaya)."}]},{"k":"call","x":"**3 prinsip Dasar Kebudayaan Kebangsaan** – mesti hafal."},{"k":"ul","items":[{"x":"**Berteraskan kebudayaan rakyat asal rantau Melayu.**"},{"x":"**Unsur kebudayaan lain yang sesuai dan wajar** diterima."},{"x":"**Islam** menjadi unsur penting."},{"x":"**Matlamat:** mengukuhkan **perpaduan** melalui kebudayaan; memupuk **keperibadian kebangsaan**; meningkatkan kualiti kehidupan kemanusiaan dan kerohanian."},{"x":"**Agensi pelaksana:** Kementerian Pelancongan, Seni dan Budaya; Jabatan Kesenian dan Kebudayaan Negara; **Istana Budaya**; **ASWARA**."},{"x":"Program: **Citrawarna Malaysia** (sejak 1999)."}]}]},{"h":"7.5 Sukan sebagai Alat Perpaduan","blocks":[{"k":"ul","items":[{"x":"**Melalui pendidikan** – **Dasar 1 Murid 1 Sukan**, **RIMUP**; kejohanan olahraga sekolah."},{"x":"**MASUM** (1974) – sukan universiti. **SUKMA** (pertama **1986**, Kuala Lumpur) – 13 negeri dan Wilayah Persekutuan; integrasi antara negeri."},{"x":"**Penganjuran sukan antarabangsa** – Sukan Komanwel, Hoki Piala Dunia, Piala Thomas, Sukan SEA, Formula 1, **Le Tour de Langkawi**."},{"x":"**Kejayaan kebanggaan bersama** – juara **Piala Thomas 1967 dan 1992**; bola sepak layak ke **Olimpik Moscow 1980**; Hoki Piala Dunia 1975."},{"x":"Slogan **\"Malaysia Boleh\"** – membakar semangat patriotik semua kaum."},{"x":"**Organisasi dan pemimpin** – Kementerian Belia dan Sukan, **Majlis Sukan Negara**, **Majlis Olimpik Malaysia**; kerabat diraja dan pemimpin pelbagai kaum sebagai penaung."}]}]},{"h":"7.6 Rukun Negara","blocks":[{"k":"ul","items":[{"x":"**Ideologi negara**; dibentuk kerana **peristiwa 13 Mei 1969**."},{"x":"Dirangka oleh **Majlis Perundingan Negara (MAPEN)**; diisytiharkan **Yang di-Pertuan Agong pada 31 Ogos 1970**."}]},{"k":"tbl","head":["5 matlamat (cita-cita)","5 prinsip"],"rows":[["Negara **bersatu**","**Kepercayaan kepada Tuhan**"],["Masyarakat **demokratik**","**Kesetiaan kepada Raja dan Negara**"],["Masyarakat **adil**","**Keluhuran Perlembagaan**"],["Masyarakat **liberal**","**Kedaulatan Undang-undang**"],["Masyarakat **progresif**","**Kesopanan dan Kesusilaan**"]]},{"k":"ul","items":[{"x":"**Liberal** di sini = bebas mengamalkan agama, adat dan kebudayaan masing-masing."},{"x":"**Progresif** = maju mengikut sains dan teknologi."}]}]}],"dates":[["22 Jun 1956","DBP ditubuhkan"],["1960","Laporan Rahman Talib"],["1967","Akta Bahasa Kebangsaan"],["18 Mei 1970","UKM ditubuhkan"],["31 Ogos 1970","Rukun Negara diisytiharkan"],["1971","Kongres Kebudayaan Kebangsaan"],["1979","Laporan Jawatankuasa Kabinet"],["1988","Falsafah Pendidikan Negara"],["1996","Akta Pendidikan"]],"kad":[["Beza perpaduan kaum dengan integrasi nasional?","Perpaduan – antara kaum/etnik; integrasi – antara negeri dan wilayah."],["Bilakah Rukun Negara diisytiharkan?","31 Ogos 1970."],["Mengapakah Rukun Negara dibentuk?","Ekoran peristiwa 13 Mei 1969, untuk menyatukan rakyat."],["Lima prinsip Rukun Negara?","Kepercayaan kepada Tuhan; Kesetiaan kepada Raja dan Negara; Keluhuran Perlembagaan; Kedaulatan Undang-undang; Kesopanan dan Kesusilaan."],["Tiga prinsip Dasar Kebudayaan Kebangsaan?","Teras kebudayaan rakyat asal rantau Melayu; unsur kebudayaan lain yang sesuai; Islam unsur penting."],["Universiti pertama berbahasa pengantar Melayu?","UKM (1970)."],["Slogan DBP?","\"Bahasa Jiwa Bangsa\"."],["Laporan yang melahirkan KBSR dan KBSM?","Laporan Jawatankuasa Kabinet 1979."],["Apakah J-E-R-I?","Jasmani, emosi, rohani, intelek – insan seimbang dalam Falsafah Pendidikan Kebangsaan."],["Sukan peringkat kebangsaan antara negeri?","SUKMA (sejak 1986)."]],"kuiz":[{"q":"Integrasi nasional bermaksud","o":["penyatuan parti politik pelbagai kaum","proses merapatkan hubungan masyarakat antara negeri dan wilayah","penggunaan satu bahasa di sekolah","pembahagian kuasa pusat dan negeri"],"a":1,"e":"Contohnya antara Semenanjung dengan Sarawak dan Sabah."},{"q":"Apakah cadangan Laporan Rahman Talib 1960?","o":["Mengekalkan sekolah vernakular sepenuhnya","Menjadikan bahasa Inggeris bahasa pengantar","Menjadikan bahasa Melayu bahasa pengantar semua peringkat","Menubuhkan UKM"],"a":2,"e":"Laporan ini juga menjadi asas Akta Pelajaran 1961."},{"q":"Antara yang berikut, yang manakah prinsip Dasar Kebudayaan Kebangsaan?","o":["Berteraskan kebudayaan rakyat asal rantau Melayu","Berteraskan kebudayaan Barat","Menolak semua unsur kebudayaan lain","Mengasingkan agama daripada kebudayaan"],"a":0,"e":"Dua lagi: unsur lain yang sesuai diterima; Islam unsur penting."},{"q":"Badan manakah yang merangka Rukun Negara?","o":["Majlis Raja-Raja","Majlis Perundingan Negara","Dewan Bahasa dan Pustaka","Majlis Sukan Negara"],"a":1,"e":"MAPEN dibentuk oleh MAGERAN pada 29 Januari 1970."},{"q":"Bagaimanakah sukan memupuk perpaduan?","o":["Acara dipertandingkan mengikut kaum","Hanya atlet profesional dibenarkan bertanding","Pemain dan penyokong pelbagai kaum bekerjasama untuk pasukan yang sama","Sukan menggantikan mata pelajaran Sejarah"],"a":2,"e":"Contoh: slogan \"Malaysia Boleh\" dan kejayaan Piala Thomas 1992."}],"mnem":["**5 alat perpaduan: \"P-B-K-S-R\"** → **P**endidikan, **B**ahasa, **K**ebudayaan, **S**ukan, **R**ukun Negara.","**Prinsip Rukun Negara: \"Tuhan – Raja – Perlembagaan – Undang-undang – Sopan\".**","**Cita-cita Rukun Negara: \"B-D-A-L-P\"** → **B**ersatu, **D**emokratik, **A**dil, **L**iberal, **P**rogresif.","**Dasar pendidikan ikut urutan: Razak 56 → Rahman Talib 60 → Kabinet 79 → FPK 88 → Akta 96.**"],"nilai":["**Hormati kepelbagaian agama dan budaya**; amalkan prinsip Rukun Negara.","**Martabatkan bahasa kebangsaan** sebagai bahasa perpaduan."],"t":5,"n":7,"title":"Membina Kesejahteraan Negara","id":"t5b7","inti":"Selepas 13 Mei 1969, kerajaan membina **perpaduan** melalui **5 alat**: **pendidikan, bahasa Melayu, kebudayaan kebangsaan, sukan dan Rukun Negara**."},{"secs":[{"h":"8.1 Pembentukan Dasar Ekonomi Baru (DEB)","blocks":[{"k":"ul","items":[{"x":"Tempoh **20 tahun: 1970–1990**, melalui **RRJP1** (Rangka Rancangan Jangka Panjang Pertama)."},{"x":"Merangkumi **Rancangan Malaysia Kedua hingga Kelima** (RMK2 1971–1975 … RMK5 1986–1990)."},{"x":"Dirangka hasil perbincangan **MAPEN** (1970); dilancarkan **Tun Abdul Razak**."},{"x":"**Matlamat: perpaduan negara.**"}]},{"k":"call","x":"**Strategi serampang dua mata:**"},{"k":"ul","items":[{"x":"**1. Membasmi kemiskinan** – menambah pendapatan dan peluang pekerjaan **tanpa mengira kaum**."},{"x":"**2. Menyusun semula masyarakat** – **menghapuskan pengenalan kaum mengikut fungsi ekonomi**."},{"x":"**Isu sosioekonomi (jurang):** bumiputera – bukan bumiputera; **pantai timur – pantai barat**; **desa – bandar**; antara negeri."}]}]},{"h":"8.2 Pelaksanaan DEB","blocks":[{"k":"ul","items":[{"x":"**Meningkatkan taraf hidup:**","sub":["**Luar bandar** – tanah baharu, subsidi benih dan baja, kredit, pemasaran, koperasi.","**Bandar** – perindustrian dan perniagaan untuk peluang kerja; kemudahan asas; rumah murah; buku teks percuma."]},{"x":"**Rancangan Buku Hijau** (20 Disember 1974, Tun Abdul Razak) – menambah pendapatan dan **pengeluaran bahan makanan**; **tanah digunakan sepenuhnya**; tanaman jangka pendek, penternakan."}]},{"k":"tbl","head":["Agensi","Tahun","Peranan"],"rows":[["**LPN** (kini BERNAS)","1971","Padi dan beras; menstabilkan harga padi"],["**LKIM**","1971","**Nelayan**; memodenkan perikanan"],["**LPP**","1973","Petani dan peladang (koperasi)"],["**RISDA**","1973","**Pekebun kecil getah**; tanam semula"],["**UDA**","1971","Pembangunan **bandar baharu** dan industri"],["**PNB**","1978","**Pemilikan saham bumiputera** – ASN, ASB"]]},{"k":"ul","items":[{"x":"**FELDA** – peneroka diberi **10 ekar** tanah (kelapa sawit/getah) dan rumah; terbuka kepada **pelbagai kaum** (contoh **Felda Lurah Bilut**, Pahang – 1957). Kerjasama dengan **Yayasan Sabah** dan **SALCRA** (Sarawak)."},{"x":"**Pembangunan wilayah** – KEJORA, KETENGAH, DARA, KESEDAR."},{"x":"**Pemilikan modal saham** – mewujudkan **MPPB** (Masyarakat Perdagangan dan Perindustrian Bumiputera); **Amanah Saham Malaysia** untuk bukan bumiputera."},{"x":"**IKS** (Industri Kecil dan Sederhana) – kraf tangan, makanan, pakaian; pinjaman daripada Bank Bumiputra, Bank Pertanian, **Amanah Ikhtiar Malaysia**."},{"x":"**Pendidikan tenaga kerja mahir** – Kemahiran Hidup, sekolah teknik dan vokasional, politeknik, **UTM**, **ITM**."}]}]},{"h":"8.3 Pembentukan Dasar Pembangunan Nasional (DPN)","blocks":[{"k":"ul","items":[{"x":"Dilancarkan **Tun Dr. Mahathir Mohamad** pada **17 Jun 1991**."},{"x":"Tempoh **10 tahun: 1991–2000**, melalui **RRJP2**; merangkumi **RMK6 dan RMK7**."},{"x":"**Kesinambungan DEB**; ke arah **negara maju** berdasarkan **Wawasan 2020**."},{"x":"**Matlamat:** **perpaduan negara melalui pengagihan kekayaan**; **pembangunan seimbang**."},{"x":"**Strategi:**","sub":["**Ekonomi** – **pelibatan aktif pihak swasta**; **sains dan teknologi**; penanaman semula; saham bumiputera.","**Sosial** – pendidikan untuk golongan miskin; MPPB; masyarakat berdisiplin dan progresif.","**Fizikal dan alam sekitar** – kemudahan asas; **pembangunan mapan**; teknologi hijau."]}]}]},{"h":"8.4 Pelaksanaan DPN","blocks":[{"k":"ul","items":[{"x":"**Pembasmian kemiskinan** – menghapuskan **kemiskinan tegar**; subsidi penanam padi dan nelayan; latihan belia di **Giatmara** dan **ILP**."},{"x":"**Penyusunan semula masyarakat** – **MPPB** (selaras **Perkara 153**); kontrak, kuota, lesen; **usaha sama** bumiputera – bukan bumiputera."},{"x":"**Penyusunan semula modal saham** – sasaran **sekurang-kurangnya 30 peratus** pemilikan bumiputera; melalui **penswastaan** (dasar penswastaan dilancarkan **Mac 1983**); agensi: **MARA, PERNAS, PKEN**."},{"x":"**Pembangunan wilayah** – **MARDI**; **pertanian pintar** (dron, jentera kawalan jauh); kilang di negeri kurang maju."}]}]},{"h":"8.5 Pencapaian DEB dan DPN","blocks":[{"k":"tbl","head":["Aspek sosial","Aspek ekonomi"],"rows":[["**Kadar kemiskinan turun**: 49.3% (1970) → 17.1% (1990) → 7.2% (2000)","**Perindustrian berteknologi tinggi** – **HICOM (1980)**: industri berat, keluli, loji gas Bintulu"],["**Kualiti hidup meningkat** – kesihatan, pendidikan","**Kawasan perindustrian baharu** – estet perindustrian, **zon perindustrian bebas**, taman teknologi (Kulim Hi-Tech Park)"],["**Golongan pertengahan** muncul – profesional, pengurus","**Kenderaan buatan Malaysia** – **PROTON (1983)**, Proton Saga (1985), **PERODUA (1993)**, MODENAS"],["**MPPB** – usahawan dan tokoh korporat bumiputera",""],["**Pendidikan** berkembang – graduan sains dan teknikal",""],["**Pengangkutan** moden – lebuh raya, MRT",""],["**Bandar baharu** – **Bandar Tun Abdul Razak, Jengka**",""]]},{"k":"ul","items":[{"x":"**Zon perindustrian bebas** = kawasan yang diberi **pelepasan cukai** untuk menarik pelabur."}]}]}],"dates":[["1970–1990","Dasar Ekonomi Baru (DEB)"],["1971","LPN, LKIM, UDA ditubuhkan"],["20 Dis 1974","Rancangan Buku Hijau"],["17 Mac 1978","PNB ditubuhkan"],["1980","HICOM ditubuhkan"],["1983","PROTON; dasar penswastaan"],["17 Jun 1991","DPN dilancarkan"],["1991–2000","Dasar Pembangunan Nasional (DPN)"]],"kad":[["Tempoh DEB?","1970–1990 (20 tahun)."],["Apakah serampang dua mata DEB?","Membasmi kemiskinan dan menyusun semula masyarakat."],["Matlamat akhir DEB?","Perpaduan negara."],["Siapakah yang melancarkan DPN?","Tun Dr. Mahathir Mohamad (17 Jun 1991)."],["Tempoh DPN?","1991–2000 (10 tahun)."],["Apakah MPPB?","Masyarakat Perdagangan dan Perindustrian Bumiputera."],["Agensi untuk nelayan?","LKIM."],["Agensi untuk pekebun kecil getah?","RISDA."],["Apakah matlamat Rancangan Buku Hijau?","Menambah pendapatan rakyat dan pengeluaran bahan makanan melalui penggunaan tanah sepenuhnya."],["Sasaran pemilikan saham bumiputera?","Sekurang-kurangnya 30 peratus."]],"kuiz":[{"q":"Apakah strategi serampang dua mata DEB?","o":["Memajukan industri berat dan menswastakan agensi kerajaan","Membasmi kemiskinan dan menyusun semula masyarakat","Membuka tanah baharu dan membina bandar baharu","Menambah eksport dan mengurangkan import"],"a":1,"e":"Kedua-duanya bertujuan mencapai perpaduan negara."},{"q":"Menyusun semula masyarakat bermaksud","o":["memindahkan penduduk bandar ke desa","mengasingkan petempatan mengikut kaum","menghapuskan pengenalan kaum mengikut fungsi ekonomi","mengurangkan jumlah penduduk"],"a":2,"e":"Supaya sesuatu kaum tidak lagi dikaitkan dengan satu jenis pekerjaan sahaja."},{"q":"Agensi manakah yang ditubuhkan untuk menambah pemilikan saham bumiputera?","o":["PNB","UDA","LKIM","RISDA"],"a":0,"e":"PNB (1978) memperkenalkan ASN dan ASB."},{"q":"Apakah perbezaan DPN berbanding DEB?","o":["DPN menghentikan usaha membasmi kemiskinan","DPN tidak melibatkan bumiputera","DPN berlangsung selama 20 tahun","DPN menekankan pelibatan aktif sektor swasta dan teknologi"],"a":3,"e":"DPN (1991–2000) ialah kesinambungan DEB ke arah Wawasan 2020."},{"q":"Apakah bukti kejayaan DEB dan DPN dari aspek sosial?","o":["Penubuhan HICOM","Kadar kemiskinan menurun","Pembukaan zon perindustrian bebas","Pelancaran Proton Saga"],"a":1,"e":"Daripada 49.3% (1970) kepada 7.2% (2000). Yang lain ialah aspek ekonomi."}],"mnem":["**DEB = \"20 tahun, Razak, RRJP1\". DPN = \"10 tahun, Mahathir, RRJP2\".**","**Serampang dua mata: \"Basmi miskin + Susun semula\".**","**Agensi ikut kumpulan sasaran: padi = LPN, ikan = LKIM, getah = RISDA, bandar = UDA, saham = PNB, tanah = FELDA.**","**Kemiskinan: \"49 → 17 → 7\"** (1970, 1990, 2000)."],"nilai":["**Bersyukur atas kemakmuran** dan sokong dasar pembangunan negara.","**Agihan kekayaan yang adil** mengukuhkan perpaduan."],"t":5,"n":8,"title":"Membina Kemakmuran Negara","id":"t5b8","inti":"Dua dasar ekonomi besar: **DEB (1970–1990)** dan **DPN (1991–2000)**. Kedua-duanya menggunakan **serampang dua mata** – **membasmi kemiskinan** dan **menyusun semula masyarakat** – supaya **perpaduan negara** tercapai."},{"secs":[{"h":"9.1 Latar Belakang Dasar Luar","blocks":[{"k":"ul","items":[{"x":"Hubungan luar bermula sejak kerajaan awal: **P'an-p'an, Langkasuka, Chih-t'u** menghantar utusan ke **China**."},{"x":"**Kesultanan Melayu Melaka** – dua bentuk hubungan: **diplomatik** (utusan) dan **perdagangan**."},{"x":"**Kepentingan hubungan luar Melaka:** menjamin **kestabilan dan keselamatan**; **pusat penyebaran Islam**; **kemakmuran** melalui perdagangan; menguasai perdagangan Selat Melaka; **perakuan kedaulatan**."},{"x":"**Zaman British** – hal ehwal luar dikawal **Pejabat Tanah Jajahan di London**."}]},{"k":"call","x":"**Dua fasa dasar luar selepas merdeka:**"},{"k":"tbl","head":["Pemimpin","Bentuk dasar luar"],"rows":[["**Tunku Abdul Rahman**","**Probarat** dan **antikomunis**"],["**Tun Abdul Razak** (1970-an)","**Berkecuali / tidak memihak**; berbaik dengan semua negara **tanpa mengira ideologi**"]]}]},{"h":"9.2 Asas Penggubalan Dasar Luar","blocks":[{"k":"ul","items":[{"x":"**Wisma Putra** (Kementerian Luar Negeri) menggubal dasar luar. Menteri Luar pertama: **Tunku Abdul Rahman**."},{"x":"**Matlamat dasar luar:**","sub":["**Mempertahankan kemerdekaan dan kedaulatan** negara.","**Melindungi kepentingan nasional**.","**Memupuk hubungan baik** dengan negara luar.","Menghadapi cabaran politik, ekonomi dan sosial."]},{"x":"**4 faktor penggubalan:**","sub":["**Ikatan sejarah** – dengan negara serantau; ikatan **agama** dengan Arab Saudi, Mesir, Turki; **Komanwel**.","**Keperluan nasional** – kepentingan negara diutamakan; kedudukan strategik; ekonomi dan keamanan.","**Kepimpinan** – kebijaksanaan pemimpin; hubungan dengan **negara sedang membangun** (1990-an).","**Persekitaran luar** – **Perang Dingin** (Blok Barat lwn Blok Timur)."]}]}]},{"h":"9.3 Malaysia dalam PBB","blocks":[{"k":"ul","items":[{"x":"PBB ditubuhkan **1945**; matlamat: **keamanan dan kestabilan dunia**. Wakil tetap pertama Malaysia: **Dr. Ismail Abdul Rahman**."},{"x":"Pendirian Malaysia: **\"hidup bersama secara aman\"**."},{"x":"**Pelibatan Malaysia:**","sub":["**Mendukung Piagam PBB** – hak asasi manusia; menghormati kedaulatan negara lain; **tidak campur tangan**.","**Agensi PBB** – **UNESCO** (Tapak Warisan Dunia: Gunung Mulu, Taman Kinabalu, Melaka dan George Town, Lembah Lenggong), **FAO**, **WHO**, **UNHCR**.","**Majlis Keselamatan PBB** – anggota tidak tetap **4 kali** (1965, 1989–90, 1999–2000, 2015–16).","**Misi pengaman** – **Congo** (1960), Namibia, **Somalia**, **Bosnia dan Herzegovina**, **Kemboja**, Timor Leste, **Lubnan**.","**Tokoh Malaysia** – **Tan Sri Razali Ismail**, **Datuk Maimunah Mohd Sharif** (UN-Habitat), Tan Sri Dr. Jemilah Mahmood, Dr. Jomo Kwame Sundaram, Tan Sri Aboo Samah (Pemerintah UNOSOM II)."]}]}]},{"h":"9.4 Malaysia dalam Komanwel","blocks":[{"k":"ul","items":[{"x":"**Komanwel** = pertubuhan **negara bekas tanah jajahan British** yang telah merdeka."},{"x":"**Rancangan Colombo (1951)** – pembangunan ekonomi dan sosial; khidmat nasihat pendidikan, pertanian, kesihatan."},{"x":"**Kerjasama pertahanan** – perjanjian dengan Britain (**12 Oktober 1957**)."},{"x":"**Kerjasama ekonomi** – rakan dagang utama; **cukai lebih rendah**."},{"x":"**Menentang Dasar Aparteid** di **Afrika Selatan** (diskriminasi warna kulit) → Afrika Selatan menarik diri daripada Komanwel."},{"x":"**CHOGM** – Malaysia tuan rumah **1989**. **Sukan Komanwel** – Malaysia tuan rumah **1998**."}]}]},{"h":"9.5 Cabaran Mengukuhkan Dasar Luar","blocks":[{"k":"tbl","head":["Cabaran","Tindakan Malaysia"],"rows":[["**Politik antarabangsa**","Dasar **berkecuali**; **Tun Abdul Razak melawat China (1974)**"],["**Politik serantau**","Komunis di **Indochina**; pelarian Vietnam; Sidang Kemuncak ASEAN di **Bali (1976)**"],["**Keselamatan dan pertahanan**","**AMDA tamat 1971** → diganti **FPDA** (Perjanjian Pertahanan Lima Negara): **Malaysia, Singapura, Britain, Australia, New Zealand**"],["**Pembangunan ekonomi**","Negara maju menguasai harga komoditi → sertai **ITC** dan **GAT
