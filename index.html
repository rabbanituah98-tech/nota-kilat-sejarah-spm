const BAB = [{"secs":[{"h":"1.1 Latar Belakang Negara Bangsa Sebelum Kedatangan Barat","blocks":[{"k":"ul","items":[{"x":"Asas negara bangsa bermula **sebelum kedatangan Barat**."},{"x":"Urutan warisan: **Funan → Champa → Srivijaya → Kesultanan Melayu Melaka → Johor-Riau**."},{"x":"Kerajaan Alam Melayu yang lain: Kedah Tua, Gangga Nagara, Angkor, Majapahit."}]},{"k":"tbl","head":["Ciri (4)","Maksud ringkas","Contoh wajib ingat"],"rows":[["**Raja**","Tonggak utama kerajaan, ditaati dan dianggap suci","Raja Champa dikaitkan dengan **Dewa Siva**"],["**Undang-undang**","Panduan pentadbiran, jamin kesejahteraan","Majapahit: undang-undang **Kutara Manawa**"],["**Wilayah pengaruh**","Kawasan yang rakyatnya mengakui pemerintahan raja","Funan: Sungai Mekong, Teluk Cam Ranh, selatan Myanmar, Segenting Kra"],["**Rakyat**","Penduduk yang setia dan tidak menderhaka","Srivijaya: upacara persetiaan, **minum air sumpah** (Inskripsi Telaga Batu)"]]},{"k":"ul","items":[{"x":"Srivijaya berpusat di **Palembang**."},{"x":"Johor-Riau meneruskan ciri ini dengan menekankan **kepentingan Islam**."}]}]},{"h":"1.2 Ciri-ciri Negara Bangsa Kesultanan Melayu Melaka","blocks":[{"k":"call","x":"Melaka ada **6 ciri**: Kerajaan, Rakyat, Kedaulatan, Wilayah pengaruh, Undang-undang, Lambang kebesaran."},{"k":"ul","items":[{"x":"**Kerajaan** – raja pemerintah tertinggi, dibantu pembesar melalui **Sistem Pembesar Empat Lipatan**. Selepas Islam, guna gelaran **sultan**."},{"x":"**Rakyat** – taat setia kepada sultan. Terdiri daripada orang **Melayu dan Orang Laut**. Golongan diperintah = **merdeka** dan **hamba**."},{"x":"**Kedaulatan** – kekuasaan tertinggi sultan. Diiktiraf oleh **Dinasti Ming** (utusan **Laksamana Cheng Ho**)."},{"x":"**Wilayah pengaruh** – seluruh Semenanjung Tanah Melayu dan pantai timur Sumatera. Diperoleh melalui **penaklukan, naungan dan perkahwinan**.","sub":["Taklukan (perang): Pahang, Kuala Linggi, Kelantan, Rokan, Inderagiri, Kampar.","Naungan: Lingga, Patani, Kedah.","Perkahwinan: **Siantan** dihadiahkan Majapahit kepada **Sultan Mansur Shah**."]},{"x":"**Undang-undang** – 2 undang-undang bertulis: **Hukum Kanun Melaka** dan **Undang-Undang Laut Melaka**."},{"x":"**Lambang kebesaran** – adat istiadat, penggunaan warna, **nobat**, regalia, **cap mohor** (mengesahkan arahan sultan). Ia **simbol kedaulatan sultan**."}]}]},{"h":"1.3 Keunggulan Sistem Pentadbiran","blocks":[{"k":"ul","items":[{"x":"Sultan berkuasa dalam **pemerintahan, peperangan, hubungan diplomatik dan agama**."},{"x":"Dua peringkat pentadbiran: **pusat** dan **jajahan**."}]},{"k":"tbl","head":["Pembesar Berempat","Tugas utama"],"rows":[["**Bendahara**","Ketua pentadbir, ketua turus angkatan tentera, penasihat sultan, **pemangku sultan**"],["**Penghulu Bendahari**","Menguruskan **perbendaharaan** (kewangan)"],["**Temenggung**","Menjaga **keselamatan kota Melaka**"],["**Laksamana**","**Panglima angkatan laut**"]]},{"k":"ul","items":[{"x":"**Syahbandar** – mengutip cukai di **pelabuhan**."},{"x":"Pembesar lain: Bentara, Orang Kaya, hulubalang, penghulu."},{"x":"**Kawasan pegangan** = kawasan yang dikurniakan sultan kepada Pembesar Berempat."},{"x":"Sumber pendapatan Melaka: **perdagangan, cukai, ufti** dari wilayah taklukan dan naungan."},{"x":"**Tun Perak** – Bendahara paling lama, berkhidmat untuk **4 sultan** (Muzaffar Shah, Mansur Shah, Alauddin Riayat Shah, Mahmud Shah)."}]}]},{"h":"1.3 Keunggulan Undang-undang","blocks":[{"k":"ul","items":[{"x":"Kedua-dua undang-undang berasaskan **syariah dan hukum adat**."}]},{"k":"tbl","head":["Hukum Kanun Melaka (44 Fasal)","Undang-Undang Laut Melaka"],"rows":[["**Jenayah** – membunuh tanpa pengetahuan raja: hukum bunuh (Fasal 5.1). Memalsukan titah sultan: hukum bunuh (Fasal 4)","**Peranan nakhoda** – ibarat **raja dalam pelayaran**; diberi keutamaan berniaga 4 hari (Fasal 13.1)"],["**Peranan sultan dan pembesar** – Fasal 1","**Pelayaran** – **malim** mesti arif ilmu pelayaran (Fasal 9); juga ada jurumudi dan jurubatu"],["**Kekeluargaan** – nikah perlu 4 saksi, memadai 2 (Fasal 26)","**Jenayah** di atas kapal – membunuh: hukum mati (Fasal 5)"],["**Ekonomi** – **riba diharamkan** (Fasal 30)","**Percukaian** – nakhoda tentukan cukai penumpang (Fasal 6.3)"]]},{"k":"ul","items":[{"x":"Perkataan khas raja sahaja: **titah, murka, kurnia, anugerah**."},{"x":"Undang-Undang Laut Melaka diusahakan oleh **Nakhoda Jenal, Nakhoda Diri dan Nakhoda Sahak**, diperkenan **Sultan Mahmud Shah**."}]}]},{"h":"1.4 Peranan Pemerintah dan Rakyat","blocks":[{"k":"ul","items":[{"x":"Hubungan raja–rakyat berasaskan **waadat** (perjanjian) antara **Sang Sapurba** (wakil pemerintah) dengan **Demang Lebar Daun** (wakil rakyat)."},{"x":"Isi waadat: rakyat **tidak menderhaka**; raja **tidak menzalimi/mengaibkan** rakyat. Hubungan **timbal balik**."},{"x":"Golongan pemerintah: sultan, pembesar, kerabat raja, **ulama**."}]},{"k":"tbl","head":["Sultan","Pembesar","Rakyat"],"rows":[["Menaungi dan menjaga keselamatan rakyat","Memelihara keamanan dan kebajikan di kawasan pegangan","Taat setia kepada pemerintah"],["Mewujudkan perpaduan rakyat","**Perantara** sultan dengan rakyat","Tidak menderhaka kerana takut **tulah**"],["Bertanggungjawab atas kemakmuran dan kestabilan","Kutip hasil (**sistem serah**), bekalkan tentera (**sistem kerah**)","Menjadi tentera, pendayung kapal perang"],["Memperkenalkan undang-undang","","Tenaga kerja sistem kerah (bina istana, jalan)"]]},{"k":"ul","items":[{"x":"**Tulah** = kecelakaan kerana menderhaka kepada raja."},{"x":"Hamba ada 3 jenis: hamba raja, hamba berhutang, hamba biasa."}]}]}],"dates":[["Abad 1","Kerajaan Funan"],["Abad 2","Kerajaan Champa"],["Abad 7","Kerajaan Srivijaya (pusat: Palembang)"],["Abad 15","Kesultanan Melayu Melaka"],["Abad 16","Kesultanan Johor-Riau"]],"kad":[["Berapakah ciri negara bangsa Kesultanan Melayu Melaka?","6 – kerajaan, rakyat, kedaulatan, wilayah pengaruh, undang-undang, lambang kebesaran."],["Siapakah Pembesar Berempat?","Bendahara, Penghulu Bendahari, Temenggung, Laksamana."],["Apakah dua undang-undang bertulis Melaka?","Hukum Kanun Melaka dan Undang-Undang Laut Melaka."],["Apakah maksud waadat?","Perjanjian antara Sang Sapurba (pemerintah) dengan Demang Lebar Daun (rakyat)."],["Siapakah yang mengutip cukai di pelabuhan Melaka?","Syahbandar."],["Bagaimanakah Melaka memperoleh wilayah pengaruh?","Penaklukan, naungan dan perkahwinan."],["Undang-undang kerajaan Majapahit?","Kutara Manawa."],["Apakah fungsi cap mohor?","Mengesahkan arahan daripada sultan."]],"kuiz":[{"q":"Kerajaan manakah yang mewariskan ciri-ciri negara bangsa kepada Kesultanan Melayu Melaka?","o":["Kerajaan Kedah Tua","Kerajaan Srivijaya","Kerajaan Johor-Riau","Kerajaan Angkor"],"a":1,"e":"Urutan warisan: Funan → Champa → Srivijaya → Melaka → Johor-Riau."},{"q":"Siapakah pembesar yang menjadi pemangku sultan?","o":["Laksamana","Temenggung","Bendahara","Syahbandar"],"a":2,"e":"Bendahara ialah ketua pentadbir, penasihat dan pemangku sultan."},{"q":"Apakah kepentingan lambang kebesaran seperti nobat dan cap mohor?","o":["Menunjukkan kedaulatan sultan","Menandakan kawasan pemerintahan","Menggambarkan kemewahan istana","Membuktikan keturunan raja"],"a":0,"e":"Lambang kebesaran ialah identiti kerajaan dan simbol kedaulatan sultan."},{"q":"Dalam Undang-Undang Laut Melaka, siapakah yang diibaratkan sebagai raja dalam pelayaran?","o":["Malim","Jurumudi","Jurubatu","Nakhoda"],"a":3,"e":"Nakhoda berkuasa penuh di atas kapal dan semua pihak mesti mematuhi arahannya."},{"q":"Waadat antara Sang Sapurba dengan Demang Lebar Daun menekankan","o":["pembahagian wilayah taklukan","hubungan timbal balik pemerintah dengan rakyat","pelantikan Pembesar Berempat","kutipan cukai di pelabuhan"],"a":1,"e":"Rakyat tidak menderhaka, raja pula tidak menzalimi rakyat."}],"mnem":["**6 ciri Melaka: \"K-R-K-W-U-L\"** → **K**erajaan, **R**akyat, **K**edaulatan, **W**ilayah pengaruh, **U**ndang-undang, **L**ambang kebesaran.","**Pembesar Berempat: \"Ben-Peng-Tem-Lak\"** → Bendahara (tadbir), Penghulu Bendahari (duit), Temenggung (kota), Laksamana (laut)."],"nilai":["Kita perlu **taat setia kepada raja dan negara** serta **mematuhi undang-undang** supaya negara kekal aman.","Hubungan baik pemimpin dengan rakyat menjamin **perpaduan dan kestabilan negara**."],"t":4,"n":1,"title":"Warisan Negara Bangsa","id":"t4b1","inti":"Negara bangsa kita **bukan dicipta oleh Barat**. Asasnya sudah ada sejak Funan, Champa dan Srivijaya, kemudian disempurnakan oleh **Kesultanan Melayu Melaka** dengan pentadbiran, undang-undang dan hubungan raja–rakyat yang tersusun."},{"secs":[{"h":"2.1 Maksud Nasionalisme","blocks":[{"k":"ul","items":[{"x":"Perasaan **cinta yang mendalam terhadap bangsa dan negara**."},{"x":"Semangat kebangsaan menentang penjajahan dan membela bangsa."},{"x":"Gerakan mencapai **kebebasan politik, ekonomi dan sosial** daripada penguasaan orang asing."}]},{"k":"tbl","head":["Tokoh","Pendapat ringkas"],"rows":[["**Hans Kohn**","Kesetiaan seseorang hanya kepada negara atau bangsanya"],["**William R. Roff**","Nasionalisme Melayu timbul kerana ancaman terhadap hak orang Melayu dan faktor ekonomi"],["**Dato' Onn Jaafar**","Mahu bangsa yang tegap, kuat dan boleh berdiri di atas kaki sendiri"],["**Dr. Burhanuddin al-Helmi**","Perlu persatuan dan perpaduan yang kuat (National Fronts) untuk menentang penjajah"],["**Zainal Abidin Abdul Wahid**","Nasionalisme Melayu sudah wujud sejak **Kesultanan Melayu Melaka** (kesetiaan kepada raja)"],["**Khoo Kay Kim**","Perjuangan orang Melayu mendapatkan kembali kedudukan unggul di negara sendiri"]]}]},{"h":"2.2 Idea Nasionalisme di Barat","blocks":[{"k":"tbl","head":["Revolusi","Punca","Hasil / Tokoh"],"rows":[["**Revolusi Keagungan, England (1688)**","**Raja James II** membelakangkan parlimen","Peralihan kuasa **secara aman tanpa pertumpahan darah**. **Bill of Rights**, kedaulatan parlimen, **raja berperlembagaan**. Pemikir: **John Locke** (*Two Treatises of Government*)"],["**Revolusi Amerika (1776)**","Cukai British: Akta Pelayaran, Gula, Setem, Teh. Slogan **\"tiada cukai tanpa perwakilan\"**","**13 tanah jajahan** merdeka. Ketua kongres: **George Washington**. Perisytiharan Kemerdekaan ditulis **Thomas Jefferson**. British akui kemerdekaan 1783"],["**Revolusi Perancis (1789)**","Pemerintahan autokratik **Raja Louis XVI**, rakyat terbeban cukai","Serang **penjara Bastille**. Lahir **Republik Perancis**. Slogan **kebebasan, persamaan, persaudaraan**. Pemikir: **Rousseau** (*The Social Contract*), Voltaire"]]},{"k":"call","x":"England dan Perancis = nasionalisme **antiraja**. Amerika = menentang **penjajahan**."}]},{"h":"2.3 Nasionalisme di Asia","blocks":[{"k":"ul","items":[{"x":"**India** – titik tolak: **Dahagi India 1857**. Pertubuhan: Brahmo Samaj, Arya Samaj, **Kongres Kebangsaan India/INC (1885)**, **Liga Muslim (1906)**. **Mahatma Gandhi** – **satyagraha** (berpegang teguh kepada kebenaran, tanpa keganasan). Pakistan merdeka **14 Ogos 1947** (Muhammad Ali Jinnah), India **15 Ogos 1947** (Jawaharlal Nehru)."},{"x":"**China** – menentang **Dinasti Manchu** dan kuasa Barat. **Dr. Sun Yat Sen** – **Tiga Prinsip Rakyat** (nasionalisme, demokrasi, kebajikan sosial). **Revolusi China 1911** → republik."},{"x":"**Empayar Uthmaniyah dan Mesir** – **Pan-Islamisme** (penyatuan umat Islam sedunia): **Sayyid Jamal al-Din al-Afghani**, kumpulan **al-Urwah al-Wuthqa (1883)**, Khalifah Abdul Hamid II. **Gerakan Islah** (pemulihan Islam, kembali kepada al-Quran dan Hadis): al-Afghani dan **Sheikh Muhammad Abduh**."},{"x":"**Jepun** – digerakkan oleh **pemerintah**. **Maharaja Mikado Meiji (1868)** – **Pemulihan Meiji**, pemodenan ikut model Barat, semangat **bushido**."}]}]},{"h":"2.4 Nasionalisme di Asia Tenggara","blocks":[{"k":"tbl","head":["Negara","Penjajah","Tokoh dan perkara penting"],"rows":[["**Filipina**","Sepanyol, kemudian Amerika Syarikat","**Jose Rizal** – Gerakan Propaganda, **Liga Filipina (1892)**. **Andres Bonifacio** – **Katipunan** (akhbar *Kalayan*), Revolusi Filipina 1896. **Emilio Aguinaldo**"],["**Burma (Myanmar)**","British","**Persatuan Belia Buddha (1906)** – **isu kasut**. **Pemberontakan Saya San (1930–1932)**. Golongan **Thakin** (tuan): **Aung San**, U Nu – Parti Do Bama Asiayone"],["**Vietnam**","Perancis","**VNQDD** (Nguyen Thai Hoc). **Parti Komunis Vietnam** – **Ho Chi Minh** isytihar merdeka September 1945 di Hanoi"],["**Indonesia**","Belanda","**Raden Adjeng Kartini** – pendidikan wanita. Muhammadiyah, Sarekat Islam, PKI, **PNI (Soekarno)**. **Sumpah Pemuda 1928**: satu tanah air, satu bangsa, satu bahasa"],["**Thailand**","**Tidak dijajah**","**Raja Mongkut** dan **Raja Chulalongkorn** – diplomasi dan pemodenan. **Revolusi Thai 1932** (Nai Pridi, Phibulsongkram) → **raja berperlembagaan**"]]},{"k":"call","x":"Thailand lain daripada yang lain: tujuannya **mempertahankan kedaulatan**, bukan menuntut kemerdekaan."}]},{"h":"2.5 Kesedaran Nasionalisme di Negara Kita","blocks":[{"k":"ul","items":[{"x":"Bermula sejak **Kesultanan Melayu Melaka**: **Sultan Mahmud Shah** menyerang Portugis **3 kali** untuk mendapatkan semula Melaka."},{"x":"**Sultan Abdullah Mukarram Shah** (Kedah) menentang **SHTI** untuk mendapatkan semula **Pulau Pinang**."},{"x":"Pejuang tempatan (bersifat **setempat**): **Dol Said, Dato' Maharaja Lela, Dato' Bahaman, Rentap, Mat Salleh, Tok Janggut, Haji Abdul Rahman Limbong**."},{"x":"Tokoh agama (gerakan Islah): Sheikh Muhammad Tahir Jalaluddin, Haji Abbas Mohd Taha, Syed Sheikh al-Hadi."},{"x":"Penulis dan wartawan: **Za'ba**, Abdul Rahim Kajai, **Ibu Zain**, Muhammad Rakawi Yusuf."}]}]},{"h":"2.6 Faktor Kemunculan Gerakan Nasionalisme","blocks":[{"k":"ul","items":[{"x":"**Peranan agama** – pelajar di Mesir terdedah kepada **gerakan Islah**."},{"x":"**Penulisan kreatif** – novel, cerpen, puisi. Contoh: *Putera Gunung Tahan* dan *Anak Mat Lela Gila* (**Pak Sako**), *Melor Kuala Lumpur* (Harun Aminurrashid), *Cerita Awang Putat* (Abdul Rahim Kajai)."},{"x":"**Media cetak** – *Jawi Peranakan*, ***Al-Imam*** (1906), *Neracha*, *Pengasuh*, *Fajar Sarawak* (mengkritik pemerintahan **Brooke**)."},{"x":"**Sistem pendidikan** – madrasah (al-Attas, al-Masyhur, al-Idrisiyah), Raffles Institution, **MCKK**, **SITC**."},{"x":"**Golongan intelektual** – lepasan Timur Tengah, Inggeris dan Melayu."},{"x":"**Pengaruh luar dan serantau** – Pan-Islamisme, gerakan Islah, **Jepun menewaskan Rusia**, Revolusi China, Gandhi, Jose Rizal, Soekarno."}]}]},{"h":"2.7 Perkembangan Nasionalisme","blocks":[{"k":"tbl","head":["Golongan intelektual","Tempat","Tokoh","Cara dan akhbar"],"rows":[["**Pendidikan agama (Kaum Muda)**","Timur Tengah, madrasah","Sheikh Tahir Jalaluddin, Syed Sheikh al-Hadi, Haji Abbas Mohd Taha","Gerakan Islah, tubuh madrasah. Akhbar: *Al-Imam, Al-Ikhwan, Neracha*"],["**Pendidikan Inggeris**","**MCKK (1905)**","Raja Chulan, Mohammad Eunos Abdullah, Raja Uda","**Berbaik-baik dengan British**. Akhbar: *Warta Malaya, Lembaga Malaya, Utusan Melayu*"],["**Pendidikan Melayu**","**SITC (1922)**","O.T. Dussek, Za'ba, Harun Aminurrashid, Abdul Hadi Hassan","**Pejabat Karang Mengarang**, mata pelajaran Sejarah. Lahir **Kesatuan Melayu Muda**"]]},{"k":"ul","items":[{"x":"**Perjuangan melalui persatuan:**","sub":["**Kesatuan Melayu Singapura (KMS), 1926** – diasaskan **Mohammad Eunos Abdullah**. Persatuan terawal, bekerjasama dengan British.","**Persaudaraan Sahabat Pena (PASPAM), 1934** – bermula di **Pulau Pinang**; cawangan di Kuching, Jesselton, Tawau, Labuan.","**Kesatuan Melayu Muda (KMM), 1937/1938** – **Ibrahim Haji Yaakob**. **Radikal, anti-British**. Gagasan **Melayu Raya** (Tanah Melayu + Indonesia). Akhbar *Majlis*.","**Persatuan Melayu Sarawak (PMS), 1939** – Muhammad Rakawi Yusuf dan Johari Anang.","Cina: **SCBA** (Tan Jiak Kim, Tan Cheng Lock). India: **CIAM (1936)** – Dr. A.M. Soosay; Sikh: Khalsa Diwan Malaya (1902)."]}]}]},{"h":"2.8 Kesan Perkembangan Nasionalisme","blocks":[{"k":"ul","items":[{"x":"**Politik** – orang Melayu dalam **MCS** bertambah (7 orang pada 1930 → 20 orang pada 1937). **Dasar desentralisasi** mendorong penubuhan persatuan negeri. British menangkap **Ibrahim Haji Yaakob, Ishak Haji Muhammad, Ahmad Boestamam** (1941)."},{"x":"**Ekonomi** – semangat berniaga (persatuan **al-Jamiah al-Khairiah**). Za'ba menekankan pendidikan tinggi. Dana pelajaran ke luar negara."},{"x":"**Sosial** – kesedaran pendidikan meningkat. Lepasan SITC bertambah. Majalah ***Bulan Melayu*** (1930) oleh guru wanita Johor – **Ibu Zain**."}]}]}],"dates":[["1688","Revolusi Keagungan di England"],["1776","Revolusi Amerika"],["1789","Revolusi Perancis"],["1857","Dahagi India"],["1868","Pemulihan Meiji di Jepun"],["1906","Akhbar Al-Imam diterbitkan"],["1911","Revolusi China"],["1926","Kesatuan Melayu Singapura (KMS)"],["1928","Sumpah Pemuda Indonesia"],["1934","PASPAM di Pulau Pinang"],["1937","Kesatuan Melayu Muda (KMM)"]],"kad":[["Apakah maksud nasionalisme?","Perasaan cinta yang mendalam terhadap bangsa dan negara."],["Mengapakah Revolusi 1688 digelar Revolusi Keagungan?","Peralihan kuasa berlaku secara aman tanpa pertumpahan darah."],["Apakah slogan penduduk Amerika menentang British?","\"Tiada cukai tanpa perwakilan\"."],["Apakah satyagraha?","Berpegang teguh kepada kebenaran – perjuangan tanpa keganasan (Mahatma Gandhi)."],["Tiga Prinsip Rakyat Sun Yat Sen?","Nasionalisme, demokrasi dan kebajikan sosial."],["Siapakah pengasas KMM?","Ibrahim Haji Yaakob (1937)."],["Apakah gagasan KMM?","Melayu Raya – gabungan Tanah Melayu dan Indonesia."],["Mengapakah nasionalisme Thailand berbeza?","Bertujuan mempertahankan kedaulatan, bukan menuntut kemerdekaan – Thailand tidak dijajah."],["Institusi yang melahirkan intelektual berpendidikan Melayu?","Maktab Perguruan Sultan Idris (SITC), 1922."],["Majalah wanita yang digerakkan Ibu Zain?","Bulan Melayu (1930)."]],"kuiz":[{"q":"Revolusi manakah yang berlaku secara aman tanpa pertumpahan darah?","o":["Revolusi Amerika","Revolusi Perancis","Revolusi Keagungan","Revolusi China"],"a":2,"e":"Raja James II melarikan diri ke Perancis; kuasa beralih secara aman di England pada 1688."},{"q":"Persatuan manakah yang dianggap radikal oleh British?","o":["Kesatuan Melayu Muda","Kesatuan Melayu Singapura","Persaudaraan Sahabat Pena","Persatuan Melayu Selangor"],"a":0,"e":"KMM berani menentang kerajaan kolonial dan membangkitkan perasaan anti-British."},{"q":"Golongan Kaum Muda menyebarkan idea mereka melalui akhbar","o":["Utusan Melayu","Al-Imam","Warta Malaya","Majlis"],"a":1,"e":"Al-Imam (1906) memuatkan idea gerakan Islah."},{"q":"Apakah ciri nasionalisme di Thailand?","o":["Dipimpin oleh golongan sami Buddha","Menentang penjajahan Sepanyol","Menuntut kemerdekaan melalui revolusi","Mempertahankan kedaulatan melalui diplomasi dan pemodenan"],"a":3,"e":"Raja Mongkut dan Raja Chulalongkorn memodenkan negara supaya tidak dijajah."},{"q":"Apakah peranan Pejabat Karang Mengarang di SITC?","o":["Melatih pegawai tadbir Melayu","Menerbitkan akhbar anti-British","Menghasilkan buku berkualiti dan mengasah bakat penulisan","Mengumpul dana pelajaran ke luar negara"],"a":2,"e":"Diketuai Za'ba sebagai Ketua Penterjemah."}],"mnem":["**Tiga revolusi Barat ikut urutan: \"E-A-P 88-76-89\"** → **E**ngland 16**88**, **A**merika 17**76**, **P**erancis 17**89**.","**Tiga golongan intelektual: \"A-I-M\"** → **A**gama (Kaum Muda), **I**nggeris (MCKK), **M**elayu (SITC).","**Tiga persatuan ikut urutan: KMS 1926 → PASPAM 1934 → KMM 1937.** Makin lama makin berani."],"nilai":["**Ilmu pengetahuan** penting untuk menyedarkan dan memajukan bangsa.","Kita perlu **berwaspada terhadap kuasa asing** dan menghargai perjuangan tokoh terdahulu."],"t":4,"n":2,"title":"Kebangkitan Nasionalisme","id":"t4b2","inti":"**Nasionalisme = cinta yang mendalam terhadap bangsa dan negara.** Idea ini bermula di Barat, merebak ke Asia dan Asia Tenggara, lalu sampai ke negara kita melalui **golongan intelektual, penulisan dan persatuan**."},{"secs":[{"h":"3.1 Nasionalisme di Negara Kita Sebelum Perang Dunia","blocks":[{"k":"ul","items":[{"x":"British membendung pengaruh Islam dari Timur Tengah: **Enakmen Undang-Undang Islam 1904**, Jabatan Siasatan Jenayah dan Biro Siasatan Politik."},{"x":"**Tok Janggut** (Pasir Puteh, Kelantan, 1915) – dipengaruhi **Pan-Islamisme** dan empayar Uthmaniyah; isu agama, cukai dan benci British."},{"x":"Selepas Tok Janggut gagal, perjuangan beralih kepada **akhbar dan majalah**."},{"x":"British mengawal penerbitan, jadi kritikan dibuat secara berselindung, contohnya **\"Cerita Tekukur\"** (1920) – tekukur terkurung dalam **\"sangkar emas\"**."}]}]},{"h":"3.2 Perang Dunia Pertama (1914–1918)","blocks":[{"k":"ul","items":[{"x":"**3 faktor:** persaingan **kuasa imperialis** (rebut tanah jajahan dan bahan mentah), **pakatan ketenteraan**, **krisis rantau Balkan**."},{"x":"Pencetus: pembunuhan **Archduke Ferdinand** (Putera Mahkota Austria-Hungary) oleh pemuda **Serbia**."}]},{"k":"tbl","head":["Kuasa Tengah","Pakatan Bertiga"],"rows":[["Jerman, Austria-Hungary, Bulgaria, empayar Uthmaniyah","Britain, Perancis, Rusia (disokong Serbia, Itali; Amerika Syarikat masuk April 1917)"]]},{"k":"ul","items":[{"x":"**Persidangan Damai Paris (18 Januari 1919)** – **Deklarasi 14 Perkara Woodrow Wilson**."},{"x":"**Perjanjian Versailles (28 Jun 1919)** – Jerman mesti: tanggung kemusnahan perang, **bayar pampasan**, **hadkan tentera**, **serah wilayah**. Tubuh **Liga Bangsa-Bangsa**."},{"x":"**Kesan:** runtuh pemerintahan beraja (Jerman, Austria-Hungary, Rusia, Uthmaniyah); muncul negara baharu; Rusia menjadi **kerajaan komunis pertama** (Lenin); Turki menjadi republik (**Mustafa Kemal Ataturk**)."},{"x":"**Kesan kepada negara kita:** Raja-raja Melayu diminta menyatakan taat setia kepada British; hasil **bijih timah dan getah** digunakan membiayai perang British."}]}]},{"h":"3.3 Perang Dunia Kedua di Eropah (1939–1945)","blocks":[{"k":"ul","items":[{"x":"**3 faktor:** **ideologi baharu**, **tidak puas hati terhadap Perjanjian Versailles**, **kegagalan Liga Bangsa-Bangsa**."}]},{"k":"tbl","head":["Ideologi","Negara","Pemimpin"],"rows":[["**Fasisme**","Itali (1922)","**Benito Mussolini**"],["**Nazisme**","Jerman (1933)","**Adolf Hitler**"]]},{"k":"tbl","head":["Kuasa Paksi","Kuasa Bersekutu"],"rows":[["**Jerman, Itali, Jepun**","**Britain, Amerika Syarikat, Perancis, Rusia**"]]},{"k":"ul","items":[{"x":"Bermula apabila **Jerman menyerang Poland (September 1939)**. Strategi **Blitzkrieg** = serangan kilat."},{"x":"**Operasi Barbarossa** – Jerman menyerang Rusia; gagal kerana musim sejuk. Jerman menyerah di **Stalingrad (Januari 1943)**."},{"x":"**D-Day (Jun 1944)** – tentera Bersekutu mendarat di **Normandy**, Perancis. Hitler mati April 1945, Jerman menyerah kalah."},{"x":"Pemimpin Bersekutu: **Roosevelt** (AS), **Churchill** (Britain), **Stalin** (Rusia)."}]}]},{"h":"3.4 Perang Dunia Kedua di Asia Pasifik (1941–1945)","blocks":[{"k":"ul","items":[{"x":"Punca peluasan kuasa Jepun: **keperluan perindustrian**, **pengaruh golongan tentera**, **orde baharu Asia**."},{"x":"Jepun menguasai Korea (1910), Manchuria (1932), China (1937), Indochina (1941)."},{"x":"**Jeneral Hideki Tojo** menjadi Perdana Menteri (Oktober 1941)."},{"x":"AS, British dan Belanda mengenakan **sekatan ekonomi** → Jepun mahu menguasai Asia Tenggara yang kaya bahan mentah."},{"x":"**8 Disember 1941** – Jepun mendarat di **Pantai Kuala Pak Amat, Kota Bharu**, kemudian menyerang **Pearl Harbour**, Hawaii."}]}]},{"h":"3.5 Faktor Kedatangan Jepun ke Negara Kita","blocks":[{"k":"ul","items":[{"x":"**Eksploitasi bahan mentah** – **bijih timah dan getah** (Tanah Melayu), **minyak** di **Miri dan Lutong** (Sarawak)."},{"x":"**Kepentingan strategik ketenteraan** – menguasai pangkalan laut British di **Singapura**; Borneo sebagai batu loncatan ke Jawa."},{"x":"Membentuk **Lingkungan Sekemakmuran Asia Timur Raya**."},{"x":"Propaganda: **\"Asia untuk Orang Asia\"**, \"Semangat Asia\"."},{"x":"Kapal perang British ***Repulse*** dan ***Prince of Wales*** ditenggelamkan di perairan **Kuantan**."},{"x":"**Singapura jatuh pada 15 Februari 1942** → seluruh Tanah Melayu dikuasai Jepun."}]}]},{"h":"3.6 Dasar Pendudukan Jepun","blocks":[{"k":"ul","items":[{"x":"**Pentadbiran** – pemerintahan tentera. Tanah Melayu = **Malai Baru**; Singapura = **Syonan-to**. **Perlis, Kedah, Kelantan, Terengganu** diserah kepada **Thailand**. Sarawak, Sabah, Brunei = **Kita Boruneo** (pusat: Kuching)."},{"x":"**Kempeitai** – polis tentera yang kejam."},{"x":"Raja-raja Melayu diiktiraf sebagai **ketua agama Islam dan adat Melayu** sahaja."},{"x":"**Koa Kunrenjo** – institut latihan pemimpin muda."},{"x":"**Ekonomi** – **ekonomi kawalan**. Mata wang Jepun **\"wang pokok pisang\"** dicetak tanpa kawalan → **inflasi**. **Catuan makanan** (beras, garam, gula)."},{"x":"**Pendidikan** – sekolah Inggeris dan Cina ditutup. Diajar **Nippon Go** (bahasa Jepun), **Nippon Seishin** (semangat Jepun), lagu **Kimigayo**."}]},{"k":"tbl","head":["Kaum","Layanan Jepun","Sebab"],"rows":[["Melayu dan peribumi","Baik","Mahu sokongan untuk melicinkan pemerintahan"],["India","Baik – bantu tubuh **Tentera Kebangsaan India** (Subhas Chandra Bose)","Mahu kerjasama untuk menguasai India"],["Cina","**Kejam**","Permusuhan daripada **Perang China-Jepun**"]]},{"k":"ul","items":[{"x":"**Landasan Kereta Api Maut** – Thailand ke Burma, 415 km, buruh paksa (**romusha**)."}]}]},{"h":"3.7 Perjuangan Rakyat Menentang Jepun","blocks":[{"k":"tbl","head":["Pihak","Tokoh / butiran"],"rows":[["**Rejimen Askar Melayu**","**Leftenan Adnan Saidi** – pertempuran **Bukit Candu**, Singapura"],["**MPAJA**","Gerakan anti-Jepun **terbesar**; ditubuhkan PKM (**Bintang Tiga**), 8 rejimen. Bekerjasama dengan Force 136 (Disember 1943)"],["**OCAJA** (Bintang Satu)","Gerila **Kuomintang**; **Lim Bo Seng**"],["**Force 136**","Unit khas British (1943). **Tengku Mahmood Mahyiddeen** (\"Harimau Malaya\"). Melahirkan **Askar Melayu Setia** (Hulu Perak), **Wataniah Pahang** (Yeop Mahidin), **Gerila Melayu Kedah**"],["**Individu**","**Gurchan Singh** (\"Lion of Malaya\" – risalah). **Sybil Kathigasu** – jururawat di Perak, bantu gerila; terima Pingat King George"],["**Sabah**","**Albert Kwok** – **Gerila Kinabalu**, Pemberontakan Jesselton / **Double Tenth** (Oktober 1943). Datu Mustapha Datu Harun"],["**Sarawak**","**Operasi Semut** – Unit Khas Z Australia (SRD) melatih orang Kayan, Kenyah, Kelabit, Murut, Iban"]]}]},{"h":"3.8 Nasionalisme Semasa Pendudukan Jepun","blocks":[{"k":"ul","items":[{"x":"Kejayaan Jepun menewaskan British menyedarkan rakyat bahawa **orang Asia mampu mengalahkan orang Eropah**."},{"x":"Jepun **membebaskan ahli KMM**, tetapi **membubarkan KMM (Jun 1942)** kerana menuntut kemerdekaan."},{"x":"**Giyu Gun** atau PETA (Ibrahim Haji Yaakob) dan **Giyu Tai** (Onan Haji Siraj) – pasukan sukarela tajaan Jepun."},{"x":"**KRIS** (Kesatuan Rakyat Indonesia Semenanjung) – matlamat: **merdeka bersama Indonesia**. Gagal kerana Jepun menyerah kalah."},{"x":"Perjuangan diteruskan melalui **PKMM** – **parti politik pertama** selepas pendudukan Jepun."},{"x":"Sarawak dan Sabah: orang tempatan dilantik menjadi pegawai daerah → lebih yakin untuk berkerajaan sendiri."}]}]},{"h":"3.9 Selepas Kekalahan Jepun","blocks":[{"k":"ul","items":[{"x":"**6 Ogos 1945** – bom atom **\"Little Boy\"** di **Hiroshima**. **9 Ogos 1945** – **\"Fat Man\"** di **Nagasaki**."},{"x":"**15 Ogos 1945** – **Maharaja Hirohito** umum Jepun menyerah kalah."},{"x":"British lewat mendarat (3 September 1945) → **kekosongan kuasa** → **Bintang Tiga (PKM/MPAJA)** berkuasa kira-kira **14 hari** dan bertindak kejam terhadap orang Melayu."},{"x":"Tindak balas orang Melayu: **Gerakan Fi-Sabilillah**; **Kiai Salleh** – **Tentera Selempang Merah** (Johor); Haji Bakri – **Khalifah Parang Panjang** (Sungai Manik, Perak)."},{"x":"**Dato' Onn Jaafar** (Pegawai Daerah Batu Pahat) mengatur perundingan damai antara Kiai Salleh dengan ketua Bintang Tiga. **Raja-raja Melayu** turut meredakan keadaan."}]}]}],"dates":[["1914–1918","Perang Dunia Pertama"],["28 Jun 1919","Perjanjian Versailles"],["Sept 1939","Jerman serang Poland – PD2 bermula di Eropah"],["8 Dis 1941","Jepun mendarat di Kota Bharu, serang Pearl Harbour"],["15 Feb 1942","Singapura jatuh ke tangan Jepun"],["Okt 1943","Pemberontakan Jesselton (Albert Kwok)"],["6 & 9 Ogos 1945","Bom atom Hiroshima dan Nagasaki"],["15 Ogos 1945","Jepun menyerah kalah"],["12 Sept 1945","Tamat pendudukan Jepun di negara kita"]],"kad":[["Tiga faktor Perang Dunia Pertama?","Persaingan kuasa imperialis, pakatan ketenteraan, krisis rantau Balkan."],["Anggota Kuasa Paksi?","Jerman, Itali, Jepun."],["Di manakah Jepun mula-mula mendarat di Tanah Melayu?","Pantai Kuala Pak Amat, Kota Bharu, Kelantan (8 Disember 1941)."],["Dua faktor Jepun datang ke negara kita?","Eksploitasi bahan mentah dan kepentingan strategik ketenteraan."],["Apakah \"wang pokok pisang\"?","Mata wang Jepun yang dicetak tanpa kawalan sehingga berlaku inflasi."],["Siapakah Kempeitai?","Pasukan polis tentera Jepun yang kejam."],["Mengapakah orang Cina dilayan kejam oleh Jepun?","Lanjutan permusuhan Perang China-Jepun."],["Siapakah wira Bukit Candu?","Leftenan Adnan Saidi, Rejimen Askar Melayu."],["Apakah matlamat KRIS?","Kemerdekaan Tanah Melayu bersama-sama Indonesia."],["Siapakah yang mendamaikan Kiai Salleh dengan Bintang Tiga?","Dato' Onn Jaafar, di Batu Pahat."]],"kuiz":[{"q":"Peristiwa manakah yang mencetuskan Perang Dunia Pertama?","o":["Jerman menyerang Poland","Pembunuhan Archduke Ferdinand","Serangan Jepun ke atas Pearl Harbour","Itali menyerang Habsyah"],"a":1,"e":"Putera Mahkota Austria-Hungary dibunuh oleh pemuda Serbia dalam krisis Balkan."},{"q":"Mengapakah Jepun mahu menguasai Miri dan Lutong?","o":["Untuk mendapatkan sumber minyak","Sebagai pangkalan tentera laut","Untuk mendapatkan bijih timah","Sebagai pusat pentadbiran"],"a":0,"e":"Sasaran utama Jepun di Sarawak ialah telaga minyak di Miri dan Lutong."},{"q":"Negeri manakah yang diserahkan oleh Jepun kepada Thailand?","o":["Perak, Selangor, Pahang, Negeri Sembilan","Johor, Melaka, Pulau Pinang, Singapura","Perlis, Kedah, Kelantan, Terengganu","Kedah, Perak, Kelantan, Pahang"],"a":2,"e":"Empat negeri Melayu utara dipindahkan ke bawah pentadbiran Thailand."},{"q":"Apakah gerakan anti-Jepun yang terbesar di Tanah Melayu?","o":["Force 136","Wataniah Pahang","Gerila Kinabalu","MPAJA"],"a":3,"e":"MPAJA ditubuhkan oleh PKM dan mempunyai lapan rejimen."},{"q":"Mengapakah Bintang Tiga dapat menguasai Tanah Melayu selama kira-kira 14 hari?","o":["British menyerahkan kuasa kepada PKM","Jepun melantik PKM sebagai pentadbir","Wujud kekosongan kuasa kerana British lewat mendarat","Raja-raja Melayu menyokong PKM"],"a":2,"e":"British hanya kembali pada 3 September 1945, selepas Jepun menyerah kalah pada 15 Ogos."}],"mnem":["**Kuasa Paksi: \"JIJ\"** → **J**erman, **I**tali, **J**epun. Selebihnya Bersekutu.","**Bom atom: \"Hiro 6, Naga 9\"** → Hiroshima 6 Ogos, Nagasaki 9 Ogos, menyerah 15 Ogos 1945.","**Jepun datang sebab \"B-S\"** → **B**ahan mentah, **S**trategik."],"nilai":["**Keamanan** mesti dihargai; perang hanya membawa kesengsaraan.","**Perpaduan kaum** penting – pergaduhan selepas perang menunjukkan bahayanya permusuhan antara kaum."],"t":4,"n":3,"title":"Konflik Dunia dan Pendudukan Jepun di Negara Kita","id":"t4b3","inti":"Dua perang dunia berpunca daripada **persaingan kuasa besar**. Jepun menduduki negara kita **1942–1945** kerana mahu **bahan mentah dan kedudukan strategik**. Rakyat sengsara, tetapi **semangat nasionalisme makin kuat**."},{"secs":[{"h":"4.1 British Military Administration (BMA)","blocks":[{"k":"ul","items":[{"x":"Bermula **12 September 1945**. Pentadbiran **tentera** di bawah **Lord Mountbatten**."},{"x":"Dua tugas: **mengembalikan kestabilan/keamanan** dan **memulihkan kepercayaan rakyat**."},{"x":"**MPAJA dibubarkan** pada 1 Disember 1945."}]},{"k":"call","x":"BMA **gagal**: senjata tidak dapat dikumpul semula, jenayah, kongsi gelap, pasar gelap, rasuah, ketegangan kaum dan kekurangan makanan tidak dapat diatasi."}]},{"h":"4.2 Gagasan Malayan Union","blocks":[{"k":"ul","items":[{"x":"Dirangka oleh **Unit Perancang Tanah Melayu** (ketua: **Mejar Jeneral Ralph Hone**)."},{"x":"Dibentangkan di Parlimen British oleh **George Henry Hall** – **Kertas Putih 6274**."},{"x":"Dilaksanakan pada **1 April 1946**. Gabenor: **Sir Edward Gent**."}]},{"k":"tbl","head":["Ciri","Butiran"],"rows":[["**Kesatuan**","NNMB + NNMTB + Negeri-negeri Selat **kecuali Singapura** digabung menjadi satu unit"],["**Ketua pentadbir**","**Gabenor British** dilantik oleh Raja England"],["**Raja-raja Melayu**","Hanya membincangkan **agama Islam dan adat istiadat Melayu** – hilang kuasa politik"],["**Kewarganegaraan**","Prinsip ***jus soli*** (berdasarkan **tempat lahir**) – sangat longgar"]]},{"k":"call","x":"Malayan Union menukar taraf Tanah Melayu daripada **negeri naungan** kepada **tanah jajahan**."},{"k":"ul","items":[{"x":"**H.C. Willan** – merintis jalan, meninjau sokongan sultan."},{"x":"**Sir Harold MacMichael** – mendapatkan tandatangan 9 Raja Melayu dengan **desakan, paksaan dan ugutan** (mengugut tidak mengiktiraf sultan yang enggan)."}]}]},{"h":"4.3 Reaksi terhadap Malayan Union","blocks":[{"k":"ul","items":[{"x":"**Sebab ditentang:** sultan **hilang kedaulatan dan kuasa**; kerakyatan *jus soli* terlalu longgar; **cara MacMichael** memaksa sultan; Tanah Melayu menjadi tanah jajahan."},{"x":"**Cara Raja-raja Melayu membantah:**","sub":["Membawa kes ke **Mahkamah Tinggi England**.","Menghantar **surat bantahan ke London**.","**Menyokong Kongres Melayu** (Sultan Selangor menderma dan merasmikan).","**Memulaukan upacara pelantikan Gabenor** Sir Edward Gent.","**Raja Perempuan Kelsom** (Permaisuri Perak) mengetuai perarakan wanita di Kuala Kangsar."]},{"x":"**Cara rakyat membantah:**","sub":["**Akhbar** – *Utusan Melayu*, *Majlis*, *Warta Negara*.","**Cendekiawan** – Dato' Onn Jaafar, Za'ba, Dato' Panglima Bukit Gantang, Dato' Nik Ahmad Kamil.","**Wanita** – Cikgu Zaharah Abdullah, Halimahton Abd Majid, Datin Puteh Mariah.","**Persatuan Melayu** – SABERKAS, Persatuan Melayu Selangor, Pergerakan Melayu Semenanjung Johor.","**Bekas pegawai British** – Frank Swettenham, Richard Winstedt, George Maxwell.","**Berkabung** – lilit **kain putih di songkok**; hari lahir Malayan Union dianggap \"Hari Kematian\"."]},{"x":"**Kongres Melayu, 1–4 Mac 1946** – Kelab Sultan Sulaiman, Kampung Baru, Kuala Lumpur; **41 pertubuhan Melayu**. Bersetuju menubuhkan UMNO."},{"x":"**UMNO ditubuhkan pada 11 Mei 1946** di **Istana Besar Johor Bahru**. Pemimpin: **Dato' Onn Jaafar**."},{"x":"Slogan: **\"Hidup Melayu\"**, \"Daulat Tuanku\"."},{"x":"Ahli Parlimen British **L.D. Gammans** dan **Rees Williams** datang meninjau dan menyokong cadangan menggantikan Malayan Union dengan **Persekutuan Tanah Melayu**."}]}]},{"h":"4.4 Penyerahan Sarawak kepada British","blocks":[{"k":"ul","items":[{"x":"**1 Julai 1946** – **Vyner Brooke** menyerahkan Sarawak. Sarawak menjadi **tanah jajahan British**."},{"x":"**3 faktor penyerahan:**","sub":["**Masalah pewarisan takhta** – tiada anak lelaki; enggan melantik **Anthony Brooke**.","**Desakan kerajaan British**.","**Masalah kewangan** – tidak mampu memulihkan Sarawak selepas perang."]},{"x":"**Gerard T. MacBryan** (setiausaha peribadi) mendapatkan persetujuan ketua tempatan."},{"x":"**Majlis Negeri** meluluskan Rang Undang-Undang Penyerahan (*Cession Bill*): **19 undi sokong, 16 undi menentang**."}]}]},{"h":"4.5 Reaksi terhadap Penyerahan Sarawak","blocks":[{"k":"tbl","head":["","Menentang","Menyokong"],"rows":[["**Pemimpin**","**Datu Patinggi Abang Haji Abdillah**","**Datu Bandar Abang Haji Mustapha**"],["**Sebab**","Melanggar **Prinsip Kelapan Perlembagaan 1941** (janji berkerajaan sendiri); mengetepikan wasiat Charles Brooke; **muslihat MacBryan**","Memajukan negeri; memajukan penduduk tempatan; peluang pekerjaan dalam perkhidmatan awam"],["**Pertubuhan**","PKMS, PPM, BPS","Young Malay Association (YMA)"]]},{"k":"ul","items":[{"x":"**Bentuk penentangan:** persidangan; **demonstrasi** (30 Oktober 1946, ketibaan Gabenor Charles Arden Clarke; sepanduk \"No Cession\"); surat bantahan; akhbar ***Utusan Sarawak***; wanita (**Cikgu Lily Eberwein**, Cikgu Ajibah Abol)."},{"x":"**Pekeliling No. 9** melarang pegawai awam menyertai gerakan → **409 kakitangan kerajaan meletakkan jawatan** (2 April 1947)."},{"x":"**Rukun 13** (ditubuhkan 20 Ogos 1948, Sibu) – Awang Rambli, Morshidi Sidek, Bujang Suntong."},{"x":"**Rosli Dhoby** menikam Gabenor **Duncan Stewart** di Sibu (3 Disember 1949). Empat pejuang dihukum **gantung**. Gerakan antipenyerahan **gagal**, tetapi membangkitkan nasionalisme."}]}]},{"h":"4.6 & 4.7 Penyerahan Sabah","blocks":[{"k":"ul","items":[{"x":"**SBUB** (Syarikat Borneo Utara British) menyerahkan Sabah. Sabah menjadi tanah jajahan pada **15 Julai 1946**. Gabenor pertama: Sir Edward Twining."},{"x":"**Faktor:** kemusnahan teruk akibat perang (SBUB tidak mampu memulihkan); **memenuhi kepentingan British** (bahan mentah dan pasaran); meneruskan dasar British."},{"x":"**Tiada penentangan** kerana:","sub":["**British menindas kegiatan berpersatuan** – pemimpin dipindahkan atau ditawarkan jawatan (PKML, BARIP).","Penduduk pelbagai etnik – **sukar disatukan**.","**Peluang dalam pentadbiran dihadkan** – kurang pengalaman.","Penduduk mengharapkan **kemajuan sosioekonomi**."]}]}]}],"dates":[["12 Sept 1945","BMA bermula di Tanah Melayu"],["Okt–Dis 1945","MacMichael mendapatkan tandatangan sultan"],["1–4 Mac 1946","Kongres Melayu di Kuala Lumpur"],["1 Apr 1946","Malayan Union diisytiharkan"],["11 Mei 1946","UMNO ditubuhkan di Johor Bahru"],["1 Jul 1946","Sarawak diserahkan kepada British"],["15 Jul 1946","Sabah menjadi tanah jajahan British"],["2 Apr 1947","409 kakitangan kerajaan Sarawak letak jawatan"],["3 Dis 1949","Rosli Dhoby menikam Duncan Stewart"]],"kad":[["Bilakah Malayan Union diisytiharkan?","1 April 1946."],["Apakah maksud jus soli?","Kewarganegaraan berdasarkan tempat lahir."],["Siapakah yang mendapatkan tandatangan Raja-raja Melayu?","Sir Harold MacMichael."],["Di manakah dan bilakah UMNO ditubuhkan?","Istana Besar Johor Bahru, 11 Mei 1946."],["Negeri yang tidak dimasukkan dalam Malayan Union?","Singapura."],["Tiga faktor Vyner Brooke menyerahkan Sarawak?","Masalah pewarisan takhta, desakan British, masalah kewangan."],["Siapakah pemimpin gerakan antipenyerahan Sarawak?","Datu Patinggi Abang Haji Abdillah."],["Apakah Rukun 13?","Kumpulan sulit pemuda PPM di Sibu yang menyasarkan pegawai tinggi British."],["Mengapakah penyerahan Sabah tidak ditentang?","British menindas kegiatan berpersatuan, penduduk sukar disatukan dan mengharapkan kemajuan."],["Apakah tanda berkabung orang Melayu menentang Malayan Union?","Lilitan kain putih di songkok."]],"kuiz":[{"q":"Mengapakah orang Melayu menentang Malayan Union?","o":["Singapura dimasukkan ke dalam Malayan Union","Raja-raja Melayu kehilangan kedaulatan dan kuasa","Negeri-negeri Melayu dipisahkan","Jawatan Residen dimansuhkan"],"a":1,"e":"Sultan hanya boleh membincangkan agama Islam dan adat Melayu; kuasa di tangan Gabenor British."},{"q":"Kongres Melayu pada Mac 1946 penting kerana","o":["menggubal perlembagaan baharu","melantik Gabenor Malayan Union","bersetuju menubuhkan UMNO","menuntut kemerdekaan segera"],"a":2,"e":"41 pertubuhan Melayu bersetuju menubuhkan badan induk, iaitu UMNO."},{"q":"Tindakan Vyner Brooke menyerahkan Sarawak ditentang kerana","o":["melanggar Prinsip Kelapan Perlembagaan 1941","ditentang oleh orang Cina","tidak diluluskan oleh Majlis Negeri","British enggan menerima Sarawak"],"a":0,"e":"Perlembagaan 1941 menjanjikan pemerintahan sendiri kepada rakyat Sarawak."},{"q":"Apakah kesan Pekeliling No. 9 di Sarawak?","o":["Rukun 13 dibubarkan","Utusan Sarawak diharamkan","Anthony Brooke dilantik sebagai raja","409 orang kakitangan kerajaan meletakkan jawatan"],"a":3,"e":"Mereka membantah larangan menyertai gerakan antipenyerahan."},{"q":"BMA gagal memulihkan kepercayaan rakyat kerana","o":["menaikkan cukai tanah","tidak dapat membanteras jenayah, pasar gelap dan kekurangan makanan","menyerahkan kuasa kepada MPAJA","menutup sekolah Melayu"],"a":1,"e":"Rakyat hampa kerana masalah selepas perang tidak dapat diatasi."}],"mnem":["**Ciri Malayan Union: \"G-R-K-S\"** → **G**abenor berkuasa, **R**aja hilang kuasa, **K**erakyatan *jus soli*, **S**ingapura diasingkan.","**Tarikh 1946 ikut urutan:** Mac – Kongres Melayu → **1 April** – Malayan Union → **11 Mei** – UMNO → **1 Julai** – Sarawak → **15 Julai** – Sabah.","**Sarawak diserah sebab \"T-D-K\"** → **T**akhta tiada pewaris, **D**esakan British, **K**ewangan."],"nilai":["**Perpaduan dan semangat sanggup berkorban** berjaya menggagalkan Malayan Union.","Jangan mudah mempercayai kuasa asing; **kedaulatan** mesti dipertahankan."],"t":4,"n":4,"title":"Era Peralihan Kuasa British di Negara Kita","id":"t4b4","inti":"Selepas Jepun kalah, British kembali dengan **BMA**, kemudian memperkenalkan **Malayan Union (1 April 1946)**. Orang Melayu **menentang habis-habisan** sehingga lahir **UMNO**. Sarawak dan Sabah pula **diserahkan kepada British** dan menjadi tanah jajahan."},{"secs":[{"h":"5.1 Latar Belakang Penubuhan","blocks":[{"k":"ul","items":[{"x":"**Jawatankuasa Kerja** ditubuhkan pada **25 Julai 1946** untuk merangka Perjanjian Persekutuan."},{"x":"Ahlinya 3 pihak: **wakil Raja-raja Melayu, wakil UMNO, pegawai kanan British**."},{"x":"**5 cadangan Jawatankuasa Kerja:**","sub":["Menyatukan **semua negeri Melayu dan dua Negeri Selat** dalam satu pentadbiran.","**Memulihkan kedudukan dan kedaulatan Raja-raja Melayu**.","Menjaga **kedudukan istimewa orang Melayu** dan kepentingan sah kaum lain.","Menubuhkan **Dewan Perundangan Negeri** bagi setiap negeri.","Syarat **kewarganegaraan yang ketat**."]}]},{"k":"call","x":"Golongan radikal Melayu dan bukan Melayu **tidak dijemput** ke dalam Jawatankuasa Kerja, lalu mereka membantah."},{"k":"tbl","head":["Gabungan","Siapa","Anggota"],"rows":[["**PUTERA** (Pusat Tenaga Rakyat)","Nasionalis **Melayu radikal**","**PKMM** (Dr. Burhanuddin al-Helmi), **API** (Ahmad Boestamam), **AWAS** (Shamsiah Fakeh), GERAM, Hizbul Muslimin (Abu Bakar al-Baqir), BATAS"],["**AMCJA**","Golongan **bukan Melayu** – pengerusi **Tan Cheng Lock**","PMFTU, MDU (John Eber), MIC (John Thivy)"]]},{"k":"ul","items":[{"x":"**PUTERA-AMCJA** mengemukakan **Perlembagaan Rakyat** (Julai 1947) sebagai alternatif:","sub":["Tanah Melayu **disatukan dengan Singapura**.","Dewan Perundangan Pusat yang **dipilih**.","**Kewarganegaraan yang sama** untuk semua yang setia; warganegara dinamakan **\"Melayu\"**.","Raja-raja Melayu sebagai **Raja Berperlembagaan**.","**Bahasa Melayu** sebagai bahasa kebangsaan dan bahasa rasmi tunggal.","Bendera berlatar **merah dan putih**."]},{"x":"British **menolak** Perlembagaan Rakyat → PUTERA-AMCJA menganjurkan **hartal** pada **20 Oktober 1947**."},{"x":"**Hartal** = tutup kedai dan hentikan semua kegiatan ekonomi sebagai protes **tanpa keganasan**."}]}]},{"h":"5.2 Faktor Penubuhan Persekutuan Tanah Melayu 1948","blocks":[{"k":"ul","items":[{"x":"**Penentangan orang Melayu terhadap Malayan Union** – Gammans dan Rees Williams melaporkan keadaan boleh menjadi huru-hara."},{"x":"**Cadangan Raja-raja Melayu dan UMNO** (pertemuan di Kuala Kangsar, 27 Mei 1946):","sub":["Persekutuan bertaraf **naungan**, bukan tanah jajahan.","**Pesuruhjaya Tinggi** menggantikan Gabenor.","Perjanjian baharu menggantikan Malayan Union."]},{"x":"**Sokongan pentadbir British** – Sir Edward Gent, Malcolm MacDonald, Sir Ralph Hone. Persekutuan membawa keamanan, kestabilan dan pelaburan."},{"x":"British perlu melaksanakan **dekolonisasi** (proses ke arah berkerajaan sendiri) mengikut **Piagam Atlantik**."}]}]},{"h":"5.3 Ciri-ciri Persekutuan Tanah Melayu 1948","blocks":[{"k":"tbl","head":["Aspek","Ciri"],"rows":[["**Pentadbiran**","Gabungan **9 negeri Melayu + 2 Negeri Selat** (Pulau Pinang, Melaka). **Singapura kekal berasingan**. Diketuai **Pesuruhjaya Tinggi British**. Ada Majlis Mesyuarat Persekutuan dan **Majlis Perundangan Persekutuan**"],["**Kuasa Raja-raja Melayu**","**Majlis Raja-Raja** dibentuk. Sultan mengesahkan rang undang-undang negeri"],["**Perundangan**","Majlis Perundangan Persekutuan diketuai Pesuruhjaya Tinggi. Rang undang-undang perlu **perkenan Raja-raja Melayu**"],["**Kewarganegaraan**","**Diketatkan**. Secara pendaftaran: lahir di Persekutuan dan bermastautin **15 daripada 20 tahun**, berkelakuan baik, **menguasai bahasa Melayu dan Inggeris**, taat setia"]]},{"k":"ul","items":[{"x":"**Rakyat Raja** = orang Melayu dan Orang Asli di negeri yang bersultan."}]}]},{"h":"5.4 Kesan Penubuhan","blocks":[{"k":"ul","items":[{"x":"**Mengembalikan kedudukan Raja-raja Melayu** – Majlis Raja-Raja diwujudkan."},{"x":"**Menjaga kedudukan istimewa orang Melayu** dan kepentingan sah kaum lain."},{"x":"**Membuka ruang kewarganegaraan** kepada orang bukan Melayu."},{"x":"**Mewujudkan kerjasama kaum** – penubuhan **Jawatankuasa Hubungan Antara Kaum (CLC)**."},{"x":"Merintis jalan kepada **Perlembagaan 1957 dan kemerdekaan**."}]},{"k":"tbl","head":["","Malayan Union 1946","Persekutuan Tanah Melayu 1948"],"rows":[["Ketua","Gabenor","Pesuruhjaya Tinggi"],["Taraf","Tanah jajahan","Negeri naungan"],["Raja-raja Melayu","Hilang kuasa","Kuasa dikembalikan"],["Kerakyatan","Longgar (*jus soli*)","Ketat"]]}]}],"dates":[["27 Mei 1946","Raja-raja Melayu berunding dengan British di Kuala Kangsar"],["25 Jul 1946","Jawatankuasa Kerja ditubuhkan"],["Jul 1947","Perlembagaan Rakyat dikemukakan"],["20 Okt 1947","Hartal Se-Malaya"],["21 Jan 1948","Raja-raja Melayu menandatangani Perjanjian Persekutuan"],["1 Feb 1948","Persekutuan Tanah Melayu ditubuhkan"]],"kad":[["Bilakah Persekutuan Tanah Melayu ditubuhkan?","1 Februari 1948."],["Siapakah ahli Jawatankuasa Kerja?","Wakil Raja-raja Melayu, wakil UMNO dan pegawai kanan British."],["Apakah PUTERA?","Pusat Tenaga Rakyat – gabungan nasionalis Melayu radikal (PKMM, API, AWAS dan lain-lain)."],["Siapakah pengerusi AMCJA?","Tan Cheng Lock."],["Apakah hartal?","Protes tanpa keganasan dengan menutup kedai dan menghentikan kegiatan ekonomi."],["Siapakah ketua Persekutuan Tanah Melayu 1948?","Pesuruhjaya Tinggi British."],["Berapa negeri dalam Persekutuan Tanah Melayu 1948?","9 negeri Melayu dan 2 Negeri Selat; Singapura diasingkan."],["Apakah maksud dekolonisasi?","Proses ke arah berkerajaan sendiri."]],"kuiz":[{"q":"Mengapakah PUTERA-AMCJA menentang Jawatankuasa Kerja?","o":["Jawatankuasa itu tidak melibatkan semua pihak","Jawatankuasa itu menolak sistem persekutuan","Jawatankuasa itu dianggotai oleh PKM","Jawatankuasa itu mahu mengekalkan Malayan Union"],"a":0,"e":"Hanya Raja-raja Melayu, UMNO dan British yang terlibat."},{"q":"Apakah kesan penubuhan Persekutuan Tanah Melayu 1948?","o":["Singapura disatukan dengan Tanah Melayu","Gabenor British dilantik sebagai ketua","Syarat kerakyatan dilonggarkan","Kedudukan Raja-raja Melayu dikembalikan"],"a":3,"e":"Majlis Raja-Raja diwujudkan dan kedaulatan sultan dipulihkan."},{"q":"Apakah bentuk bantahan PUTERA-AMCJA selepas Perlembagaan Rakyat ditolak?","o":["Mogok lapar","Hartal","Pemberontakan bersenjata","Memulaukan pilihan raya"],"a":1,"e":"Hartal Se-Malaya diadakan pada 20 Oktober 1947."},{"q":"Jawatan manakah yang menggantikan Gabenor dalam Persekutuan Tanah Melayu 1948?","o":["Residen Jeneral","Ketua Menteri","Pesuruhjaya Tinggi","Menteri Besar"],"a":2,"e":"Ini salah satu cadangan Raja-raja Melayu."},{"q":"Persekutuan Tanah Melayu 1948 membuka jalan kepada kerjasama kaum melalui penubuhan","o":["Jawatankuasa Kerja","Majlis Raja-Raja","Unit Perancang Tanah Melayu","Jawatankuasa Hubungan Antara Kaum"],"a":3,"e":"CLC memupuk persefahaman antara pemimpin pelbagai kaum."}],"mnem":["**Kesan PTM 1948: \"R-I-K-K\"** → **R**aja kembali berkuasa, **I**stimewa orang Melayu dijaga, **K**erakyatan dibuka (tetapi ketat), **K**erjasama kaum (CLC).","**Ingat pasangan:** Malayan Union = **Gabenor**; Persekutuan 1948 = **Pesuruhjaya Tinggi**."],"nilai":["**Kerjasama raja, pemimpin dan rakyat** berjaya mengembalikan maruah bangsa.","**Tolak ansur antara kaum** penting untuk kestabilan negara."],"t":4,"n":5,"title":"Persekutuan Tanah Melayu 1948","id":"t4b5","inti":"Malayan Union ditolak, lalu diganti dengan **Persekutuan Tanah Melayu pada 1 Februari 1948**. Hasilnya: **kuasa Raja-raja Melayu dikembalikan**, kedudukan istimewa orang Melayu dijaga dan **syarat kerakyatan diketatkan**."},{"secs":[{"h":"6.1 Kemasukan Pengaruh Komunis","blocks":[{"k":"ul","items":[{"x":"**Dari China** – melalui cawangan **Parti Kuomintang (KMT)** sejak awal 1920-an. **Comintern** (Moscow) mengarahkan penubuhan **Parti Komunis Nanyang (1928)**, kemudian PKM."},{"x":"**Dari Indonesia** – **Tan Malaka, Alimin, Moeso**. Tidak mendapat sambutan orang Melayu kerana komunis **menggunakan kekerasan**."},{"x":"**PKM ditubuhkan pada 30 April 1930** di **Kuala Pilah, Negeri Sembilan**."},{"x":"PKM bergerak melalui **kesatuan sekerja**, pertubuhan, akhbar dan **sekolah Cina**."},{"x":"Zaman Jepun: PKM bekerjasama dengan British dan menubuhkan **MPAJA (Bintang Tiga)**."},{"x":"Selepas perang: menyusup ke dalam **PMFTU**; menguasai 335 kesatuan sekerja. British meluluskan **Trade Union Ordinance 1948** dan **mengharamkan PKM**."}]}]},{"h":"6.2 Ancaman Komunis","blocks":[{"k":"ul","items":[{"x":"Persidangan komunis di **Calcutta, India (1948)** → PKM memutuskan **perjuangan bersenjata**."},{"x":"**16 Jun 1948** – komunis membunuh **3 pengurus ladang Eropah** di **Sungai Siput, Perak**."},{"x":"**Sir Edward Gent** mengisytiharkan darurat; **18 Jun 1948** – darurat di **seluruh Tanah Melayu**."},{"x":"**Tindakan komunis:**","sub":["**Melumpuhkan ekonomi** – menyerang **lombong bijih timah dan ladang getah**.","**Merosakkan infrastruktur** – landasan kereta api, jalan raya, telefon, paip air.","**Mengancam keselamatan rakyat** – mengugut, menculik, membunuh.","**Menyerang pasukan keselamatan** – contohnya **Balai Polis Bukit Kepong**, Muar."]},{"x":"**6 Oktober 1951** – **Sir Henry Gurney** (Pesuruhjaya Tinggi) dibunuh dalam serang hendap di jalan ke **Bukit Fraser**."}]}]},{"h":"6.3 Usaha Menangani Ancaman Komunis","blocks":[{"k":"call","x":"Ada **9 usaha**. Hafal sekurang-kurangnya 5 dengan huraian."},{"k":"ul","items":[{"x":"**1. Undang-Undang Darurat** – tahan tanpa bicara, hukuman mati kerana memiliki senjata api, **mengharamkan PKM** dan parti radikal (PKMM, AWAS, Hizbul Muslimin)."},{"x":"**2. Pemerkasaan pasukan keselamatan:**"}]},{"k":"tbl","head":["Pasukan","Perkara penting"],"rows":[["**Cawangan Khas**","Badan perisik; menyusup ke dalam PKM"],["**Special Constables (SC)**","Mengawal ladang dan lombong"],["**Polis Hutan**","Memburu komunis di hutan"],["**Senoi Praaq**","Orang Asli; \"The Silent Killers\""],["**Home Guard**","Pengawal kampung; sekat bekalan makanan kepada komunis"],["**Sarawak Rangers**","Orang Iban, penjejak; cogan kata **\"Agi Idup Agi Ngelaban\"**"],["**Askar Melayu, Askar Komanwel**","Operasi ketenteraan"]]},{"k":"ul","items":[{"x":"**3. Pendaftaran kebangsaan dan kad pengenalan** (23 Julai 1948) – umur **12 tahun ke atas**; membezakan orang awam dengan komunis."},{"x":"**4. Rancangan Briggs (1950)** – **Sir Harold Briggs**. Tujuan: **memutuskan hubungan PKM dengan Min Yuen** (pembekal makanan, ubat, maklumat). Penduduk pinggir hutan dipindahkan ke **Kampung Baru**. Langkah yang **berkesan** melemahkan komunis."},{"x":"**5. Tawaran pengampunan** (6 September 1949) – risalah, Radio Malaya."},{"x":"**6. Kempen Bulan Rakyat Melawan Penjahat** (22 Disember 1949) – sukarelawan pelbagai kaum."},{"x":"**7. Perintah berkurung** – contohnya **Tanjung Malim** (1952)."},{"x":"**8. Perang saraf** – **Sir Gerald Templer**: **memenangi hati dan fikiran rakyat**.","sub":["Lawatan mendampingi rakyat.","**Melonggarkan syarat kewarganegaraan** (1952).","Pilihan raya Majlis Perbandaran Kuala Lumpur.","**Hadiah wang tunai** (tangkap Chin Peng: $250 ribu).","Memenangi kepercayaan Orang Asli.","**Kawasan hitam** (komunis aktif) dan **kawasan putih** (bebas komunis)."]},{"x":"**9. Rundingan Baling** (**28 Disember 1955**, Baling, Kedah) – **Tunku Abdul Rahman**, Tan Cheng Lock, David Marshall bertemu **Chin Peng**, Chen Tien, Rashid Maidin. **Gagal** kerana Chin Peng mahu PKM **diiktiraf sebagai parti yang sah**; Tunku menolak."}]}]},{"h":"6.4 Kesan Zaman Darurat","blocks":[{"k":"tbl","head":["Politik","Sosioekonomi"],"rows":[["**Jumlah warganegara meningkat** – kira-kira 1.2 juta orang Cina dan 180 ribu orang India (1952)","**Kos perbelanjaan meningkat** – $250–300 ribu sehari"],["**Penubuhan MCA** (27 Februari 1949) oleh **Tan Cheng Lock**","**Rakyat menderita** – catuan makanan, perintah berkurung, harga barang naik"],["**Mempercepat kemerdekaan** – kerjasama kaum (Parti Perikatan) meyakinkan British","**Hubungan kaum renggang** – Kampung Baru didominasi satu kaum"],["","**Ramai terkorban** – orang awam dan pasukan keselamatan"]]},{"k":"ul","items":[{"x":"Darurat berlangsung **12 tahun** dan ditamatkan pada **31 Julai 1960**."}]}]}],"dates":[["30 Apr 1930","PKM ditubuhkan di Kuala Pilah"],["16 Jun 1948","Pembunuhan 3 pengurus ladang di Sungai Siput"],["18 Jun 1948","Darurat di seluruh Tanah Melayu"],["27 Feb 1949","MCA ditubuhkan"],["1950","Rancangan Briggs"],["6 Okt 1951","Sir Henry Gurney dibunuh"],["1952","Templer – perang saraf"],["28 Dis 1955","Rundingan Baling"],["31 Jul 1960","Darurat tamat"]],"kad":[["Di manakah PKM ditubuhkan?","Kuala Pilah, Negeri Sembilan (30 April 1930)."],["Peristiwa yang mencetuskan darurat?","Pembunuhan tiga pengurus ladang Eropah di Sungai Siput, Perak (16 Jun 1948)."],["Apakah tujuan Rancangan Briggs?","Memutuskan hubungan PKM dengan Min Yuen."],["Apakah Min Yuen?","Organisasi yang membekalkan makanan, wang, ubat dan maklumat kepada komunis."],["Siapakah yang melaksanakan perang saraf?","Sir Gerald Templer."],["Apakah kawasan putih?","Kawasan yang bebas daripada ancaman komunis."],["Mengapakah Rundingan Baling gagal?","Chin Peng mahu PKM diiktiraf sebagai parti politik yang sah; Tunku Abdul Rahman menolak."],["Siapakah pengasas MCA?","Tan Cheng Lock (27 Februari 1949)."],["Cogan kata Sarawak Rangers?","\"Agi Idup Agi Ngelaban\" – selagi hidup selagi melawan."]],"kuiz":[{"q":"Mengapakah komunis menyerang lombong bijih timah dan ladang getah?","o":["Untuk mendapatkan pekerja","Untuk melumpuhkan ekonomi British","Untuk membina kubu pertahanan","Untuk mendapatkan senjata"],"a":1,"e":"Bijih timah dan getah ialah sumber utama ekonomi British di Tanah Melayu."},{"q":"Rancangan Briggs dilaksanakan dengan cara","o":["menawarkan pengampunan kepada komunis","menubuhkan Cawangan Khas","memindahkan penduduk pinggir hutan ke Kampung Baru","memperkenalkan kad pengenalan"],"a":2,"e":"Dengan itu, bekalan makanan dan maklumat kepada komunis terputus."},{"q":"Apakah matlamat perang saraf Sir Gerald Templer?","o":["Memenangi hati dan fikiran rakyat","Menambah bilangan askar Komanwel","Mengharamkan semua parti politik","Memindahkan orang Melayu ke bandar"],"a":0,"e":"Rakyat yang menyokong kerajaan akan menyampaikan maklumat tentang komunis."},{"q":"Siapakah wakil PKM dalam Rundingan Baling?","o":["Tan Malaka, Alimin, Moeso","Tan Cheng Lock, David Marshall, Chen Tien","Lai Tek, Chin Peng, Musa Ahmad","Chin Peng, Chen Tien, Rashid Maidin"],"a":3,"e":"Kerajaan pula diwakili Tunku Abdul Rahman, Tan Cheng Lock dan David Marshall."},{"q":"Apakah kesan politik zaman darurat?","o":["Hubungan kaum menjadi renggang","Kos perbelanjaan kerajaan meningkat","Penubuhan MCA","Harga barang melambung tinggi"],"a":2,"e":"A, B dan D ialah kesan sosioekonomi."}],"mnem":["**PKM lahir di \"KP 30-4-30\"** → **K**uala **P**ilah, 30 April 1930.","**Tiga Pesuruhjaya Tinggi zaman darurat ikut urutan: \"Gent – Gurney – Templer\"** → isytihar darurat, Rancangan Briggs (dibunuh 1951), perang saraf.","**Briggs = pindah (Kampung Baru). Templer = pujuk (hati dan fikiran).**"],"nilai":["**Kerjasama rakyat pelbagai kaum dengan kerajaan** ialah kunci menewaskan musuh negara.","Hargai **pengorbanan pasukan keselamatan** yang mempertahankan tanah air."],"t":4,"n":6,"title":"Ancaman Komunis dan Perisytiharan Darurat","id":"t4b6","inti":"**PKM** mahu menubuhkan **Republik Komunis** di Tanah Melayu dengan keganasan. British mengisytiharkan **darurat (1948–1960)**. Komunis ditewaskan melalui **ketenteraan + memenangi hati rakyat**, dan darurat **mempercepat kemerdekaan**."},{"secs":[{"h":"7.1 Latar Belakang Idea Negara Merdeka","blocks":[{"k":"tbl","head":["Parti / pertubuhan","Pemimpin","Idea / slogan"],"rows":[["**KMM** (1938)","Ibrahim Haji Yaakob","Merdeka melalui **Melayu Raya**"],["**PKMM** (1945)","Dr. Burhanuddin al-Helmi, Ishak Haji Muhammad, Ahmad Boestamam","Melayu Raya; slogan **\"Merdeka\"**"],["**API**","Ahmad Boestamam","**\"Merdeka dengan Darah\"**; diharamkan British"],["**PKMS** (Sarawak)","Datu Patinggi Abang Haji Abdillah","Menentang penyerahan; mahu berkerajaan sendiri (Perlembagaan 1941)"],["**UMNO** (1946)","Dato' Onn Jaafar","**\"Hidup Melayu\"** → ditukar kepada **\"Merdeka\" (1951)**; kemerdekaan melalui **perundingan**"],["**PKML** (Sabah)","Tengku Noordin, Zakaria Gunn","Menuntut Sabah merdeka daripada British"],["**MIC** (1946)","John Thivy","Bekerjasama dengan kaum lain"],["**Hizbul Muslimin** (1947)","Abu Bakar al-Baqir","Merdeka sebagai **negara Islam**; diharamkan"],["**MCA** (1949)","Tan Cheng Lock","Negara berbilang kaum yang demokratik"],["**PAS** (1951)","Dr. Burhanuddin al-Helmi","Merdeka dengan **hukum Islam**"],["**IMP** (1951)","Dato' Onn Jaafar","**\"Tanah Melayu untuk Malayan\"** – parti pelbagai kaum"]]}]},{"h":"7.2 Jawatankuasa Hubungan Antara Kaum (CLC)","blocks":[{"k":"ul","items":[{"x":"Ditubuhkan **Januari 1949**. Pengerusi: **E.E.C. Thuraisingham**. Penasihat: Malcolm MacDonald."},{"x":"Moto: **\"Kesamaan dan Keadilan untuk Penduduk Tanah Melayu\"**."},{"x":"**Objektif:** mengkaji hubungan kaum; pembahagian politik, ekonomi dan sosial yang adil; mewujudkan **keharmonian dan muhibah**."}]},{"k":"call","x":"British memberi syarat: **kemerdekaan hanya diberi jika tiga kaum utama bekerjasama**."},{"k":"tbl","head":["Isu","Persetujuan CLC"],"rows":[["**Politik**","Pilihan raya secara **berperingkat** ke arah berkerajaan sendiri"],["**Kedudukan istimewa orang Melayu**","**Diperakui**; kepentingan sah kaum lain diiktiraf"],["**Ekonomi orang Melayu**","Tubuh agensi – **RIDA (1950)**"],["**Kewarganegaraan bukan Melayu**","Syarat **dilonggarkan**"],["**Pendidikan**","Sistem pendidikan yang **seragam**"]]},{"k":"ul","items":[{"x":"RIDA = tolak ansur: orang Melayu melonggarkan kerakyatan, kaum lain bersetuju bantuan ekonomi orang Melayu."}]}]},{"h":"7.3 Sistem Ahli","blocks":[{"k":"ul","items":[{"x":"Dilaksanakan **April 1951 – Jun 1955**. Diumumkan oleh **Sir Henry Gurney**. Cadangan asal: **Dato' Onn Jaafar**."},{"x":"Maksud: sistem yang **melatih penduduk tempatan mentadbir** Persekutuan Tanah Melayu."},{"x":"**Ciri-ciri:**","sub":["Seperti **kabinet bayangan**; ahli bertaraf **\"Menteri\"** dan menjaga satu portfolio.","Dilantik oleh **Pesuruhjaya Tinggi** dengan persetujuan **Majlis Raja-Raja**.","Diletakkan di bawah kuasa Pesuruhjaya Tinggi.","Ahlinya **pelbagai kaum** → memupuk perpaduan."]},{"x":"Contoh: **Dato' Onn Jaafar** – Ahli Hal Ehwal Dalam Negeri; **E.E.C. Thuraisingham** – Ahli Pelajaran; **Lee Tiang Keng** – Ahli Kesihatan."},{"x":"**Kepentingan:** asas melatih orang tempatan ke arah **berkerajaan sendiri**."}]}]},{"h":"7.4 Sistem Pendidikan Kebangsaan","blocks":[{"k":"ul","items":[{"x":"Masalah asal: **sekolah vernakular** ikut kaum, bahasa pengantar dan kurikulum berbeza → menghalang perpaduan."}]},{"k":"tbl","head":["Laporan","Isi penting"],"rows":[["**Laporan Barnes 1951**","Sekolah rendah guna **bahasa Melayu atau Inggeris**; menengah guna Inggeris. Dibantah masyarakat Cina"],["**Laporan Fenn-Wu 1951**","**Sekolah Cina dikekalkan**, berorientasikan Tanah Melayu"],["**Ordinan Pelajaran 1952**","Dua jenis sekolah rendah (Melayu, Inggeris); bahasa Cina dan Tamil sebagai bahasa ketiga. **Ditentang semua kaum**"],["**Laporan Woodhead 1955**","**Sarawak dan Sabah**; mengutamakan **bahasa Inggeris**"],["**Penyata Razak 1956**","**Asas sistem pendidikan kebangsaan**"]]},{"k":"ul","items":[{"x":"**Penyata Razak 1956** (Jawatankuasa Pelajaran, pengerusi **Dato' Abdul Razak Hussein**):","sub":["**Sistem persekolahan yang sama** untuk semua bangsa.","**Bahasa kebangsaan sebagai bahasa pengantar utama**.","**Kurikulum seragam** bercorak kebangsaan.","Sekolah Umum (bahasa Melayu) dan Sekolah Jenis Umum (Inggeris, Cina, Tamil).","**Bahasa Melayu dan Inggeris wajib** di semua sekolah.","Diluluskan menjadi **Ordinan Pelajaran 1957**."]}]}]},{"h":"7.5 Penubuhan Parti Politik dan Kerjasama Politik","blocks":[{"k":"ul","items":[{"x":"Banyak parti muncul selepas perang kerana **nasionalisme** dan hasrat merdeka."},{"x":"**Kerjasama politik ikut urutan:**","sub":["**PUTERA-AMCJA (1947)** – perintis kerjasama antara kaum; Perlembagaan Rakyat.","**Persidangan Kebangsaan (Februari 1954)** – diketuai **Dato' Panglima Bukit Gantang**; disertai IMP, MIC.","**Konvensyen Kebangsaan (Ogos 1954)** – dianjurkan **UMNO (Tunku Abdul Rahman)** dan **MCA (Tan Cheng Lock)**.","Kedua-duanya **mendesak pilihan raya Persekutuan**.","**Parti Perikatan (Oktober 1954)** – **UMNO + MCA + MIC**. Logo: **kapal layar**."]}]}]}],"dates":[["Jan 1949","CLC ditubuhkan"],["1950","RIDA ditubuhkan"],["Apr 1951","Sistem Ahli bermula"],["1951","Laporan Barnes dan Laporan Fenn-Wu; slogan UMNO menjadi \"Merdeka\""],["1952","Ordinan Pelajaran 1952"],["Ogos 1954","Konvensyen Kebangsaan"],["Okt 1954","Parti Perikatan lengkap (UMNO-MCA-MIC)"],["1955","Laporan Woodhead"],["1956","Penyata Razak"]],"kad":[["Apakah Sistem Ahli?","Sistem yang melatih penduduk tempatan mentadbir negara sebelum merdeka (1951–1955)."],["Siapakah pengerusi CLC?","E.E.C. Thuraisingham."],["Mengapakah RIDA ditubuhkan?","Untuk memajukan ekonomi orang Melayu/luar bandar – tolak ansur atas pelonggaran syarat kerakyatan."],["Laporan manakah yang mengekalkan sekolah Cina?","Laporan Fenn-Wu 1951."],["Apakah asas sistem pendidikan kebangsaan?","Penyata Razak 1956."],["Parti dalam Perikatan?","UMNO, MCA dan MIC."],["Slogan API?","\"Merdeka dengan Darah\"."],["Siapakah pengasas IMP?","Dato' Onn Jaafar – parti pelbagai kaum."],["Laporan pendidikan untuk Sarawak dan Sabah?","Laporan Woodhead 1955."]],"kuiz":[{"q":"Apakah tujuan Sistem Ahli diperkenalkan?","o":["Menggantikan Majlis Raja-Raja","Melatih penduduk tempatan mentadbir negara","Menghapuskan ancaman komunis","Menyatukan sekolah vernakular"],"a":1,"e":"Ahli bertaraf \"Menteri\" dan memegang portfolio tertentu."},{"q":"Penyata Razak 1956 penting kerana","o":["mengekalkan sekolah vernakular tanpa perubahan","menjadikan bahasa Inggeris bahasa pengantar tunggal","menjadi asas sistem pendidikan kebangsaan","menghapuskan sekolah Cina dan Tamil"],"a":2,"e":"Menekankan sistem yang sama, bahasa kebangsaan dan kurikulum seragam."},{"q":"Mengapakah British menggalakkan penubuhan CLC?","o":["Kerjasama kaum ialah prasyarat kemerdekaan","Untuk melemahkan UMNO","Untuk menggantikan Sistem Ahli","Untuk mengharamkan parti radikal"],"a":0,"e":"British hanya akan memberikan kemerdekaan jika kaum utama bekerjasama."},{"q":"Parti Perikatan dilengkapkan pada tahun 1954 dengan penyertaan","o":["PAS","IMP","Parti Negara","MIC"],"a":3,"e":"MIC menyertai UMNO dan MCA pada Oktober 1954."},{"q":"Slogan UMNO ditukar daripada \"Hidup Melayu\" kepada \"Merdeka\" pada tahun","o":["1946","1949","1951","1955"],"a":2,"e":"UMNO mula memperjuangkan kemerdekaan melalui perundingan."}],"mnem":["**Empat usaha ke arah merdeka: \"C-S-P-P\"** → **C**LC, **S**istem Ahli, **P**endidikan kebangsaan, **P**arti politik.","**Laporan pendidikan ikut urutan: \"Barnes – Fenn-Wu – Ordinan 52 – Woodhead – Razak\"** (1951, 1951, 1952, 1955, 1956).","**Barnes = Melayu/Inggeris. Fenn-Wu = Cina. Woodhead = Sarawak dan Sabah. Razak = kebangsaan.**"],"nilai":["**Tolak ansur dan permuafakatan** antara kaum ialah asas kemerdekaan.","**Pendidikan** ialah alat perpaduan."],"t":4,"n":7,"title":"Usaha ke Arah Kemerdekaan","id":"t4b7","inti":"British hanya memberi kemerdekaan jika **kaum-kaum bekerjasama**. Maka wujud **CLC (rundingan kaum)**, **Sistem Ahli (latihan mentadbir)**, **pendidikan kebangsaan (Penyata Razak)** dan **Parti Perikatan (UMNO-MCA-MIC)**."},{"secs":[{"h":"8.1 Perkembangan Pilihan Raya","blocks":[{"k":"ul","items":[{"x":"Pilihan raya = rakyat **memilih wakil atau parti** untuk membentuk kerajaan."},{"x":"**Ordinan Pilihan Raya Pihak Berkuasa Tempatan 1950** memberi kuasa kepada majlis tempatan mengadakan pilihan raya."},{"x":"Diadakan **berperingkat**:"}]},{"k":"tbl","head":["Peringkat","Butiran"],"rows":[["**Majlis Perbandaran George Town, Pulau Pinang (1951)**","Pilihan raya **pertama**; memilih 9 orang Pesuruhjaya Perbandaran"],["**Majlis Perbandaran Kuala Lumpur (Februari 1952)**","12 kerusi. **UMNO Kuala Lumpur + MCA Selangor** mula bekerjasama → asas **Perikatan**"],["**Pilihan raya negeri (1954)**","Perikatan UMNO-MCA menang **226 daripada 268 kerusi**"],["**Majlis Perundangan Persekutuan (1955)**","Pilihan Raya Umum Pertama"]]},{"k":"ul","items":[{"x":"**Kepentingan pilihan raya awal:** menyedarkan rakyat tentang **amalan demokrasi**; memberi **pengalaman** mengendalikan pilihan raya; **persediaan ke arah berkerajaan sendiri**."}]}]},{"h":"8.2 Proses Pilihan Raya Umum Pertama (1955)","blocks":[{"k":"ul","items":[{"x":"Diisytiharkan oleh **Sir Donald MacGillivray** (Pesuruhjaya Tinggi)."},{"x":"**Isu bilangan ahli yang dipilih:** Perikatan mahu **tiga perlima** ahli MPP dipilih melalui pilihan raya."},{"x":"**Tunku Abdul Rahman**, Tan Cheng Lock dan T.H. Tan ke **London (April 1954)**; berunding dengan **Oliver Lyttelton** – gagal. Rakyat menderma untuk membiayai rombongan."},{"x":"Akhirnya dipersetujui **52 orang ahli dipilih** melalui p ara kita","Menandakan tamatnya darurat","Bermulanya kerjasama UMNO dengan MCA","Tunku Abdul Rahman dilantik Ketua Menteri"],"a":2,"e":"Gabungan UMNO Kuala Lumpur dan MCA Selangor menjadi asas Perikatan."},{"q":"Mengapakah Tunku Abdul Rahman ke London pada tahun 1954?","o":["Menuntut tiga perlima ahli MPP dipilih melalui pilihan raya","Menandatangani perjanjian kemerdekaan","Membincangkan penamatan darurat","Menuntut penubuhan Sistem Ahli"],"a":0,"e":"Perikatan mahu majoriti ahli MPP dipilih oleh rakyat."},{"q":"Apakah peringkat selepas penamaan calon dalam proses pilihan raya?","o":["Pendaftaran pengundi","Kempen pilihan raya","Penentuan sempadan","Pengumuman keputusan"],"a":1,"e":"Urutan: sempadan → daftar pengundi → penamaan calon → kempen → mengundi → kira undi → keputusan."},{"q":"Apakah kesan penubuhan Majlis Perundangan Persekutuan 1955?","o":["Pesuruhjaya Tinggi dimansuhkan","Singapura menyertai Persekutuan","Darurat ditamatkan","Sistem Ahli dimansuhkan"],"a":3,"e":"Kabinet yang dipilih rakyat mengambil alih peranan Sistem Ahli."},{"q":"Kabinet pertama meminta kuasa veto Pesuruhjaya Tinggi dibatalkan supaya","o":["kuasa pentadbiran British dapat dikurangkan","pilihan raya dapat ditangguhkan","Raja-raja Melayu hilang kuasa","askar Komanwel diundurkan"],"a":0,"e":"Ini langkah ke arah berkerajaan sendiri sepenuhnya."}],"mnem":["**Urutan pilihan raya: \"Bandar → Negeri → Persekutuan\"** = 1951/1952 → 1954 → 1955.","**Proses pilihan raya 1955: \"S-D-C-K-U-K-K\"** → **S**empadan, **D**aftar pengundi, **C**alon, **K**empen, **U**ndi, **K**ira, **K**eputusan.","**\"27-7-55, menang 51/52\"** – tarikh dan keputusan PRU pertama."],"nilai":["Gunakan **hak mengundi** dengan bijak untuk memilih pemimpin yang berintegriti.","**Perkongsian kuasa antara kaum** mengekalkan kestabilan negara."],"t":4,"n":8,"title":"Pilihan Raya","id":"t4b8","inti":"Pilihan raya ialah **asas berkerajaan sendiri**. Ia bermula di **majlis perbandaran (1951)**, kemudian **negeri (1954)**, dan akhirnya **Pilihan Raya Umum Pertama 27 Julai 1955** – **Perikatan menang besar** dan **Tunku Abdul Rahman menjadi Ketua Menteri**."},{"secs":[{"h":"9.1 Usaha Rundingan Kemerdekaan","blocks":[{"k":"ul","items":[{"x":"Rombongan kemerdekaan diketuai **Tunku Abdul Rahman**: **4 wakil Raja-raja Melayu + 4 wakil Parti Perikatan**."}]},{"k":"tbl","head":["Wakil Raja-raja Melayu","Wakil Parti Perikatan"],"rows":[["Dato' Panglima Bukit Gantang (MB Perak)","**Tunku Abdul Rahman**"],["Abdul Aziz Abdul Majid (MB Selangor)","**Dato' Abdul Razak Hussein**"],["Dato' Nik Ahmad Kamil (MB Kelantan)","**Dr. Ismail Abdul Rahman**"],["Dato' Mohamad Seth (MB Johor)","**H.S. Lee**"]]},{"k":"ul","items":[{"x":"Bertolak **1 Januari 1956** dari **Tanjung Pagar, Singapura** dengan kapal **M.V. Asia** ke Karachi, kemudian kapal terbang ke London."}]},{"k":"call","x":"Mengapa naik kapal laut? Supaya ada **masa berbincang** dan **bersepakat** antara wakil raja dengan wakil Perikatan sebelum berunding dengan British."},{"k":"ul","items":[{"x":"Rundingan di **Lancaster House, London**: **18 Januari – 6 Februari 1956**."},{"x":"**Perkara yang dipersetujui:**","sub":["Tarikh kemerdekaan **tidak lewat dari 31 Ogos 1957**.","Menteri Hal Ehwal Ekonomi dan Menteri Pertahanan daripada **rakyat tempatan**.","**Perjanjian Pertahanan** dan bantuan bersama dengan British.","Membentuk **Suruhanjaya Perlembagaan**."]},{"x":"**Perjanjian Kemerdekaan Tanah Melayu** ditandatangani **8 Februari 1956**."},{"x":"**20 Februari 1956** – rombongan tiba di Lapangan Terbang Batu Berendam; Tunku mengumumkan tarikh kemerdekaan di **Padang Banda Hilir, Melaka**. Rakyat melaungkan **\"Merdeka\"**."},{"x":"Tarikh 31 Ogos 1957 dipilih selepas mendapat pandangan ulama **Sheikh Abdullah Fahim**."}]}]},{"h":"9.2 Suruhanjaya Perlembagaan (Suruhanjaya Reid)","blocks":[{"k":"ul","items":[{"x":"Diumumkan **8 Mac 1956**; mula bertugas Jun 1956. Tugas: **merangka Perlembagaan** Persekutuan Tanah Melayu yang merdeka."}]},{"k":"tbl","head":["Anggota","Negara"],"rows":[["**Lord Reid** (Pengerusi)","Britain"],["Sir William Ivor Jennings","Britain"],["Sir William McKell","Australia"],["Hakim B. Malik","India"],["Hakim Abdul Hamid","Pakistan"]]},{"k":"call","x":"Kelima-lima anggota ialah **pakar undang-undang dari negara Komanwel** – tiada orang tempatan."},{"k":"ul","items":[{"x":"**Terma rujukan** (perkara yang mesti diambil kira):","sub":["**Demokrasi Berparlimen** dengan **dua dewan** perundangan.","**Kerajaan pusat yang kuat**; negeri ada autonomi tertentu.","Melindungi kedudukan Raja-raja Melayu sebagai **Raja Berperlembagaan**.","Seorang ketua negara: **Yang di-Pertuan Agong**.","**Satu bentuk kewarganegaraan**.","Menjaga **kedudukan istimewa orang Melayu** dan **kepentingan sah kaum lain**."]},{"x":"**Gerak kerja:** menerima **131 memorandum**, mengadakan **118 perjumpaan**, melawat negeri-negeri."}]}]},{"h":"9.3 Langkah Penggubalan Perlembagaan","blocks":[{"k":"ul","items":[{"x":"**1. Menerima memorandum:**","sub":["**Raja-raja Melayu** – mencadangkan **Yang di-Pertuan Agong** dipilih oleh Raja-raja Melayu, tempoh **5 tahun**.","**Parti Perikatan** – *Testament Amanah Politik Perikatan*.","Isu utama: **kewarganegaraan (*jus soli*)**, bahasa dan pendidikan."]},{"x":"**2. Draf perlembagaan** dikeluarkan: sistem Persekutuan, kerakyatan *jus soli*, kedudukan istimewa orang Melayu, Raja Berperlembagaan, **Dewan Negara dan Dewan Rakyat**."},{"x":"**3. Reaksi:** sebahagian ahli UMNO, **Parti Negara (Dato' Onn)** dan **PAS** membantah kerakyatan longgar; mahu **Islam agama rasmi** dan **bahasa Melayu bahasa rasmi**."},{"x":"**4. Pindaan** – Tunku, Dato' Abdul Razak, Ong Yoke Lin dan V.T. Sambanthan ke London (**9 Mei 1957**)."},{"x":"**5. Kelulusan** – diperkenan **Majlis Raja-Raja**; diluluskan **Parlimen British** dan **Majlis Perundangan Persekutuan (27 Ogos 1957)**."},{"x":"**6. Berkuat kuasa pada 31 Ogos 1957.**"}]}]},{"h":"9.4 Perjanjian Persekutuan Tanah Melayu 1957","blocks":[{"k":"ul","items":[{"x":"Ditandatangani **5 Ogos 1957** di **King's House, Kuala Lumpur** antara **Raja-raja Melayu** dengan **Sir Donald MacGillivray** (wakil Queen Elizabeth II)."},{"x":"Menjadi **asas Perlembagaan Persekutuan Tanah Melayu 1957**."},{"x":"**5 inti pati:**","sub":["**Raja Berperlembagaan dan Demokrasi Berparlimen** – Yang di-Pertuan Agong dipilih setiap 5 tahun.","**Kewarganegaraan** – 3 cara: kuat kuasa undang-undang, pendaftaran, naturalisasi.","**Kedudukan istimewa orang Melayu** dan kepentingan sah kaum lain.","**Agama Islam** agama Persekutuan; agama lain bebas diamalkan.","**Bahasa Melayu** bahasa kebangsaan."]}]}]}],"dates":[["1 Jan 1956","Rombongan Merdeka bertolak dari Singapura"],["18 Jan–6 Feb 1956","Rundingan di Lancaster House, London"],["8 Feb 1956","Perjanjian Kemerdekaan Tanah Melayu"],["20 Feb 1956","Pengumuman tarikh merdeka di Padang Banda Hilir"],["8 Mac 1956","Suruhanjaya Reid diumumkan"],["5 Ogos 1957","Perjanjian Persekutuan Tanah Melayu"],["27 Ogos 1957","Perlembagaan diluluskan MPP"],["31 Ogos 1957","Perlembagaan berkuat kuasa – Merdeka"]],"kad":[["Siapakah pengerusi Suruhanjaya Perlembagaan?","Lord Reid (Britain)."],["Di manakah rundingan kemerdekaan 1956?","Lancaster House, London."],["Di manakah tarikh kemerdekaan diumumkan kepada rakyat?","Padang Banda Hilir, Melaka (20 Februari 1956)."],["Berapa memorandum diterima Suruhanjaya Reid?","131 memorandum."],["Bilakah Perjanjian Persekutuan Tanah Melayu ditandatangani?","5 Ogos 1957 di King's House, Kuala Lumpur."],["Lima inti pati Perjanjian Persekutuan 1957?","Raja Berperlembagaan dan Demokrasi Berparlimen, kewarganegaraan, kedudukan istimewa orang Melayu, agama Islam, bahasa Melayu."],["Negara asal anggota Suruhanjaya Reid?","Britain (2), Australia, India, Pakistan."],["Siapakah ulama yang dirujuk tentang tarikh merdeka?","Sheikh Abdullah Fahim."]],"kuiz":[{"q":"Mengapakah rombongan kemerdekaan menaiki kapal laut ke Karachi?","o":["Tiada perkhidmatan kapal terbang","Untuk menjimatkan perbelanjaan","Untuk berbincang dan bersepakat sebelum berunding dengan British","Untuk melawat negara Komanwel"],"a":2,"e":"Tunku mahu wakil raja dan wakil Perikatan menyusun strategi bersama."},{"q":"Apakah tugas Suruhanjaya Reid?","o":["Merangka perlembagaan Persekutuan Tanah Melayu yang merdeka","Menyelia pilihan raya umum","Menentukan sempadan negeri","Menamatkan darurat"],"a":0,"e":"Suruhanjaya ini dibentuk hasil rundingan London 1956."},{"q":"Raja-raja Melayu dalam memorandum baginda mencadangkan","o":["kerakyatan jus soli untuk semua","pembubaran Majlis Raja-Raja","bahasa Inggeris sebagai bahasa rasmi","jawatan Yang di-Pertuan Agong sebagai ketua negara"],"a":3,"e":"Dipilih oleh Raja-raja Melayu untuk tempoh lima tahun."},{"q":"Isu manakah yang paling banyak dipertikaikan dalam draf perlembagaan?","o":["Sempadan negeri","Kewarganegaraan","Bilangan menteri","Lokasi ibu negara"],"a":1,"e":"Kerakyatan jus soli dibantah kerana dianggap terlalu longgar."},{"q":"Perjanjian Persekutuan Tanah Melayu 1957 ditandatangani antara Raja-raja Melayu dengan","o":["Lord Reid","Sir Gerald Templer","Sir Donald MacGillivray","Sir Edward Gent"],"a":2,"e":"Beliau menandatangani bagi pihak Queen Elizabeth II."}],"mnem":["**Jalan ke merdeka: \"R-S-D-P-M\"** → **R**undingan London → **S**uruhanjaya Reid → **D**raf → **P**erjanjian 5 Ogos → **M**erdeka 31 Ogos.","**Suruhanjaya Reid: \"2B-A-I-P\"** → 2 **B**ritain, **A**ustralia, **I**ndia, **P**akistan.","**5 inti pati: \"R-K-I-A-B\"** → **R**aja dan demokrasi, **K**ewarganegaraan, **I**stimewa Melayu, **A**gama Islam, **B**ahasa Melayu."],"nilai":["**Permuafakatan dan tolak ansur** membolehkan kemerdekaan dicapai tanpa pertumpahan darah.","Kita perlu **menjunjung keluhuran perlembagaan**."],"t":4,"n":9,"title":"Perlembagaan Persekutuan Tanah Melayu 1957","id":"t4b9","inti":"Kemerdekaan dicapai **melalui rundingan, bukan pertumpahan darah**. Urutannya: **Rundingan London 1956 → Suruhanjaya Reid → draf perlembagaan → Perjanjian Persekutuan 5 Ogos 1957 → Perlembagaan berkuat kuasa 31 Ogos 1957**."},{"secs":[{"h":"10.1 Pengertian Kemerdekaan","blocks":[{"k":"ul","items":[{"x":"**Merdeka** = **bebas daripada cengkaman kuasa asing**; bebas menentukan **pemerintahan dan hala tuju negara**."},{"x":"Kamus Dewan: bebas daripada **penjajahan, kurungan atau naungan**."},{"x":"Negara merdeka = negara **berdaulat** (mempunyai kuasa tertinggi)."}]},{"k":"tbl","head":["Tokoh","Takrif kemerdekaan"],"rows":[["**Sayyid Jamal al-Din al-Afghani**","Perlu semangat kebangsaan (*jinsiyyah*) dan cinta tanah air (*wataniyyah*)"],["**Rashid Rida**","Bebas daripada penjajah Barat; menghidupkan sistem khalifah"],["**Mahatma Gandhi**","Merangkumi **politik, ekonomi dan moral**"],["**Nelson Mandela**","Bebas daripada **sistem yang menindas** (aparteid), perhambaan dan kemiskinan"],["**Soekarno**","**Bebas selama-lamanya** – bebas berfikir dan bertindak"],["**Tunku Abdul Rahman**","Ibarat **tempat perhentian dalam perjalanan yang jauh** untuk membina negara baharu"],["**Tun Fuad Stephens**","Keselamatan sosial penduduk peribumi lebih terjamin"]]}]},{"h":"10.2 Persediaan Menyambut Kemerdekaan","blocks":[{"k":"ul","items":[{"x":"Dua jawatankuasa utama: **Jawatankuasa Persediaan Fizikal** dan **Jawatankuasa Sambutan**."}]},{"k":"tbl","head":["Identiti negara","Butiran"],"rows":[["**Stadium Merdeka**","Direka **S.E. Jewkes**; siap 21 Ogos 1957; 22 ribu tempat duduk"],["**Lagu Negaraku**","Berasal daripada lagu ***Terang Bulan*** (lagu negeri Perak)"],["**Bendera Persekutuan**","Dicipta **Mohamed Hamzah** (kakitangan JKR Johor); dikibarkan rasmi 26 Mei 1950"],["**Jata Negara**","Diperkenan Raja-raja Melayu 30 Mei 1957"],["**Bunga kebangsaan**","**Bunga raya** – dipilih Tunku Abdul Rahman"]]},{"k":"ul","items":[{"x":"**Jawatankuasa Sambutan:** hiasan lampu dan pintu gerbang; **75 ribu bendera**; pakaian khas menteri (**baju muskat**); kursus protokol untuk pegawai."},{"x":"Jawatankuasa Pusat Perayaan Merdeka – **Tunku Abdul Rahman**; Jawatankuasa Kerja – **Dato' Abdul Razak Hussein**; Perayaan Ibu Kota – **H.S. Lee**."}]}]},{"h":"10.3 Detik Pemasyhuran Kemerdekaan","blocks":[{"k":"tbl","head":["Masa","Tempat","Peristiwa"],"rows":[["**Malam 30 Ogos 1957**","**Padang Kelab Selangor**","Lampu dipadamkan. Tepat **12.00 tengah malam**: **bendera Union Jack diturunkan** (lagu *God Save The Queen*) – tamat pentadbiran British"],["Malam 30 Ogos 1957","Padang Kelab Selangor","**Bendera Persekutuan Tanah Melayu dinaikkan**; ***Negaraku*** diperdengarkan **buat kali pertama**; laungan \"Merdeka\" 7 kali"],["Malam 30 Ogos 1957","Padang Kelab Selangor","Tunku dikalungkan pingat emas **\"Bapa Kemerdekaan Tanah Air\"**"],["**Pagi 31 Ogos 1957**","**Stadium Merdeka**","**Duke of Gloucester** (wakil Queen Elizabeth II) menyerahkan **Surat Perlembagaan Serahan Kuasa** kepada Tunku"],["Pagi 31 Ogos 1957","Stadium Merdeka","Tunku membaca **Pemasyhuran Kemerdekaan** dan melaungkan **\"MERDEKA\" 7 kali**"],["Pagi 31 Ogos 1957","Stadium Merdeka","**Azan** oleh **Ustaz Hassan Azhari**; bendera dinaikkan; ***Negaraku***; **101 das tembakan**"],["Selepas itu","**Istana Negara**","Istiadat mengangkat sumpah **Yang di-Pertuan Agong**, Perdana Menteri dan Jemaah Menteri"]]},{"k":"call","x":"Jangan terkeliru: **Union Jack turun di Padang Kelab Selangor (tengah malam)**; **Pemasyhuran dibaca di Stadium Merdeka (pagi)**."},{"k":"ul","items":[{"x":"31 Ogos 1957 bersamaan **5 Safar 1377 Hijrah**."}]}]},{"h":"10.4 Kesan Kemerdekaan","blocks":[{"k":"ul","items":[{"x":"**Politik (dalam negara):**","sub":["Mengamalkan **Raja Berperlembagaan** – Yang di-Pertuan Agong ketua utama negara.","**Demokrasi Berparlimen** – rakyat memilih kerajaan melalui pilihan raya.","**Parlimen** menggubal undang-undang Persekutuan; **Dewan Undangan Negeri** bagi negeri.","**Tunku Abdul Rahman** – Perdana Menteri pertama (juga Menteri Luar); **Dato' Abdul Razak Hussein** – Timbalan Perdana Menteri.","Cabaran: **menggantikan pegawai Eropah** dengan rakyat tem
